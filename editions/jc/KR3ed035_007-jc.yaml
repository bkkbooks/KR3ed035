body:
  text: 卷之七骨鯁治一切骨鯁用金鳳花根醋濃煎湯以竹管灌入喉中或用子研灌或入鼻中不可犯齒又方用乳香二錢研細水調徐嚥下又方用砂糖噙化鯁自下又方用朴硝噙化又方用雞蘇朴硝等分丸如彈子大仰臥噙化三五丸即愈又方用野苧根洗淨搗如泥每用龍眼大如被雞骨傷以雞湯化下魚骨傷魚湯化下又方用縮砂甘草等分為末以綿裹少許噙之旋旋咽津久之隨痰出又方用生艾蒿數升水酒各一斗煮取四升稍稍飲之治鯁噎用諸魚燒灰調服治魚骨鯁用獺足於項下爬之亦煮汁服又方用魚尾草一名醉魚兒草搗汁和冷水漱仍嚥下些小自然骨化為水池沼邊不可種恐傷魚又方同瞿麥為末水調方寸匕服治魚鯁骨橫喉中六七日不出用鯉魚鱗皮燒灰水調服則出未出再服治魚骨及雜物鯁用蜜稍稍服之令下治鯁及刺不出用薔薇根末水調方寸匕日三服治魚骨在腹中刺痛用茱萸一合水煮汁一盞服之若骨在肉中不出嚼茱萸封之骨當爛出治魚骨鯁用鸕鷀骨為末服或煎湯飲治魚鯁骨橫喉中用琥珀珠一物貫串著繩推令人至鯁所又復推以牽引出矣又方用飴糖丸如雞子黃大吞之不出大作丸再合治魚鯁用橄欖嚼汁咽又方用楮樹嫩皮搗爛為丸或楮子研碎水下二三十丸治魚骨及竹木物鯁咽不下咽用象牙為末水調一錢服又方用貫眾煎湯頻呷漱聲啞治患卒啞用杏仁三分去皮煎熬別杵桂一分和搗如泥每用杏核大綿裹含細細嚥之日五夜三治無故喉咽聲音不出者名為失音用橘皮五兩水三升煮取一升去滓頓服其聲自出又方用桂心為末頻放舌下漸漸咽汁又方用桂每服三錢水一盞煎七分溫服不拘時聲便出治風冷失聲咽喉不利用蘘荷根二兩研絞汁酒一盞和勻不拘時溫服半盞治失音用槐花瓦上炒令香熟出火毒半夜後仰臥任意服亦治咯血又方用皂角一梃去皮子蘿蔔三枚切片水二盞煎一盞服之不過三四服即聲出眼目治赤目熱痛用硝石研細臨臥以銅箸取黍米大點目眥頭明旦以鹽漿水洗治目暴腫癢痛用地骨皮三斤水三斗煮三升去滓內鹽二兩煎二升敷目治久患內障眼用車前子干生地黃麥門冬等分為末蜜丸如桐子大每服三五十丸臨臥茶清服治目痛及眯傷有熱瞋者用地膚子白汁注目中治目睛疼冷淚羞明怕日及筋脈痛用夏枯草半兩香附子一兩為末每服一錢臘茶調下不拘時服治眼風熱赤膜用枸杞葉搗汁點之治當風眼淚用大枸杞子二升搗破絹袋盛置罐中酒一斗浸訖密封三七日每旦任性服治暴赤眼磣澀疼痛用薺菜根研汁點目中子明目去翳障久服視物鮮明四月八日收實良花將放席下闢蟲治赤眼用青泥蛆淘淨曬乾為末赤眼上干貼之甚效又方用銅綠輕粉牙硝腦子少許麝香研細為末干貼之又方用黃連綠礬杏仁甘草銅綠等分為粗末水煎洗甚效又方用銅綠白土芒硝等分為末丸如皂角子大每服一丸白湯研化洗之立效治冷淚目昏用密蒙花甘菊花杜蒺藜石決明木賊去節白芍藥甘草等分為末茶清調一錢服半月後加至二錢又方用乾薑為末每服一字沸湯點洗又方用貝母一枚膩白者胡椒七粒為末點之治目昏用荊芥穗地骨皮楮實等分為末煉蜜丸如桐子大每服二十丸米飲下又方用川椒一斤微炒搗取紅末四兩甘菊花四兩生地黃一斤搗如泥同和作餅子透風處陰乾再為末蜜丸如桐子大每服三十丸食後茶清下治一切風毒赤眼用當歸赤芍藥黃連黃柏等分為粗末以雪水或甜水濃煎汁熱洗治攀睛淤肉用黃丹一兩二錢水飛白礬一兩銀器內化成汁入黃丹在內以銀鈚攪勻更入乳香沒藥各一錢慢火不住手攪令枯乾為粉候冷研極細入鷹屎一錢半血竭二分麝香少許輕粉三分粉霜二分共研極勻再用熟絹羅過為細末點之大效又方用芒硝一兩螺青沒藥乳香各少許為細末每用少許鼻內搐之治風淚眼用黃連槐樹皮或燒灰共熬湯澄清洗之又方用桑樹臘月不落葉煎湯洗之治赤眼用黃連銼細以驢奶淹浸良久點之又方用黃連秦皮等分加滑石一塊煎湯洗又方用冬青葉濃煮湯入鹽少許熱洗之治眼赤腫痛用艾灰黃連各半兩搗勻煎湯一盞入龍腦少許溫洗又方用大梔子一個去皮明礬黑豆大一塊以生絹包定滾湯小半盞浸一時辰點之又方用臘月羯羊膽一個更加蜂蜜灌滿掛令自干有患者取米粒大一顆放眼內疼痛即愈又方用赤小豆南星末生薑自然汁調成膏貼太陽穴又方用頭垢少許放眼內微疼淚出愈又方用石青乳香各一錢別研枯白礬半錢乾薑末三捻共研細以銅箸點之又方用生薑一塊搗爛生絹絞汁於瓷器凝粉去上面青水乾研細以雄豬膽浸拌勻陰乾再研細點眼治風爛眼用銅綠不拘多少以生薑一大塊切作兩片剜孔銅綠在內仍前合定以線扎住濕紙包三四重灰火內煨一二時取出去姜出火毒研細先用溫鹽湯洗眼淨敷之甚效治一切眼疼用雞子一個剜竅去黃留清封竅以大蘿蔔一枚剜空入雞子在內閉竅封固仍種在地待結子後取出用清點眼極效蘿蔔並苗為末亦可治膈氣又方用防風五倍子等分煎湯頻頻溫洗治害眼上翳用五倍子煎湯以厚紙中剪如眼大一孔覆湯盞上以眼就孔令湯氣蒸眼冷則再熱蒸數遍愈治眼中生翳用蘭香子七枚煎湯一盞服又方用石胡荽熟挼內鼻中翳自落俗名鵝不食草又方用芒硝置器中急火上煉之放冷細羅點眼角中欲臥時二度點之又方用馬牙硝光淨者厚紙裹安在懷內著肉處一百二十日取出研細入少龍腦同研極細不計年遠眼生翳膜昏暗不明但瞳仁不破並醫得每點用藥末兩米粒許又方用珊瑚為末每日稍稍點之即愈又方用烏賊魚骨細研和蜜點之亦治牛馬眼中翳又方用石決明去外面粗皮細研水飛點磨亦可漬水洗眼若青盲內障肝肺風熱宜服七孔九孔者良又方用雀屎小直者以人乳和敷目上消爛盡弩肉白膜若赤脈貫瞳仁及青盲點之極效又方用白沙蜜半斤黃丹水飛過二兩訶子四個沉水者去核柳枝東南向者四十九條置蜜內煉濾過盛瓷器內將訶子黃丹入蜜內風爐上熬順攪不許太過熬成金絲膏用手捻不黏為度又用東南槐條折寸長一碗水三碗熬一碗將前膏解稀用瓷器收貯密蓋頓放地上三日去火毒再用絹濾過方用忌雞犬婦人見不問遠年皆效及治諸般眼疾昏花惟內障不治又方於上藥內加青鹽半兩別研烏魚骨二錢同熬成膏兼治內障眼及用黃連末二兩水三碗就於熬藥鍋內熬數沸將鍋並槐柳條洗淨上藥別用瓷器收之專洗赤冷淚等眼治眼中赤障白膜風淚用青羊膽點眼中治眼赤腫翳痛用鯉魚膽點眼中治目中膚赤或爛弦風癢痛用覆盆子葉絞汁滴目中有蟲出如絲線即效或日乾為末綿裹用男孩乳汁浸少時點眼中治目花翳膜澀痛用貝子一兩燒灰細研入少龍腦點之又方專去翳用貝子十枚燒灰細研取豆大著翳上臥如炊一石米久乃減有息肉者加珍珠末與貝子等分點治赤眼及睛上瘡用秦皮一兩水一升於碗內浸春夏一食時看碧色出即以箸頭纏綿蘸藥仰臥點患眼仍先從大眥中滿眼看微痛勿畏良久三五飯之間即側臥瀝卻熱汁每日十度以上著不過二日瘥治風毒上攻眼腫癢澀痛或赤爛浮翳淤肉侵睛用五倍子一兩蔓荊子一兩半共為末每服一錢水二盞銅石器中煎及一盞澄去滓熱洗極效治眼淚出不止用黃連濃煎汁漬綿干拭目治卒患赤目弩肉痛用好梨一個搗絞汁黃連三枚細銼綿裹漬令色變仰臥注目中治眼築損弩肉出用生杏仁七枚去皮細嚼吐掌中乘熱以綿裹箸頭蘸點肉上不過四五夜即瘥治目熱昏暗用黃連濃煎湯夜間點洗並服又方用黃柏方寸去粗皮新汲水一碗蜜少許同熬濃綿濾過日夜頻頻點洗治眼兩眥赤爛用輕粉夜夜敷之自瘥又方用瀝油於青膩石子上以古錢一文扎杖上磨令油清入膩粉調和塗在瓷碗內以艾如雞子大一塊碗合勿著地燒煙燻之半日取出少少塗於赤爛眥上永瘥治青盲用白犬子未開眼時取乳汁點之日三度半月依舊明朗又方用珍珠四分白蜜二合鯉魚膽一枚同煎三兩沸以綿裹少少點之須半月見效治目多冷淚者用烏雞膽內汁點之治眼睛無故弩出一二分用冷水注竹筒內灌漬之數數自然內入平復如故治眼昏用蔓荊子三升酸酒三升同煮熟曝乾為末以井花水服方寸匕日三服無忌又方用蔓荊菜花陰乾為末每服方寸匕井花水調食後服治眼日落不見物者名雀目用定粉黃蠟各一兩消開入粉放定每用一錢以豬羊肝二片切破入藥在內麻絲纏米泔內入茅根同煮熟食之又方用黃蠟不拘多少消開取出入蛤粉和勻丸成球子每用刀刮一二錢以豬羊肝二兩批破摻藥麻纏定水一碗煮熟取出乘熱熏眼至溫冷食之須臨臥服不過再三又方用蒼朮為末每服一錢不拘時候又方用真正蛤粉炒黃為末以油蠟就熱和丸如皂角子內豬腰子中麻纏蒸熟服之可配米粥治眯物入眼內不出用酥油少許隨眼左右內鼻中低頭令流入眼中淚出其眯物自無又方用好墨清水磨濃滴入眼中即自出又方用新筆蘸水激之即出治內障眼用鯉魚膽同腦子研勻貼太陽穴治眼毛倒睫拔去捲毛用蝨子血點入眼中數次效又方用穿山甲以竹篦子刮去肉以羊腰窩脂去皮膜將甲炙黃用脂擦上數次擦炙令酥為末口噙水隨左右眼鼻內搐一字一月見效又方用木鱉子三個酥炙木賊一百二十節地龍二條去土赤龍爪一百二十個倒鉤棘針也共為末先摘去捲毛每日以紙捻蘸藥搐之一日三五次又方用穿山甲炮地龍去土蟬殼五倍子等分為末先摘去捲毛用藥一字隨左右鼻內搐之次日目下如線樣微腫是驗也治赤瞎用爐甘石二兩密陀僧黃連朴硝各一兩先將黃連水熬成汁入童便再熬後下硝又熬少時用火煅爐甘石紅黃連汁內淬七次與密陀僧末同再研細臨臥貼之治內障用白丁香臘月收者佳飛水八錢黃連防風各一兩新柳枝方一寸者三片用新水一升半雪水更妙春秋浸兩三時冬月一宿銀石器內熬至六分去滓別用蜜一斤密陀僧細末三字入蜜攪勻別熬以無漆匙撩點下蜜中急攪候沸湯定一人攪蜜一人旋旋攪藥汁都下在內攪勻再熬三兩沸色變用新綿三兩重濾去滓盛器中點眼如常每藥半合入片腦一麥粒大不用亦可治一切眼疾用黃連十兩蕤仁三錢去殼研杏仁七十個去皮尖木賊七錢去節草龍膽二兩去土以水一斗浸春秋三日夏二日冬五日入鍋內熬至半升濾出再用水七升熬至小半升濾出再用水五升熬至半升取出重絹濾過微熬傾於碗內重湯煮為膏子盛瓷器內每用米粒大於盞內用水一滴濃化開以釵頭點之三五遍口內覺苦立效治眼目昏花用甘菊花一斤紅椒去目六兩為末以新地黃汁丸如桐子大每服五十丸臨臥茶清下又方用爐甘石研代赭石煅醋淬七次黃丹水飛各四兩為末白沙蜜半斤用銅鍋煉去白沫更添水五六碗熬沸下前末以文武火熬至一碗用銅器攪試將藥滴水中沉下為度以夾紙四重濾於瓷器內貯密封不時點之有驗治眼目昏暗淚出羞明怕日癮澀難開或癢或痛及遠年近日內外障攀睛淤肉翳膜青盲並皆治之最宜常服用白羊肝一個洗淨去膜黃連搗為細末將羊肝入砂盆內杵爛旋入黃連末拌研丸如桐子大每服四十丸食後溫漿水下忌食豬肉蒜生萵苣冷水等物治眼倒睫用蝟刺棗棘針香白芷青黛等分為末左眼倒睫口噙水左鼻內搐之右眼倒睫右鼻搐之治眼內弩肉用白礬為細末仰臥少少點之治遠年風眼用杏仁一十一個去皮尖分作三分粉草一寸分作三分漱口淨將杏仁甘草各一分同嚼如泥吐於瓷盞內三分俱嚼爛用銅綠二錢研極細與前藥和勻以新汲水一盞漱口吐於藥內攪勻以帛濾過澄清於眼大角點之立效勿令塵於藥內治近年眼疾用銅綠研寒水石研等分為細末以五七沸滾水浸在藥內攪勻澄清將水面上藥膜掠去以清藥水於眼大角點之勿令塵入藥內立效治目風眼寒及偏正頭疼夾腦風鼻出清涕目淚疼痛用石膏二兩炭火燒研細川芎一兩甘草半兩炙為末每服一錢蔥白好茶煎湯調下日二服食後治一切眼目淤肉攀睛風癢淚落不止用朴硝一斗以水半罐淘淨去土陰乾白丁香五升以水一罐淘淨去土攪細黃土半斤為末以水將硝香熬至七分淘出令經宿水面浮牙取出控干以紙袋盛懸風中至風化將黃連細末熬清汁曬乾硝用豬膽和加蜜點之效治一切風眼疼痛不可忍者用岩蜜一斤黃連一兩沒藥半兩黃丹二兩炒紫色入蜜同熬黑煎黃連成稠汁入二味藥內熬稠更入沒藥末同熬數沸濾去滓洗甚妙治一切疳眼亦爛目生翳膜內外障並小兒吐利疳瀉用白藥子一兩甘草半兩為末用豬肝一葉批開摻藥五錢水一碗煮熟食後服治一切新久赤目疼痛不能坐臥並大小人口瘡用胡黃連檳榔各半兩麝香少許別研共為細末點之如口瘡每服半錢麝香一字和勻貼之忌食魚豬油膩物治赤眼冷淚並頭風耳聾耳癢鼻塞聲重用乳香沒藥川芎石膏雄黃各二錢盆硝半兩共為細末每用少許搐鼻內牙疼亦即止洗頭明目方用鳳眼草即椿樹上叢生莢也燒灰淋水洗頭經一年眼如童子加椿皮灰尤佳用正月七日二月八日三月四日四月五日五月二日六月四日七月七日八月三日九月二十日十月二十三日十一月二十九日十二月十四日洗治眼昏翳膜遮睛怕日羞明一切風毒眼用羌活防風柴胡甘草炒等分為末每服二錢水一盞煎食後服或薄荷茶清菌花苗煎湯皆可服忌諸毒物治眼昏常見黑花多有冷淚用枸杞子三兩蓯蓉酒浸炒二兩巴戟去心一兩甘菊花四兩為末煉蜜丸如桐子大每服五十丸食後溫酒鹽湯下治風熱上壅眼赤澀睛痛多淚用赤芍藥當歸黃連等分為末每服二錢用極滾湯乘熱熏洗冷卻再溫日三五次治去翳膜明目用潔白芒硝五兩置硝銀鍋內以新瓦蓋用炭火慢慢熬熔清汁鉗出鍋傾汁在別器中凝結如玉者方好研極細入龍腦等分點或吹鼻中立效治肝經蘊熱眼目赤腫用荊芥穗當歸赤芍藥各一錢黃連七分水一盞煎三沸去滓洗治風熱眼弦赤爛用乳香一錢半別研黃連半兩荊芥燈心一百莖每用二錢水二盞煎一盞濾去滓熱洗治爛弦風眼目癢痛時常出淚用黃連淡竹葉各一兩柏樹皮二兩一半生一半乾銼細水三升煎至五合稍冷洗爛處治男子腎虛目昏視遠不明漸成內障用白茯苓八兩去皮枸杞四兩酒浸蒸當歸二兩酒洗青鹽一兩別研菟絲子酒浸蒸為末煉蜜丸如桐子大食前湯下七十丸治眼上暈用川芎連翹槐角各二兩白芝麻生去皮四兩為末每服三錢新汲水調下日三服勿間斷即效治風赤眼痛用盆紉草搗膏為丸每用一丸浸湯洗之不過五七次立效治眼昏活血明目用瓢搖豆為末每服一二錢濃煎甘草湯調服治眼目昏暗用水銀草每服三錢入木賊少許水一盞煎八分去滓通口服不拘時治目中赤膚用覆盆草葉絞汁滴目中有蟲出如絲便效又汁合膏塗發不白治積年失明不識人用決明子為末食後以粥飲方寸匕亦治青盲白膜赤痛淚出肝熱取葉作菜食之治赤眼用皺面五葉草並龍膽草同為末每服一錢以熟羊肝蘸嚼服治赤眼疼痛用乾薑為末水調半錢服治目疾但瞳子不壞者十療九愈用蔓荊子六升蒸氣透以甑下熱湯淋曝乾還淋如是三遍為末食上清酒服二寸匕日再服又方用蕪菁子三升苦酒三升煮熟日乾為末井花水服方寸匕加至三匕日二服無所忌常服明目洞視肺腸治赤眼腫用梔子銅綠飛礬杏仁等分為末水調澄清洗之治眼昏用四月內收風落小胡桃每日午時食飽以無根水吞一雙下偃臥睡覺鼻孔內有泥腥氣為度忌發眼熱物又方用羯羊膽以珍珠末填入懸屋西北角陰乾百日丸如小豆大一日服一丸久則能視遠又方用美酒五升以硃砂五兩浸五宿曝乾研細蜜丸小豆大每服二十丸久則明目輕身去三尸除瘡癩又方用杏仁七個銅青三錢研細蜜調貼碗內以艾一團燒熏之用漿水浸洗治一切眼疾治目昏不見物用楮桃荊芥穗各五百枚為末煉蜜丸如彈子大食後嚼一丸日三服薄荷湯下治風淚眼用秋王瓜一枚竹刀去瓤以盆硝裝在瓜內懸背陰處下用瓷器接摘下硝水及每日掃取瓜上霜亦用瓷器收貯點眼亦治風赤治火眼赤腫並翳用黃連捶碎黃柏去粗銼細各二兩水七碗於銀銅器內熬至三碗去滓再熬成膏入少龍腦瓷器內收貯點眼治風爛眼用銅青水調塗碗底以艾熏成膏刮下塗爛處又方用黃連不拘多少瓦器水煎減半綿絹濾去滓以瓦盞盛薑湯瓶上蒸之至汁少卻入腦子少許淨器收貯點一切眼疾治暴赤眼用瓦瓶煎薄荷荊芥防風湯乘熱氣熏之仍以手沃洗又方用熱湯一器緊閉眼以手掬湯沃之湯冷即止頻沃即安治障翳諸眼用朴硝十兩湯泡濾過碗盛炭火熬干置地上一宿用黃丹二兩飛過麝香半錢研細加腦子再研點眼內治打傷眼血侵睛用桃柳嫩枝生地黃豬肉同捶爛貼眼上治心間積熱眼有赤筋貫瞳仁用玄參為末以米泔煮豬肝蘸藥末細嚼就以煮肝汁嚥下治諸般眼疾用黃連當歸赤芍藥滑石為末湯泡洗若翳障加石膏乳香秦皮風爛赤加蔓荊子五倍子去瓤湯泡洗治眼弩肉用臘月雄豬膽入馬牙硝在內風吹乾為末入腦麝少許點之又方用銅青白墡粉五倍子為末熱湯泡閉目熱洗冷再熱洗之爛弦者最效治熱赤眼用桑葉大黃荊芥朴硝等分為末蜜調貼兩太陽穴上退熱血治眼上翳障用栝蔞根甘草赤芍藥草決明等分為末每服一二錢臨臥蜜湯調下口吻治口瘡用牛膝酒漬含漱又方用五倍子末摻之便可飲食又方用薔薇根避風打去土煮濃汁溫含冷則易治口瘡番白用桑樹汁先以發拭口次以汁敷之治口瘡久不合用亂髮露蜂房蛇蛻皮各燒灰存性每服一錢酒調服治口舌生瘡爛用黃柏片含之或用醋漬含治口舌及喉中生瘡爛用蘘荷根酒漬半日含漱其汁治唇上生瘡連年不瘥用八月藍葉一片搗汁洗不過三月瘥治口舌生瘡胸膈疼痛用豉炒焦為末含一宿瘥治口瘡用白礬泡湯灌漱以銅綠麝香研末乾摻又方用乾薑黃連二味於口中細嚼流涎出治大小人口瘡久不效用附子為末醋調男左女右貼腳心自愈治白口瘡用巴豆三枚去皮不去油黃丹半錢同研如泥塗葉上如大棋子貼眉間須臾四圍瘡如蠶子去藥大效又方用澱粉巴豆同研如泥如上貼眉間亦效治赤口瘡用角蒿燒灰貼之又方用黃柏為末摻之有涎勿嚥下治口瘡並風疳用晚蠶蛾為末貼之治大小人口瘡並疳宣露牙齒並胸前瘡久不效用娥蒿燒灰為末塗之有津勿嚥下忌油膩角蒿是也治吻瘡用白楊樹枝火燒一頭焰出注於刀上取汗貼兩吻上不過三度即瘥治口乾用滑石碎之水煮數沸以新綿漬之口內含咽津治口瘡用白礬一兩飛至半兩黃丹一兩炒紅色放下再炒紫色為度為末摻瘡上立愈治口舌生瘡咽喉腫塞用蒲黃一兩盆硝八兩青黛一兩半以生薄荷汁一升同和勻瓷罐盛慢火熬干細研用一字或半錢摻口內良久吐出痰涎如喉中瘡痛用竹管吹藥半錢入咽膈內立效治口舌生瘡兩唇腫裂用晚蠶蛾五倍子密陀僧各一兩為末每用少許干敷瘡上有津吐去治口舌生瘡咽膈腫痛用寒水石煅三兩辰砂二錢半別研生腦子半錢為末每以少許摻患處治上盛痰壅唇口拆裂舌上瘡用甘菊花枸杞子肉蓯蓉巴戟等分為末蜜丸如桐子大每服五十丸米飲下治口舌生瘡用細辛黃連等分為末先以布巾揩淨患處摻藥在上涎出即愈又方用縮砂火煅為末摻瘡即愈又方用檳榔燒灰存性為末入輕粉和勻摻又方用膩粉杏仁十粒去皮尖臨臥細嚼令涎出再用又方用草烏南星各一個生薑一塊焙乾為末每服二錢臨臥時以好醋調作厴子貼手腳心治口瘡臭爛久不瘥用黃柏半錢螺青二錢研細臨臥置一字在舌下不妨咽津或以銅綠易螺青治口舌生瘡用朴硝一錢寒水石煅一兩入少硃砂同研如桃紅色敷患處嚥下不妨味苦加甘草又方用五味子一兩滑石黃柏蜜炙各半兩為末每服半錢乾摻瘡上痛甚者良久便可飲食又方用硼砂瘡甚者加腦子研黃柏日乾薄荷葉等分為末生蜜丸如龍眼大每服一丸噙化治急疳蝕口鼻數日盡欲死用海中文蛤燒灰臘月豬脂和塗之治口瘡用蠶故紙燒灰存性為末敷患處治唇吻燥痛用橄欖核仁研敷治口瘡用甘草白礬等分為末噙化又方用吳茱萸為末醋調塗腳心又方用朴硝五味子滑石黃柏蜜炙白礬枯黃丹炒寒水石煅延胡索等分為末疼不可忍者摻上良久即愈口氣治口氣臭用白礬麝香為末擦牙齒上又方用香薷一把水一斗煮三升稍稍含之又方用甜瓜子為末蜜丸如棗核大每旦洗漱畢含一丸亦以揩齒又方用丁香二錢甘草炙一錢川芎二錢香白芷半錢為末煉蜜丸如彈子大綿裹每服一丸噙化又方用細辛煮濃汁含漱蟲物入口治因熱取涼睡著有蛇入口中挽不出用刀破蛇尾入生椒二三粒裹定須臾即自出治飛絲入口用紫蘇葉細嚼白湯送下即無恙治狼煙入口即用好醋飲少許解之舌頰治心脾熱舌頭生瘡用黃柏蜜塗炙青黛各一分為末入龍腦一字研勻摻瘡上有涎即吐出治舌上忽出血如簪孔者用香薷一握濃煎汁服亦治心煩去熱治舌腫用百草霜為末好醋調敷又方用亂髮燒灰水調方寸匕服治重舌用鏽鎖燒紅打下鏽為末水調一錢噙服又方用百草霜為末蜜調敷患處立效治心脾壅熱生木舌腫脹用玄參升麻大黃犀角各七錢半甘草半兩為末每服三錢水一盞煎五分溫服治重舌用生白礬黃丹飛過五倍子等分為末蜜調塗舌上少頃以水漱之再塗以瘥為度又方用蒲黃少許擦舌上即消治舌腫硬用百草霜食鹽等分井花水調塗舌上愈治重舌喉閉用朴硝白礬為末摻入口中又方用好醋磨膽礬噙吐出涎愈治舌忽脹出口外用雄雞冠上刺血瓦盞盛浸舌就嚥下即縮牙齒治齒痛用白礬燒灰露蜂房微炙等分水煎數沸熱漱冷即吐換治齒痛及落盡用膽礬細研以人乳汁和如膏擦痛處或孔中日三四度止痛百日後復生齒每日以新汲水漱令淨治齒腫痛及口氣用細辛煮濃汁熱含令冷吐出即瘥治齒蟲腐爛用棘針二百枚水二升煎一升頻頻噙漱治齒蟲痛不可忍嚼薰陸香咽其汁瘥治齒間血出用白礬煎湯含漱治牙齒根動用生地黃濃煎汁漱飲治牙蟲用雄黃末蜜丸如棗核塞牙間又方用蘆薈為末先以鹽揩齒令淨然後敷少末於上治牙痛燒牛膝灰塗牙齒間治牙宣用礬石一兩水三升煮一升噙漱治牙痛多將蒼耳子濃煎汁含漱又方用山豆根一片含於疼處治牙齲疼有蟲用雄雀屎綿裹塞孔內日一二次易之治牙宣牙癰用蠶蛻紙燒灰存性揩齦上治牙縫出血用蟾酥以紙捻子蘸少許於血出處按之立止治齒齦宣露用蚯蚓屎水和為泥火燒極赤為末臘用豬脂和敷上日三永瘥治牙蟲用杏仁燒煙未盡研如膏物裹內孔中治牙齒蛀孔痛用莽草為末綿裹內孔中或於痛處咬之低頭吐津勿咽治風蟲牙痛頰腫用莽草五兩水一斗煮五升熱含漱吐之一日盡治風蛀齲齒用郁李根白皮水煮濃汁含之冷即