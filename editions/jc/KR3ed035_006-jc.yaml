body:
  text: 卷之六癲癇治風癇並中風痰壅用黃丹白礬各二兩以新磚一塊鋪紙於上先將丹鋪紙上次以礬鋪丹上以紙掩蓋卻用十斤柳柴燒過為度出火毒研細每服一錢溫酒調下治風癲脅痛耳如蟬鳴吐逆用天門冬去心皮干為末酒調方寸匕服治豬羊癇用水銀黑鉛辰砂乳香各一兩三錢先將鉛化開入水銀用柳木捶研次下辰砂研細下乳香研勻丸如雞頭肉大置淨水碗內每服二丸午前半飢飽時井花水送下良久吃白粥一碗三四服可愈治驚癇精神恍惚語言錯謬歌笑無度用狐肉一斤及五臟豉汁中煮五味作羹或作炙食兼治五臟積冷蠱毒寒熱治五種癇疾痰涎壅塞牙關緊急目睛上視時或搐搦用石碌細研九度飛過十兩附子尖烏頭尖蠍梢各七十個共為末麵糊丸如雞頭大每服用薄荷汁半盞化下一丸更以酒半合溫服之須臾吐出痰涎如牙關緊斡開灌之治癲癇凡額上手中文理赤者用莨菪子三升杵碎以酒一升漬半日絞汁入瓷器重湯內煮令可丸如小豆漸增如桐子大每服二丸溫酒送下每日發者三日而愈間日發者服十日愈五日一發者二十日愈半歲一發者服一月而愈治遠年近日風癇心恙風狂中風涎末潮閉牙關不開破傷風搐用皂角不蛀肥者一斤去皮弦切碎以酸漿水一碗浸春秋三四日夏一二日冬七日揉去滓將汁入銀器或砂鍋慢火熬以槐柳枝攪成膏取出攤厚紙上陰乾收頓用時取手掌大一片以溫漿水化在盞內用竹筒灌入病人鼻孔內良久涎出為驗欲涎止將溫鹽湯飲一二口便止忌雞魚生硬濕面等物治諸癇風用威靈仙稍多防風荊芥防己麻黃杏仁細辛川芎白芷等分銼碎姜三片酒盞半煎七分發時熱服後用黃荊條火炙取兩頭津水和臘酒吞金箔鎮心丸下忌發風毒物不問男女年久者皆效積熱治風熱積壅消食化氣導血用大黃四兩牽牛四兩半生半熟為末煉蜜丸如桐子大每服茶下十丸要利十五丸冬月尤宜並不攪人治熱煩滿不能食用豨薟草生搗汁服三四合治心經留熱小便赤澀用梔子去皮炮甘草炙大黃連翹等分為末水煎三錢服無不效又方用紫花梨搗絞汁服即愈治熱氣結滯經年數發用胡荽一斤五月五日採陰乾水七升煮一升半去渣分服未瘥再服春夏葉秋冬根莖皆可用治熱病煩滿目黃赤小便黃及酒疸用苜蓿搗汁服一升令大吐愈治發熱口乾小便澀用甘蔗去皮嚼咽汁若口痛搗取汁服治熱毒攻手足痛腫用蒼耳濃煎湯漬之治熱毒用雞子白三個和蜜一瘥一合合服之差治溫毒熱病積在胸中煩亂欲死者用芫花一升水三升煮取一升以故布蘸濕搭胸上不過二次止治五臟伏熱煩滿皮肉如火用凝水石為末每服一錢水調下橫理者為凝水石順理者為寒水石治邪氣腹內熱結目黃不下食大小便澀骨間熱咳嗽痰飲殺蟲去蠱小兒寒熱不定並用皮弁草子煮汁服之治積熱大便秘結心膈煩躁用黃連黃芩大黃煨等分銼細每服四錢水一盞煎七分空心服或煉蜜丸如桐子大白湯下四十丸治風熱結滯或生瘡癤用大黃一錢荊芥三錢水一盞煎六分空心服治膈熱解酒毒厚腸胃用黃連半斤酒二升浸以瓦器置甑上蒸爛曝乾為末滴水丸如桐子大每服五十丸食前溫水吞下治大人小兒蘊邪熱痰涎壅盛腮項結核生瘡癤用防風鼠黏子炒各一錢荊芥甘草炙各錢半水一盞煎七分食後溫服治邪熱膈上氣滯五臟秘澀用玄明粉一錢或二錢臨臥桃花煎湯或蔥白湯下造粉法以朴硝煎過澄濾五七遍露於星月下自結成塊用瓷罐按實鹽泥固濟炭火內煅成汁煎沸直候不響再加頂火一煅卻傾淨地上瓷盆蓋一宿去火毒研細每一斤入生熟甘草末二兩攪勻用此藥煅過性溫無毒白色者中用黃者不堪初以蘿蔔同煎去咸尤妙痼冷治身患痼冷疼痛用川烏為末好醋調攤絹上貼之即愈治大腸久冷用威靈仙為末蜜丸如桐子大於一更內生薑湯下十丸至二十丸治一切冷氣艾葉乾薑等分為末蜜丸如桐子大每服二三十丸酒吞下治心腹冷氣痛用菖蒲二三寸捶碎同吳茱萸煎湯飲或細嚼菖蒲一二寸以熱湯或酒送下亦效治一切沉寒痼冷諸證用乾薑一兩附子一枚生去皮臍銼細每服三錢水盞半煎七分食前溫服治臟腹中虛冷衝心心下結硬並腳氣衝心疼痛用陳皮一斤杏仁五兩去皮尖麩炒蜜丸如綠豆大每服三十丸食前溫米飲下治腰腳濕冷用麥麩蒸熟袋盛熨之亦治驢馬治冷氣用胡椒吞三七枚或研酒服亦可治下元虛冷用胡椒肉破故紙為末蜜丸如桐子大每服三十丸空心酒下治陰冷漸入陰囊腫滿日夜疼悶不能眠用生椒以帛裹著丸囊令厚半寸須臾熱氣大通日再易之即瘥自汗治諸虛不足及大病後體虛常自汗用黃耆麻黃根牡蠣米泔浸火煅赤等分每服三錢水一盞小麥百餘粒煎八分不拘時服治盜汗用麥面作丸子淡煮臨臥吃少許空心服妙香散又方用浮麥一抄煎湯調防風末二錢服或用牡蠣散又方用椒目微炒為末每服半錢匕以豬上唇煎湯一合調臨臥服無不效蓋椒能行水及治水蠱又方用豉一升微炒酒三升漬三日取汁冷暖任服三兩劑即止又方用五倍子末以唾調填滿臍中縛定一宿即止治自汗頭眩痰逆噁心用撫芎白朮各炒橘紅各一兩甘草炙半兩每服四錢水一盞姜七片煎八分溫服治氣虛陽弱虛汗不止肢體怠倦用黃耆蜜炙附子炮去皮臍等分銼細每服四錢水一盞姜十片煎八分食前溫服治盜汗並陰汗出不已用牡蠣生為末摻有汗處不過三次即止治夜汗不止用黃耆白朮防風等分每服五七錢水盞半煎七分溫服惡寒加桂枝虛煩治心煩悶用白朮末水調半錢匕服治膽虛睡臥不安心多驚悸用酸棗仁一兩炒香為末每服二錢竹葉湯調下不拘時治不得眠用榆白皮陰乾為末每日朝夜用水五合末三錢煎如膏服兼治衄五淋治大病之後晝夜虛煩不得睡用酸棗仁榆白皮等分煎汁溫服則自睡矣大妙治大病後虛煩不得睡臥及心膽虛怯觸事易驚短氣悸怖或復自汗用橘紅一錢半枳實洗炒半夏湯洗七次各一錢甘草炙茯苓各半錢水一盞姜七片棗一枚竹茹一塊如錢大煎六分空心熱服治發汗不得心中大煩骨節疼痛目眩惡寒食返嘔逆谷不得入用橘皮三錢半甘草炙竹茹各一錢人參少許水一盞姜三片棗一枚煎七分空心溫服治大病後煩熱不安及一切虛勞煩熱用地骨皮二錢半防風一錢半甘草末半錢水一盞姜五片煎八分溫服不拘時治胃口有熱嘔吐咳逆虛煩不安用人參一錢半夏二錢竹茹一團姜七片煎溫服一方加橘皮二錢健忘治健忘用菖蒲為末酒調方寸匕服常服聰明益智若七月七日取菖蒲酒服三方寸匕飲酒不醉不可犯鐵令人吐逆又方丁酉日密自至市買遠志著巾角中還為末服之勿令人知又方用白商陸花陰乾百日搗末日暮水服方寸匕臥思念所欲事即於眼中自覺又方戊子日取東引桃枝三寸枕之又方五月五日日未出時取東向桃枝三寸刻作人形著衣帶中又方遠志菖蒲等分煎湯常服治心氣不定恍惚多忘用遠志去苗心菖蒲各二兩人參白茯苓去皮各三兩為末煉蜜丸如桐子大以硃砂為衣每服二十丸米飲下治思慮過度勞傷心脾健忘怔忡用白朮茯神各二錢人參甘草木香各半錢水一盞姜五片棗一枚煎七分溫服不拘時治心神不定事多健忘心火不降腎水不升用茯神去皮二兩沉香半兩為末煉蜜丸如小豆大每服三十丸食後人參湯下陰㿗治陰囊㿗墜用狐貍陰莖炙乾為末空心溫酒服一錢匕治腎偏大用牡丹皮防風等分為末每服二錢食前溫酒調下治大人小兒腎腫偏大有氣上脹行走腫痛用牡丹皮防風肉桂黃柏炙桃仁炒等分為末酒服方寸匕二十日愈小兒乳汁和大豆許服之忌蔥蒜大驗治陰腎腫痛用萵苣子一合為末水一盞煎五分去渣溫服不拘時不過三服大驗治偏墜用茴香炒山糖球肉各一兩為末水糊丸如桐子大每服三十丸空心白湯下治男子陰腫如斗大核痛用蕪菁根搗和醋敷之治腎風陰囊癢用豬尿胞火炙熟空心吃鹽湯嚥下又方用皂角包糯草內燒煙燻之十餘遍愈治外腎腫脹用茴香炒全蠍炒穿山甲炙木香等分為末每服二錢酒調下痛止立效又方用五苓散去桂加黑牽牛吳茱萸湯泡枳殼麩炒痛甚再加八角茴香煎服治陰汗用綿黃耆切細入銚中滴酒炒脆為末以豬心煮熟蘸末服之效又方用蛇床子石菖蒲等分為末一日三兩次塗搽之治陰腫痛用荏葉杵為泥敷之腫即消大效治陰囊腫痛小腸氣用乳香蠍梢各一錢川烏去皮生用三錢為末每服一錢水一盞煎七分入鹽少許空心連渣熱服立效治偏墜搐痛臍下脹痛外腎腫硬陰間濕癢成瘡小腸疝氣用吳茱萸一斤湯酒醋童便各浸四兩經宿焙乾澤瀉二兩為末酒糊丸如桐子大每服五十丸空心鹽酒或鹽湯送下治陰痛不可忍用吳茱萸先炒茴香檳榔各一兩為末醋糊丸如桐子大食前熱酒下十丸治偏墜用茴香甘遂等分為末每服二錢溫酒調下又方用巴戟去心川楝炒茴香炒等分為末每服二錢溫酒調下治小兒疝氣腫硬用地龍不去土為末唾津調塗治陰下濕癢用蒲黃末敷之又方用蛇床子煎湯洗治陰囊上瘡用蠟面茶為末先以甘草煎湯洗後貼之治陰汗用沒石子燒灰先以溫湯洗了卻以帛包灰裹敷囊上治大人小兒外腎偏墜用防風牡丹皮等分為末每服二錢溫酒調服鹽湯亦可治交接勞復陰囊腫脹痛入腹中刮竹青皮一升以水三升煮一半去渣分服立愈治陰潰用地膚子煎湯洗治男子陰腫核痛用馬鞭草搗爛塗敷治卒外腎偏腫疼痛用大黃末醋和塗干即易之治陰生濕疱瘡用硫黃研細敷瘡上日三度治男婦陰瘡腫痛癢囊濕用槐白皮煎湯洗浸治男子陰頭癰用鱉甲一枚燒灰以雞子清和敷之治下部蟲齧用梅葉一斛杵爛蒸極熱內小器中布覆上坐蟲死治陰生瘡膿出用白礬麻仁等分煉豬脂和成膏槐白皮湯洗瘡拭乾塗藥以秋葉貼上不過三度瘥治陰汗用白礬燒灰投一匙於沸湯中淋洗陰痿治陰痿用蛇床子濃煎湯浸洗又方用地膚子陽起石等分為末每服方寸匕酒調服治陰痿並陰汗用陽起石為末每服二錢匕空心鹽湯調下治男陰痿女子帶下及疝瘕用雀卵白和天雄菟絲子末為丸如桐子大空心酒下五丸治陰痿用覆盆子取汁作煎點湯服並益顏色安五臟養精氣強陰女子食之有子及療中風身熱肺臟虛寒驚悸益力長髮明目縮小便腹內生蟲治寸白蟲用雷丸水浸軟去皮切細焙乾為末五更初先食炙肉少許便以一錢匕稀粥一盞調服酒下半錢蟲乃下又方用金櫻子東行根銼二兩入糯米三十粒水二升煎五合空心服須臾瀉下又方用茱萸根洗淨銼四兩酒水各一升漬一宿平旦分再服又方用酸石榴東引根切一升水二升三分煮八合去渣著少米作粥空腹食之即蟲下一方用東引根一握洗淨銼水三升煎半碗去渣五更初溫服至明取下蟲一大團永絕根一日吃粥補又方用櫻桃東行根煎湯服治蛔蟲吐水心痛用鶴蝨三兩為末蜜丸如桐子大平日漿水服二十丸即瘥治蟲咬心痛用鶴蝨一兩為末空心溫醋下蟲當出治諸蟲在臟腑久不瘥用檳榔半兩炮為末每服一二錢空心蔥蜜煎湯調下治脾胃有蟲食即痛面黃無色疼痛無時用石州蕪荑仁二兩和麵炒黃為末米飲調二錢下不拘時治疳蟲蝕人脊骨用鼠李根煮汁空心服一盞少時當瀉治一切蟲用麻油一合雞子二合芒硝一兩攪勻服之少時即瀉治胸喉間覺有症蟲上下遍聞蔥豉食香此是發蟲油煎蔥豉令香二日不食張口將油蔥豉放口邊蟲當漸出徐徐以物引去之治宿冷蟲寸白蟲每朝空心用山豆根末三錢熱酒調下其蟲自出治腹中聞蚯蚓鳴及中其毒先飲鹽湯一杯次以鹽湯浸洗即愈治寸白蛔蟲用蜂窩燒灰酒調服又方用黑牽牛頭末每服三錢以豬肉四兩薄切摻藥末空腹食盡即取下蟲治臟腑有蟲心腹脹滿不能飲食幾至於死用羊肝和蒜薤食之遂下一二升如粉粥寸寸是蟲更不復發若口中生瘡服之亦效中惡治卒中惡短氣不省人事欲死及療諸昏迷用麻黃四錢甘草一錢桂心二錢杏仁八十枚水七升煮取三升分三服不拘時立效治中惡卒死用菖蒲生根搗絞汁灌之立瘥又方用女青屑一分安鼻中以水或酒送下立活治卒中惡心痛用茱萸五合酒三升煮三沸分三服又方用桂心八分銼細水四升煮一升分二服治中惡或先病或常居寢臥奄忽而絕用薤搗汁灌鼻中治卒死無脈無他形候者牽牛臨鼻上二百息牛不肯舐者以鹽汁塗面上即肯舐治中惡客忤卒死者用皂角末吹鼻或研韭汁灌耳中以艾灸臍中百壯治中惡卒死及魘魅自縊溺水壓攧產難氣絕者用皂角末或半夏末丸如豆大內鼻中嚏則氣通可活或只以末吹鼻中但凡卒死心頭溫者可治治卒死心頭熱者用百草花曝乾水漬封埋百日砂鍋內連水熬稠丸如皂角子大放一丸入患人口內須臾即活大妙治中鬼氣死口鼻出血用雄黃末一錢煎桃葉湯調下治一切痓氣或近屍惡氣入腹久不愈用阿魏打如麻子大以麵裹作餛飩煮熟食之日三至五七日永除忌五辛濕面生冷油膩硬物治中惡客忤睡死用麝香一錢研和醋二合服之即瘥治屍厥奄然死去腹中氣鳴用生薑汁半盞和酒煎沸灌之仍灸丹田百會氣海穴治被鬼擊用灶心土為末每服二錢新汲水調下及以少許吹鼻中又方用桃柳東行枝各三七寸煎湯二盞溫灌之治恍惚見鬼發狂用平胃散加辰砂末棗湯調服治卒中惡不省者用韭菜研汁灌入鼻中治屍壓如死脈動如故用灶突中黑煤土如彈子大一塊漿水和飲之又方用豆豉水煮汁服之又方用官桂為末水調灌之瘟疫治瘟疫用正月上寅日搗女青末以三角絳囊盛系前帳中大吉又法佩帶此末一兩在身則疫癘不犯又方用硃砂一兩細研以白蜜丸如麻子大常以太歲日平旦一家大小勿食諸物面向東立各吞三七丸勿令近齒治時氣瘴疫用杜仲西南柏樹東南枝為末水調一錢日三四服治天行時氣宅舍怪異用降真香燒之悉驗亦能召鶴小兒帶之能辟惡邪之氣治天行瘟病用松葉切如米酒服方寸匕日三闢五年瘟治天行疫癘用東行桃枝銼細水煮浴身佳治時疫立春後有庚子日煮蕪菁合家大小咸服不限多少可理時疾治溫病用松菜切如粟米酒服方寸匕又方用大豆三升以新布盛內井中一宿取出每人服七粒又方用赤小豆以新布囊盛之置井中三日取出舉家男十枚女二十枚服治瘟氣脾腫用赤小豆和桑白皮煮食之治瘟疫邪氣百病用棗一枚咒曰華表柱念七遍望天罡取氣一口吹於棗上令病人嚼吃湯水任下此三字鬼之祖名也治百邪鬼魅用頭垢丸作一小豆大水吞服治邪祟疰氣腹中刺痛拘急用真麝香半錢許酒研服立止治遠行所在有邪魅但至宿所望空書九龍符則壓諸邪魅精怪不敢動治百鬼法常以雞鳴時心念四海神名三七遍可避百邪惡鬼令人不病瘟疫如入病人室心念三遍尤好咒曰東海神阿明南海神祝融西海神巨乘北海神禺強紫白癜風治紫癜白癜風用羊蹄根去心和肥皂爛搗丸如彈子大一丸布包擦一丸浴洗三四次可愈又方用榆樹皮燒灰存性為末糟茄蘸擦又方用焯鰍鱔腥涎水再滾以暴灰升許攪勻浴洗晾乾卻以清水再洗如此三四次可愈治白癜風用蘿摩草白汁敷上揩之令破再敷三度瘥又方用灰藋燒灰三四度淋取汁塗之並蝕息肉除麵點黑子煮食殺三蟲又方用蛇蛻皮煎汁敷之又方用蒼朮米泔浸一宿焙乾何首烏荊芥穗苦參等分為末以皂角三斤去皮弦於瓷器內熬為膏和丸如桐子大每服三五十丸空心茶酒任下忌一切動風之物治紫癜風用舶上硫黃以米醋化開將茄蒂蘸頻擦敷之治諸般癜風用豬牙皂角炭上燒成灰每服一錢空心好酒調服治紫癜風用知母以好醋濃磨擦之又方用硫黃一兩醋煮一日海螵蛸三個共為末浴後以生薑蘸藥熟擦患處須避風少時數度即愈大風治大風癩疾肉敗眉墜身體癢痛用馬尾蒿炒為末每日空心食前及晚溫酒調三錢匕日三服治大風身癢用蛇床子煎湯浴洗治大風用松脂煉投冷水中二十遍蜜丸服三兩餓即服之日三鼻柱斷者一百日瘥斷鹽及房室又方用雲母煅粉為丸服極效治癩疾用苦參五斤細切好酒三升浸三十日每次一合日二常服即瘥治白癩用馬鞭草為末每服食前以荊芥薄荷湯調下一錢匕治大風令眉耳再生用側柏葉九蒸九曝為末煉蜜丸如桐子大日三服夜一服熟水下五丸十丸百日即生治大風鬚髮脫落用桑柴灰熱湯淋汁洗頭面以大豆水研取汁解灰味彌佳次用熟水入綠豆粉濯之取淨不過十度三日一沐頭一日一洗面治大風並丹石熱毒熱風手腳不遂用硝石一兩生烏麻油二升共置鐺中以土墼蓋口紙泥固濟勿令氣出進火煎未熟時氣腥香即熟更以生麻油二升合和煎之得所即收不津器中服法患大風者用火為使在室中重作小紙屋外燃火令患人在紙屋中服一大合發汗力壯者日二服至三七日頭面疱瘡皆減治忽患眼昏不辨人物眉發自落鼻梁崩倒肌膚有瘡如癬用皂角刺一二斤為灰蒸曬為末盦上濃煎大黃湯調一錢匕服一旬眉發再生肌膚光潤眼目復明治大風用蚺蛇膽及肉食之三五日便效百日平復治風癩百病用大麻仁四升水六升猛火煮令芽生去渣煎取七升空心服或發或不發或多狂語勿怪之但人摩手足須定進二劑愈治大風用紫背浮萍曬乾二兩當歸生地黃各一兩俱酒浸一宿川芎赤芍藥各一兩生用共為末每日空心溫酒調一錢服及相間用雄豬臟脂盈者五七寸入舶上硫黃末五錢火上炙黃待硫黃性燒盡作片食服兩月應效如治腳氣用白湯一盞入好酒半盞調服頭風臨臥白湯調服風濕腰腿骨節疼皆用酒服治大風蒼耳草端午或六月六日五更帶露採搗爛絞汁熬膏用斤半鯉魚一個剖開不去腸肚入膏子一錠在內用線縫之以好酒二碗慢火煮乾為度令病者吃盡魚不過三四個即愈吃淡一百日治大風及諸風疾用蒼耳為末大風油丸如桐子大每服三四十丸荊芥茶湯下不拘時去風活血治癩眉毛脫落用生半夏羊糞燒焦等分為末生薑汁調塗眉上治癩用地龍去土蟬殼白殭蠶凌霄全蠍各九枚同為末只作一服熱酒調浴室中汗出黏臭氣為效治大風用白花蛇每一條蒸米一斗缸底先用酒麴次將蛇以絹袋盛之頓於曲上然後以蒸飯和勻頓於蛇上用紙封缸口候三七日開取酒將蛇去皮骨為末每服溫酒一盞服蛇末少許仍將酒腳並糟做餅食之治癩疾用苦參四兩土蝮蛇一條或烏梢白花蛇皆可為末先將不蛀皂角一斤去皮弦銼碎酒浸一宿取出以新水揉汁入銀器內熬成膏和藥末丸如桐子大每服七八十丸空心用防風通聖散一兩煎湯送下日進二服三日後入浴出汗重者不過三次忌房室豬肉面一切熱燥動風之物治大風須令病人別居靜室斷酒戒色耐性寬心忌一切發風動氣葷腥鹽醬生薑胡椒生冷性熱之物止素食淡飯糜粥乃可治療先用白芷全蠍人參各一兩為末每服二錢晚飯休吃次日空心溫酒調下身上微燥為效又方用大黃三兩鬱金一兩皂角刺五錢共為末每服五六錢入大風油一錢半朴硝少許好酒一碗調化晚粥休吃至戍時溫服以水盥漱用蜜煎過口切不可臥良久腹痛瀉數次不妨卻用薄粥補之老弱則不可治此藥於服上藥後次日服又方用當歸羌活獨活川芎天麻細辛防風荊芥威靈仙麻黃去節何首烏牛蒡子蝦蟆葉蒼耳地松各一兩曬乾為末不可見火酒煮米糊丸如桐子大每服三二丸日二服不拘時此藥又於服瀉藥後次日服凡十日內將三藥輪流服瀉藥一次至兩月後二十日內服瀉藥一次須記日數又方洗爛瘡藥用地骨皮荊芥苦參細辛各三兩銼碎和勻每次用三兩以河水煎湯熏洗沃浸通身良久遍身血出為效又方爛瘡藥用杜仲寒水石枯白礬各二兩蛇床子四兩硫黃六錢為末以臘豬油或香油入朴硝少許調敷治厲風用雄豬肚一個去脂以苦參頭末二兩摻肚內線縫合隔宿煮軟取出洗去藥末先不吃飯五頓飲新水一盞後將肚食之如一了再食待一二時用肉湯調無憂散五七錢取出小蟲一二萬為效後用不蛀皂角一斤去皮弦子捶碎以水四碗煮一碗絹濾去渣入苦參末攪如稀糊卻用何首烏二兩防風一兩半芍藥五錢人參三錢當歸一兩焙為末和前皂角糊為丸如桐子大每服三五十丸溫酒或茶清送下不拘時日三服後用苦參荊芥麻黃煎湯浴洗治風眉毛脫落肌膚折裂用防風通聖散加苦參天麻蟬殼早晚各一服至百貼必愈忌房室鹽醬葷腥生冷油膩熱痱治熱痱瘡遍身如蠶子用不灰木棗葉為末瘡上搽之即止又法用䶎茹葉陰乾為末敷之又方用臘雪以瓶收貯遇生痱時以所化水塗敷又方用黃瓜切斷擦痱子上即安又方用棗葉煎湯浴之又方用蚌粉四兩綠豆粉二兩滑石一兩為末乾擦之腋氣治腋氣用生薑一塊搗碎帛裹塗腋下絕根又方五月五日採露草一百種陰乾燒作灰以井花水為團重燒令白釅醋為餅腋下夾之干即易當抽一身痛悶瘡出即止以自己小便洗之不過三兩度瘥又方用密陀僧為末以清油調搽或先以漿水洗淨干搽又方用粉霜益智仁等分二錢為率入麝少許研細四更以牙刷蘸藥熟擦牙一遍好酒一盅漱嚥下又擦一遍又酒一盅漱咽量人飲酒多少擦飲務在一醉覺身倦怠要去後新掘一坑出來洗浴更衣床鋪俱用新者如此三度擦飲更衣即瘥二錢作三分用又方用馬齒莧杵爛蜜和作團紙裹泥塗厚半寸日乾燒熟破取更以蜜少許和仍令熱先以生布揩之以藥夾腋下令極痛難忍然後以手巾勒兩臂即瘥又方用青木香作厚片好醋浸一宿夾腋下數次即愈又方用膽礬一豆粒大田螺一枚巴豆一粒去殼先將田螺以水養三日出盡泥土揭起厴甲入礬豆及麝少許以線拴住放瓷器內次日化成水須於五更將藥水以手抹在腋下不住手抹待腹內欲行卻住手先擇無人到處空地內去大便黑糞極臭是其證以土厚蓋之不可令人知如不盡再以藥水抹之去大便次日以枯礬藥擦可去病根枯白礬一兩樟腦一錢蛤粉半兩為末擦之極效又方用好甘遂四錢為末以新宰牙豬精肉一塊摻末在上熱夾腋下卻將甘草二兩銼細濃煮汁熱飲必大瀉一二次氣不可近然後除去腋下藥肉即愈又方用橘枸樹鑿孔取水一二碗用青木香東桃西柳七姓婦人乳奶一處煎一二沸就熱五月五日雞叫時洗了其水放在十字路口莫倒望走回疾即除只是他人誤先遇者帶去橘枸即梨棗樹也又方用烏魚骨枯白礬各三錢密陀僧一錢為末先以漿水洗臭處後用藥末擦之又方用銅青二錢黃丹東壁土各一錢為末以古銅錢一文磨漏燈香油調藥令患人洗浴了去腋下毛搽之二日一次不過十度絕根咽喉治咽喉卒腫飲食不通用黃柏末醋調敷腫上干即易治喉中腫痛並膈上痰熱用硼砂含化咽津又方用馬勃蜜揉拌以少水調呷又方用筆頭燒灰漿飲調方寸匕服治纏喉風及喉痹用蠶退紙燒灰存性煉蜜丸如雞頭含化咽津治纏喉風氣不通用蛇脫炙黃當歸等分為末溫酒調一錢匕服得吐愈又方用雄黃一塊新汲水磨急灌吐即瘥治卒喉痹用黃柏片含之又方用黃柏一斤銼細酒一斗煮三沸去渣恣飲便愈治急喉閉用皂莢去皮子生半兩為末每用少許以箸頭點腫處更以醋調藥末厚敷項下須臾便破少血出即愈又方用蠡魚膽臘月收陰乾為末以少許點患處即瘥病深則水調灌入治喉痹腫用荔枝花並根水煎去渣含細細嚥之又方用升麻銼含之治喉痹躁痛腫連頰吐氣數者名馬喉痹用馬鞭草一握勿見風截去兩頭取汁服之治喉痹聾不語用羊蹄獨根者勿見風日婦人雞犬以陳醋研和生布拭喉令赤敷之治喉中卒被毒氣攻痛者用白商陸根切細炙熱隔布熨之冷即易治懸癰垂長咽中妨悶用白礬一兩燒灰鹽花一兩共細研以箸無頭點藥入治喉痹用朴硝一兩細細含咽汁頃刻立瘥又方用紅花絞汁一升服之冬月浸乾者絞汁服極驗又方用桔梗二兩水三升煮一升頓服治纏喉風喉閉飲食不通欲死者用紫菀根一莖淨洗內入喉中待取惡涎出即瘥神驗更以馬牙硝津咽之治喉痹痰唾咳嗽用杏仁去皮尖令赤和桂末研如泥綿裹如指大含之咽津或用酥炙熬如膏服治喉閉用鹽梅肉一個硼砂少許研勻捻如棗大放口中噙化又方用枯白礬末吹入喉中急則用燈盞底油腳灌之治纏喉風用皂角三枚揉水一盞濾過灌之得吐即愈治急喉風用膽礬少許吹入喉中去涎或膿血治咽喉痛用桔梗甘草煎湯徐徐呷咽又方用青艾汁灌下冬月無艾瓶內燒蛇床子熏煙入口即愈治喉閉用益母草不拘多少搗爛以新汲水一碗絞汁飲隨吐愈冬用根又方用牛膝根一莖搗取自然汁以箬葉為筒令患者仰臥灌鼻內須臾覆過吐出膿血即愈治鎖喉風用皂角一根去皮弦兩頭切碎分作二分用水半碗以木槌順攪去渣用香油少許攪勻以剪揭開口灌之卻用雞翎口內探涎出愈治風痰上壅咽喉腫痛吞吐有礙用苦梗一錢甘草末二錢水一盞煎七分食後溫服治咽喉腫痛毒氣結塞不通用木香沉香雞舌香熏陸香各半錢麝香一分別研為末水一盞煎服不拘時治心肺積熱上攻咽喉腫痛閉塞水漿不下或生瘡癤重舌木舌用青黛盆硝蒲黃甘草末各一兩研勻以砂糖丸每兩作五十丸每服一丸噙化或用干藥末摻咽膈內亦好治風熱喉閉纏喉風用焰硝一兩半硼砂半兩腦子一字白姜蠶一分研勻以竹管吹半錢入喉中立愈治腹寒咽閉吞吐不利用大附子一隻去皮臍切作大片蜜塗炙黃含咽津甘味盡更以一片塗炙用治纏喉風及上膈壅熱痰涎不利咽喉腫痛用雄黃飛鬱金各一分巴豆去皮出油二七個為末醋糊丸如綠豆大茶清下七丸吐出頑涎即愈治喉閉氣塞不通飲食不下用雄黃一分別研蠍梢七枚白礬生藜蘆各二錢豬牙皂角七枚共為末每用一字吹入鼻中即時吐出頑涎為愈治纏喉風急喉痹用膽礬二錢半白殭蠶炒去絲嘴半兩為末每用少許以竹管吹入喉中又方用白礬三錢巴豆三枚去殼分作六瓣將礬於銚內熬化為水置巴豆在內候乾去巴豆取白礬研為末每用少許以竹管吹入喉中立愈一方去巴豆用烏雞子清調白礬灌入喉中治咽喉腫閉用山豆根洗淨新汲水浸少時以一塊口中噙嚥下苦汁未愈再用又方用甘草白礬為末每以半錢許入口中津液嚥下又方用射干即萹竹根也旋取新者不拘多少擂爛取汁吞下或動大脯即解或用釅醋研汁噙引出涎更妙治咽喉腫痛用艾葉旋取研汁逐時吞下又方用九仙子新汲水磨汁飲少許醋磨亦好又方用硃砂根水磨或醋少許飲即愈以上二種皆生於深山九仙子一根則連綴九枚大者如雞蛋小者如指頭硃砂根苗高尺許葉似冬青冬夏長茂葉背甚赤根大如箸亦赤又方用土烏藥即矮樟根以醋二盞煎一盞先噙後咽候吐出痰涎為愈又方用鼓槌草生牛膝二味生搗汁灌下否則灌鼻中得吐即愈治咽喉牙關緊閉用巴豆去殼以紙包出油在紙上以此紙作捻子點燈吹消以煙燻入鼻中即時口鼻涎流牙關開矣治走馬咽痹用巴豆去皮以綿裹隨左右塞於鼻中立透如左右俱有者用二枚又方用白礬生研細塗於綿針上按於喉中立破綿針用榆條以綿纏作棗大是也又方如左右喉痹於頂上分左右頭髮用手挽拔之剝然有聲立效又方用馬勃吹咽喉中立止治喉痹用大黃朴硝白殭蠶為末水煎量虛實用以利為度治咽喉干痛用桔梗一寸含之咽津治喉痹用馬牙硝含之咽津又方用升麻五分蠡食一合水一升煎三合入少蜜攪勻細細呷之大驗治急喉痹水米不下氣息難出用牛角燒透為末每服二三錢酒調下治喉痹鬥喉單雙乳蛾緊者用白殭蠶天南星去皮等分生為末每服一字生薑汁調下若牙關緊灌之以涎出後用大姜一塊略炙含之小可患敷於喉上自消散治咽喉單雙乳蛾用蒲黃五錢羅青盆硝各三錢甘草二錢為末每服一錢冷蜜水調細細嚥之吞不下雞翎蘸藥喉內掃之立效又方用白礬三錢巴豆二粒去皮輕粉麝香研各少許於鐵器上飛白礬沸入巴豆在上礬枯去巴豆不用為末三味和合吹喉乳蛾即開又方用牆上土蜂巢一個研極細先用楮葉將病人舌擦破微令血出將蜂巢土醋調以鵝毛蘸藥於喉中捻之令痰涎出為效後用扁竹根擂碎調冷水與病者只服三口利行即愈就用冷水漱口立效治急喉風用燈草一大握除去兩頭以新瓦二個相合置燈草於內以火燒成灰再將鹽一匙就瓦上炒存性二物和合用葦筒一個以藥一捻吹於喉中涎出為效吹三兩次立愈治啞瘴咽喉乳蛾用雄黃研鬱金各五錢白礬二錢半生研膽礬半錢共為細末以竹筒吹入喉中立能言語治乳蛾及風熱上攻咽喉腫痛用殭蠶去絲嘴三條薑汁浸濕炙黃防風鼠尾者去皮二錢明礬三錢研共為末用竹筒吹於喉內立愈治咽喉胸內有瘡久不瘥用生羊肝三五兩頓服若淡可用醋和食之又方用角蒿燒灰為末塗口中瘡上有津即吞之又方用薔薇根細銼水煮濃汁去渣入少蜜再熬稠塗口內瘡上咽津又方用薏苡仁去皮吞二枚愈治喉閉纏喉風用大青葉搗汁灌之亦治時氣傷寒頭痛身強腰脊疼治咽喉壅閉發聲不出用千年潤曬乾為末每服一錢濃煎薄荷湯調服治咽喉痛發聲不出用五倍子苗曬乾為末入百藥煎冷水丸如彈子大每服一丸噙化治雙乳蛾用牛膝山豆根水研汁吹鼻中及用酒調服又方用皂角一皮百草霜一錢為末冷水調加清油數點灌之又方用升麻四兩水四碗煎一碗灌之即愈又方用雄黃鬱金各五錢巴豆去殼油半錢玄明粉三錢為末麵糊丸如綠豆大每服五七丸冷茶吞下誤吞物治誤吞針用磁石一塊呵之即出又方多食肥豬羊肉自瀉出治誤吞稻麥芒於喉間用鵝口中涎灌之或取薦頭草嚼下治誤吞銅錢用生䶎茹汁呷飲自然消化又方用百部根四兩酒一升漬一宿溫服日再服又方用冬葵根煮汁飲之即出神效若天行病食葵頓喪明治誤吞錢金銀釵鈈用飴糖一斤漸漸食之盡逐出又方用鵝羽數枚燒為末米飲調服又方用石灰一杏核大硫黃一皂莢子大同研為末酒調下又方用薤白曝黃煮熟勿切食一大束釵即隨出又方用炭燒紅急搗為末煎湯呷立效治誤吞鐵石骨刺不下危急者用王不留行黃柏等分為末浸蒸餅丸如彈子大青黛為衣線穿掛當風處每服一丸冷水化開灌下治誤吞馬蝗腹痛用田中泥為丸水吞下其蟲必隨土瀉出
