body:
  text: 卷之十破傷風治破傷被風浮腫用杏仁研爛厚敷上卻燃燭遙灸之治破傷風強直用防風天南星等分為末以醋調作靨貼上及用二三匙童便煎服極效又方用蟬蛻二錢燒灰為末酒調服又方用魚膠燒灰存性為末酒調服仍封瘡口又方用桑條尺許長十數根火上炙取汁熱酒調服又方用人耳中垢不拘多少紙上焙乾為末入熟艾中和勻做成小艾炷七個或十個灸患處即愈又方用晚蠶蛾研為末揭起瘡痂上藥卻蓋之用醋調麵糊封之須臾風出後更揭余半依前治之其風出盡更服風藥又方用膠如瘡大一片浸濕火炙熔貼之大妙又方用竹瀝飲二三盞口噤者斡開灌之忌冷飲食及酒又方用雄黃草烏防風等分為末每服二三錢溫酒調下忌熱物一方加白芷又方用斑蝥頭蠍稍尾草烏尖附子蒂細研為末量傷加減熱酒調服治破傷風及金刀傷打撲損用黃蠟一塊投熱酒中化開服立效與前方防風南星連用又方用威靈仙末半兩獨蒜一枚香油一錢同搗熱酒調服汗出即效湯火傷治湯火瘡用劉寄奴為末先以糯米漿雞翎掃傷處後摻藥末在上並不痛亦無痕但凡湯傷先用鹽末摻之護肉不壞後用藥敷又方用白芨末或白蘞摻敷生肌止痛治火瘡敗壞用雲母粉同生羊髓和如泥塗之治湯火傷用薤白與蜜同搗塗甚效治熱湯火燒痛不可忍用石膏末敷之治火瘡未起用梔子仁燒灰麻油調厚封之已成瘡燒白糖灰摻之燥即瘥治湯火傷用梨削貼不爛防痛易瘥又方用胡桃肉燒黑杵如脂敷又方用火焰草曬乾為末冷水調敷患處又方用炭末水磨塗之又方用土朱磨塗又方用桐油塗又方用柏葉搗爛敷傷處又方用黃蜀葵花葉搗敷治湯火灼未成瘡用豆醬汁敷又方用黍米面曲等分熬焦為末雞子白調敷治湯火傷退豬毛燒灰油調敷二三次可愈又方用雞子清酒調淋洗或用蜜塗或雞子調韶粉塗或泥醋調或飛面水調敷又方用楊梅皮為末油調敷及以酒調淋洗治湯火敗壞及滅瘢用風化石灰炒黃傾地上良久出火毒研細生油調塗治火燒悶絕用尿溺冷飲之或冷水和蜜飲之治湯火傷用好米醋蘸濕多年舊窗紙貼上自然消愈又方用稻草灰不拘多少冷水淘七遍帶濕攤上干即易若瘡濕焙灰干油調敷二三次可愈又方用多年廟上𧉚走獸為末小油調塗立效又方用生地黃汁入小油蠟同熬成膏瓷器內盛以雞翎蘸掃又方用牆上青苔燒灰小油調塗又方用血餘灰以臘豬脂調塗又方用寒水石燒過為末水調塗之又方用大黃黃連黃柏黃芩白芨等分為末水調成膏以雞翎頻蘸塗掃大除腫痛但藥性寒防結火毒又方用多年乾白螺螄殼火煅為末如瘡破乾摻不破入輕粉清油調敷又方用大黃當歸等分為末以清油調敷濕則乾摻又方用赤石脂寒水石大黃等分為末以新汲水調塗大去赤爛熱痛又方用杉皮燒灰存性為末濕則乾摻乾用雞子清調塗治湯火傷未成瘡者用小麥炒黑為度研細入膩粉油調塗之凡湯火傷切不可以冷水冷物拓之熱氣不出必致爛肉治湯火傷用薤白與蜜同搗塗甚效箭刺傷治箭並針折在肉中用象牙細刮屑以水和敷上即出又方用栝蔞根搗爛敷之日三易自出又方用齒垢和黑蝨研敷及治惡刺治竹木針刺入肉不出用牛膝根嚼爛罨之即出又方用王不留行為末每服湯調三錢下即出又方用瞿麥為末水調方寸服或煮汁飲日三次又方用白梅細嚼敷之又方用烏羊糞為末水調塗或燒灰為末臘豬脂調塗自出又方用鹿角燒為末和塗之一夕自出又方用酸棗核燒灰為末每服三錢水調下治蘆葦刺入肉用栗子細嚼盦傷處治針刺入肉不出用生薑橘皮解鹽等分研為膏塗上以帛札定即自出治諸骨雜物刺及魚骨刺入肉不出用白梅肉水煮爛研調象牙末厚敷刺處自軟立出咽中刺則水調飲之治刺毒腫痛用松脂為末以帛封其上治惡刺用孤屎燒灰以臘豬脂和封孔上治刺傷中毒用鮎魚目燒灰塗之治針入肉不出用雙杏仁搗爛以車脂調勻貼上其針自出治箭頭不得出用莨菪稞即天仙子於端午前一日持不語尋見此草言道先生你卻在這裡哪道罷用柴灰自東南為頭圍了以木椑子掀取周迴土次日端午日未出時依前持不語用钁只一钁取出水洗淨不令雞犬婦人見於淨室中以石臼搗為泥丸如彈子大黃丹為衣以紙袋封懸於高處陰乾如有著箭不能出者以緋絹裹此藥放臍中用帛裹肚系定先用象牙末貼瘡上後用前藥如瘡口生合用刀刺開貼之治箭傷止血定痛用定粉風化石灰乳香沒藥各一兩枯白礬三錢各研為末和勻摻上治諸般針刺入肉不出用干烏羊屎十數粒為末水調厚敷上即痛止刺出又方用黑豆研爛水調塗之又方用蓖麻子去殼爛研先以帛襯傷處敷上頻看若見刺出即拔去恐藥緊弩出好肉或加白梅肉同研敷尤好杖傷治杖傷用黍米燒灰和油塗上痛不作瘢黍米不可與小兒食令不能行緩人筋骨令人好睡亦不得和牛肉食生寸白蟲又方用五倍子去瓤米醋浸一日慢火炒黃為末乾摻不破腫痛者以醋調敷又方用雄黃二分無名異一分細研水敷極效又方用水粉一兩赤石脂一錢生用水銀一分以麻油杵成膏攤傘紙上貼之如肉陷者用此膏填滿然後貼上立效治杖瘡腫痛用大黃黃連黃柏黃芩各三錢乳香沒藥各一錢別研腦子少許為末冷水調勻攤緋絹上貼瘡治杖瘡並惡瘡癰疽腫癤發背瘰癧寒濕冷刺痛皮膚頑麻手腫打撲腰骨閃肭血氣毒氣鐵器所傷小兒頭瘡蜂蠍豬犬蛇蟲所傷湯火漆瘡臁瘡用黃丹五斤水飛乳香沒藥各二兩木鱉子白芷白芨白蘞當歸官桂杏仁血竭各一兩槐柳枝各一斤截碎除乳沒竭丹外余藥同清油五斤浸三日鍋內熬黃濾去滓次下黃丹以新柳條攪丹至褐色掇鍋下地不住手攪候藥煙盡下乳沒血竭再攪候冷傾瓷器內收貯宜春三月秋七月修合用時不得犯葷手火上溶開攤好紙上貼之立效婦人吹奶丸如桐子大新水吞下二十丸胎前產後腹刺痛溫酒下三十丸治杖疙熱毒疼痛用黃丹一兩密陀僧半兩輕粉錢半麝半錢龍腦一字為末摻疙上以青帛蒙之中留一竅治打著不痛用無名異乳香沒藥地龍去土自然銅燒醋淬七次木鱉子去殼等分為末煉蜜丸如彈子大溫酒化下一丸臨時再飲酒一二盞自然打不痛一方加大草烏掘土坑一個燒紅澆醋內草烏蒸之入用又方未服前藥先用已出蛾末繭燒灰存性為末每服三錢酒調下甚妙蛇蟲傷治諸蛇蟲傷毒用青黛雄黃等分為末新汲水調二錢服又方用酥和鹽敷之瘥又方用蒼耳嫩葉一握搗汁溫酒和飲滓厚敷傷處口噤身強者灌之又方用益母草搗爛厚盦傷處又方用鵝糞敷之又方用扁豆葉搗爛敷之又方用獨蒜酸漿草搗敷傷處又方用酒暖洗瘡上日三次又方用紫蘇葉油浸塗傷處又方用貝母為末酒調儘量飲酒化為水自傷處流出盡卻以藥滓敷瘡上即瘥又方先問被傷人是甚蟲傷即默唸火德星君黑殺攝吹在傷處自然不痛又方用艾炷於傷處灸三五壯拔去毒即愈治蛇咬用水蓼搗汁飲滓敷傷處又方用茱萸一兩為末冷水調分三服立瘥又方用櫻桃葉絞汁服滓敷傷處又方用獨蒜切片置傷處以熟艾灸七壯又方用犬糞塗之又方用頭垢耳塞井泥蚯蚓糞和搗塗咬處黃水出愈一方加白丁香治蛇咬腫毒悶欲死用重臺六分續隨子七顆去皮為末酒服方寸匕及以唾和少許敷咬處立瘥又方用乾薑雄黃等分為末敷之兼闢蛇用絹袋盛係臂上男左女右蛇聞氣遠避又方用五靈脂一兩酒洗去沙石雄黃半兩研細酒調三錢灌之滓塗咬處良久再一服神驗又方用雄黃不拘多少為末以萵苣汁捏為餅好酒化服及用塗傷處又方用細辛白芷雄黃為末入麝少許每服二錢溫酒調服又方用地榆生絞汁飲及濃煎漬之半日愈治天蛇毒似癩非癩天蛇即草間黃花蜘蛛人被其螫仍為露所濡乃成此疾多用秦皮煮汁一斗旋飲之瘥治蜘蛛咬一身生絲用羊乳飲之瘥治蜘蛛等蟲咬用生薑汁調臘粉敷之又方用山豆根末唾塗之治蜈蚣傷毒用桑枝白鹽和塗之即愈又方用烏雞屎水調塗或用大蒜研爛塗皆效又方用生薑汁調雄黃末貼傷處治蜈蚣蜘蛛毒用桑白皮搗汁敷之效治蠶咬人毒入肉用苧根搗汁飲之若以苧近蠶種則蠶不生治蠍螫痛不可忍用蔥白切一片厚二分置螫處以艾灸三五壯又方用乾薑末唾調塗之又方用白礬南星末塗疼處即止治蜈蚣咬凡破傷急以手指於地上干處書王字內撮土摻在咬處即愈又方用耳塞少許塗咬處疼即止治螻蛄咬用槲葉燒灰以泔別浸槲葉洗瘡拭乾塗少許於瘡治蠍子蜈蚣諸毒蟲所傷用香油燃燈吹滅以余煙淬之又方用雞糞塗之治蛇入人穹中急以手捻定用刀刺破以辛辣物置破尾上用綿緊之自出不可拔治蛇蟲咬用苦蕒搗厚敷之瘥又方用堇菜生搗敷之毒即出治蚰蜒蜘蛛咬用油麻研敷之治蟲刺螫人用豉熟嚼敷之少傾見豉上毛即瘥不見又敷晝夜勿絕見毛為度治蜂蠆用醋磨雄黃塗又方挼薄荷貼之又方用蜂房末豬脂調塗煎湯洗亦得治蛇咬狗咬蠬蜉瘡並用山豆根水研敷之治蠼螋尿人影著便令人體病瘡如粟粒累累痛似刺蟲所螫惡寒壯熱用犀角磨汁塗之則愈治蛇犬及狂狗咬用蚯蚓糞和鹽研敷神效治蛇毒射工沙蝨等傷著人眼黑口噤手足強直毒氣入腹用白礬甘草等分為末每服二錢冷水調下治射工及疰氣發無常處用芥菜子作丸服之或為末醋和塗之隨手有驗治鼠咬腫痛用貓糞填咬處治人咬傷用龜板或鱉板燒灰為末香油調塗治蜂蠍螫人用人參苗細嚼搓擦之立效治黃蜂螫用熱酒洗之立效又方用清油搽之愈治蛇傷用馬蘭草即階前菊生搗敷傷處亦解酒疸止鼻衄合金瘡治諸惡蟲蛇螫用地松搗敷之治蟲蠶蜘蛛等咬用灰藋搗碎和油敷之亦治惡瘡治蛇傷用小青一握細研入香白芷半兩酒調服卻以手捻患處候黃水出為效治蜈蚣傷用蜈蚣草曬乾為末入鹽少許水調敷患處能解諸毒治蛇傷犬咬一切蟲毒用試劍草搗爛貼之治毒蛇傷用好醋一二碗服令毒氣不隨血走或飲清油一二盞亦可及以頭繩扎定傷處兩頭次用白芷末半兩白水調服傾刻咬處黃水出盡腫消又方用雄黃為末塗之及以水調服又方用雄黃白芷黃蠟等分丸如指頭大迂有著傷匙上熔開滴傷處或以竹筒按上滴入則毒不散治惡蟲咬用大紙捻蘸麻油點燈照熏傷處其毒盡入油煙內去治蛇傷用細辛白芷各五錢雄黃二錢半為末入麝香少許每服二錢溫酒調服治蜘蛛瘡用羊乳敷其上或用清油搽之即安治蜈蚣咬用茱萸嚼爛擦之又方用生薑汁調蚌粉搽又方用燈草蘸油點燈以燈煙燻之不問其他毒蟲傷皆可用此熏極驗治蛇犬咬及破傷風荔枝草一握約三兩以好酒二碗煎至一碗服即睡出汗汗不止以溫白粥補之治惡蛇瘋犬傷用雄黃蓽茇細辛等分入麝少許為末每服二錢好酒調下治山溪中沙蝨射弓等毒用蔥小蒜茱萸煮汁浸或搗敷大效治二十七般蟲咬傷人及瘡腫者用麝香雄黃乳香硇砂各二錢土蜂窩露蜂窩燒灰存性研細以醋調少許塗咬處或不能辨認疑是惡瘡三五日不療即毒入心難瘥忌雞魚油膩物治水弩射人用熊膽塗之更以雄黃酒磨服即愈治蛇咬瘡用蒜去皮一升搗破以童便一升煮三四沸熱漬損處一兩時初咬未腫即嚼蒜封之六七易又方用蒜一升乳二升煮爛空腹頓服以飯壓之次日依前再服犬獸傷治癲犬咬用韭菜根搗汁二三盞服又方用艾灸傷處五七壯又方用膽礬為末貼瘡上立愈治馬咬傷用栗子細嚼敷傷處又方用益母草細切和醋炒封之治狗咬破傷風用人參桑柴火燒令煙盡合研為末摻瘡上立效治虎犬蛇咬傷用地榆根為末服方寸匕日一二服亦以敷瘡甚妙治狗咬傷用杏仁去皮尖同馬蘭根研細先以蔥湯洗後用藥塗傷處又方用蓖麻子五十粒去殼以井水研成膏先以鹽水洗咬處次以膏敷貼又方用虎骨為末敷之又方用磚青和牛糞塗傷處又方用杏仁爛嚼沃破處以帛裹之至瘥無苦治馬咬毒入心用馬齒莧煎湯服之瘥治狂犬咬用桃白皮一握水二盞煎一盞服又方即用犬糞塗仍拔去頂上紅䏢髡又方用米泔洗淨以砂糖塗之後用益元散四兩斑蝥十四個去頭翅足同煎空心溫服又方用雄黃五錢麝香五分研勻酒調二錢服下去惡物再服得睡莫驚覺或經久復發亦宜服此又方用桃核殼半個將犬糞填滿以榆皮蓋定掩於傷處用艾於桃核上灸十四炷即愈永不發作又方用斑蝥二十四個去頭足翅以糯米一勺先將斑蝥七個入米內微火炒不令米赤去此斑蝥別入七個再於前米內炒斑蝥色變復去之又別用七個如前法炒以米出青煙為度去斑蝥不用以米研為粉用冷水入清油少許空心調服良久再進一服以小便利下惡物為度如不利再進一服利後肚腹疼痛急用冷水調青靛服之否則有傷或煎黃連水亦可不宜便食熱物又方用斑蝥七個糯米一撮同炒色黃為度只用米七粒同斑蝥七個研細以百草霜一錢三分和研勻用米飲調服極效又方用杏仁炒黑杵為膏貼傷處即瘥或食犬肉得患者用杏仁去皮尖炒熟細嚼服治虎狼犬咬發惡用乾薑為末摻瘡口上立愈治虎咬傷瘡用青布緊卷燒一頭內竹筒中射瘡口令煙燻入瘡中治瘋狗傷用斑蝥三個去翅足研細酒一盞煎半盞空心服取下肉狗至四十個為盡如欠少歇數日同前再服治馬汗入肉用烏梅和核爛搗為末入好醋和成膏先將瘡口針破出盡紫血有紅血出拭乾用膏敷上以帛縛定治虎傷用清油洗瘡口仍吃清油一碗又方用乾葛濃煎湯洗又方用砂糖水調塗仍服砂糖水一兩碗五絕治自縊牆壓溺水魘魅產乳死者名五絕皆用半夏一兩湯洗七次為末丸如大豆內鼻孔中即愈此扁鵲法治自縊死緩解下切勿割斷抱取心下猶溫者刺雞冠血滴入口中即活男雌女雄又方用雞屎白如棗大酒半盞和灌及鼻中又方用藍研汁灌之又方即於鼻下人中穴針灸遂活又方未解下先用膝頭或手厚裹衣服緊塞穀道抱起解下揉其項痕捻正喉搐鼻及吹兩耳待其氣回方可放手若泄氣則不可救矣又方依前法解下用皂角細辛為末搐鼻又方凡自縊高懸者徐徐抱住解繩不得割斷上下安腳臥之以一人用被踏其兩肩手挽其發常令弦急勿使緩縱一人以手按據胸上數摩動之一人摩將臂脛屈伸之若已強直但漸屈之並按其腹如此一時傾雖得氣從口出呼吸眼開仍引按不住須臾以少桂湯及粥清灌令喉潤漸漸能咽乃止更令兩人以管吹其兩耳此法最好無不活者自旦至暮雖冷亦可救暮至旦陰氣盛為難治卒暴墮攧壓倒打死心頭溫者即將本人盤足坐住令人控起其發用半夏末急吹入鼻如活卻以生薑汁和香油打勻灌之治溺水者救起放大凳子睡著腳後凳腳坫起二磚卻用鹽搽臍中待其水自流出切不可倒提出但心頭微熱者皆可救又方急解去衣帶艾灸臍中又方救起即用牛一頭將本人肚橫覆在牛背上兩邊用人扶策徐牽牛行出腹內之水如醒即以蘇合香丸之類或老薑擦牙若無牛以活人於長凳上仰臥卻令溺水人如前將肚皮相抵活人身上水出即活治溺死一宿者尚活用皂角末綿包內下部須臾出水即活治冬月落水微有氣者用大器炒灰熨心上候暖氣通溫米粥稍稍吞之即活若便持火灸即死治凍死微有氣者用大鍋炒灰包熨心上冷即換待眼開以溫酒粥湯與之不可便與火烘治魘死者不得近前喚但咬痛其腳跟及唾其面不省者移動些少臥處徐喚之原有燈則存無燈切不可點及用皂角末㗜兩鼻又方急於人中穴及兩腳大拇指內離甲一韭葉許各灸三五壯即活又方兼治中惡縊溺壓攧產難氣絕者用皂角末或半夏末丸如豆大內鼻中嚏則氣通可活或但以末吹鼻內治驚怖死者用溫酒灌之治卒暴亡用臘月狐膽溫湯研灌入喉中即活若移時救無及矣治臥忽不寤勿以火照但痛齧其拇指甲際而唾其面則活用韭搗汁吹鼻孔冬月用根汁灌口中治卒魘用雄黃搗末以管吹鼻孔中治從高墜下瘀血衝心欲死用豆豉一合水二碗煎數沸去滓服若便覺氣絕不能言取藥不及擘開口以熱小便灌之百病治諸病用威靈仙一味於冬月丙丁戊巳月採根陰乾月餘日搗篩為末溫酒調二錢匕空心服或用酒九蒸九曝為末白飯和丸如桐子大每服二三十丸溫酒送下餌之者夏無瘟疫秋無瘧痢宣通五臟祛逐諸風癥瘕積聚痃癖氣塊痰唾涎水膀胱宿膿嗽喘腫脹手足頑麻腰臍疼痛白癜黃疸瘡癬疥癩目眩頭旋憎寒壯熱虛損傷敗一切疾病服之大驗其性甚善不觸諸藥惟忌茶茗可煎甘草梔子代飲仍以不聞水聲者良淨室修合又方用桃膠不拘多少以桑柴灰汁漬之一宿日乾為末煉蜜丸如桐子大每服五七丸凡一切病患諸藥無效者服此大妙或以桃花酒漬飲之兼身輕有光明好顏色又方用石鐘乳搗羅細末服之酒調或泉水調服百日通明久服除百病耐寒暑不飢渴凡鍾乳用頭長一二寸觸著便折者為佳孔公孽不如乳頭也又方用礬石一斤以水一斗二升漬之一宿礬石消化取汁盛銅器中安炭火上令大沸化旦至午燒之或至一升許引以舉上如懸絲形以鹽一勺蜜半升內其中攪勻候凝丸如桐子大每服五丸日三治百病輕身延年又方用好礬石為末置新桑器中以新桑盤蓋其上三宿礬當盡上著盤取治為末以白蜜丸如麻子大日服三丸治百病甚良亦輕身延年也又方用礬石三斤以水五斗於銅器中煎礬為水絹濾三遍去其沙石草土入豬肪三兩初煎猛火欲成微火竭至四升取下置生土上以桑條攪硬則加水熟攪令餌煉得白色為佳候冷丸如豆大每服三丸增至十丸不拘時治手足心熱目黃吐逆百病服之甚效頤生治人一切虛冷陳百病生精神強忘意利耳目輕身延年用白茯苓去皮酒浸十五日濾出為末每服三錢日二服或煉蜜丸如桐子大每服二三十丸湯酒水任下又方用黃精陰乾為末每日用淨水調服任意多少一年變老為少又方用雞頭實三合煮熟去殼研如膏入粳米一合煮粥空心食之頻服甚益精氣又方用桑椹子熟時收之日乾為末煉蜜丸如桐子大空心酒下四五十丸長服之良又方用菟絲子一斤酒浸十日水淘焙乾為末杜仲半斤蜜炙黃搗以薯蕷末酒煮為糊丸如桐子大空心酒服五十丸又方用胡桃煨熟去殼膜與破故紙等分為末煉蜜丸如桐子大空心酒服三十丸大補下元虛冷又方用晉棗煮去皮核桂心白瓜仁松樹皮為末共搗丸如桐子大每服二三十丸久服身香並衣亦香又方用胡麻三升蒸熟曝乾為末以蜜三斤和熬得所丸之常服和五臟潤肺氣又方用紫蘇子高良薑陳皮等分為末煉蜜丸如桐子大空心服一二十丸令人肥白身香能下一切冷氣腳濕氣破癥結消痰飲止喘嗽潤心肺療嘔吐反胃補虛勞調中順氣益五臟利大小便又方用干蓮肉一升慢火炒毳搗羅為末粉草四兩去皮炙焦為末和勻每日清晨調一匙服又方用蓮肉去皮心茯苓去皮搗細水漾去斤各以好酒拌蒸過再搗細煉蜜丸如彈子大每服一丸細嚼酒下常服又方用白茯苓二斤何首烏一斤不經銅鐵川椒去目炒甘草炙各四兩俱令碾為末煉蜜與前藥等分就熱和勻以瓷器盛貯每日清晨用一匙好酒調服一方加大棗一斤又方用犍牛髓煉蜜各三斤胡桃五十個去膜杏仁去皮尖人參各四兩五味子一兩生熟地黃各半兩俱研細置瓷器中門口煮一周時收貯每日空心服一匙又方用枸杞苗葉皮子春名禾精苗夏名卻老葉秋名枸杞子冬名地骨皮各依時採取四兩共一斤蒼朮名金銷龍牙洗去皮一斤桑椹子名錦繡龍牙去苗子一斤取汁蜂蜜名百花龍牙先將前藥為末用新瓦盆一個傾椹汁在內和攪藥勻以新綿覆之置高處勿令經雨用日精月華煎乾取出為末煉蜜和丸如彈大每服一丸細嚼空心溫酒送下薄荷湯亦得日進三服久則返老還童耳目聰明身體輕健紅白如桃李花色服至二年冬暖夏涼百病消除寒暑不侵及有患雙目失明者服此二年兩目皆明視物如故又有患大風疾者服此一年身體光澤強健如前精神加倍又方春甲乙採枸杞葉夏丙丁採花秋庚辛採子冬壬癸採根皮共為細末以桑椹子汁為丸如桐子大每服五十丸茶酒任下又方用蒼朮四斤米泔浸軟竹刀刮去皮切作片內一斤用椒三兩炒黃去椒一斤用鹽三兩炒黃去鹽一斤好醋一升一斤好酒一升各煮令乾何首烏二斤米泔浸軟竹刀刮去皮切作片用瓦甑先輔黑豆三升干棗二升上放何首烏更輔棗二升豆三升以炊布蓋覆用盆合定候蒸至棗香熟取出不用豆棗地骨皮去粗二斤於石臼內搗為末用桑椹汁和軟瓷盆內按平上更用椹汁高藥三指以紗綿帛覆護晝取太陽夜取太陰候乾再搗為末蜜丸如桐子大空心溫酒下六十丸忌五辛之物治一切諸風常服烏髮注顏明目延年又方用松柏常以三四月採新生松葉可長三四寸許並花蕊陰乾為末柏葉取深山中當年新生可長二三寸許者陰乾為末用白蜜和丸如小豆大常以月一十五日日未出時燒香東向手持藥八十一丸以酒送下服一年延十年命服二年延二十年命欲長肌肉加大麻巨勝欲心力壯健加茯苓人參此藥除百病益元氣添五臟六腑清明耳目強壯不衰延年益壽用七月七日露水丸之更佳服乃咒曰神仙真藥體合自然服藥入腹天地齊年咒訖服藥斷諸雜肉五辛切忌慎之又方用蒼朮酒浸焙乾五兩川椒去目與閉口者炒取末四兩白茯苓去皮三兩川烏炮去皮尖以北茴香鹽炒粉草去皮炙枸杞子各二兩木香五錢為末煉蜜丸如桐子大每服三五十丸空心溫酒送下以乾物壓之此藥延年益壽添精補髓烏髭發牢牙齒強筋骨壯氣血固元陽明耳目返老還童冬月服之手心與腮面如噀血行步輕便老人服之精神壯健後生服之別有奇功不可盡述服藥一月即見其驗老年服至十日便不夜起服此藥者不可以藥力恣逞房事忌黑牛肉鵓鴿雀肉桃李恐減藥力保而敬之不熱不燥無金石飛走之味宋時官家尤多服之或名玉柱杖或名仙靈丹或名延壽丹或名玄靈丹後有老人服此一月耳目聰明頭白再黑顏如處女七十之上覆生一子乃效驗也不可輕忽又方用蒼朮四兩一兩酒浸一兩醋浸一兩泔浸一兩鹽浸各一宿葫蘆芭破故紙各一兩俱酒浸一宿覆盆子二錢茴香一錢肥新者川楝子一兩木香半兩山藥川山甲酥炙地龍去土茯苓去皮枸杞子牛膝酒浸各一宿各三錢曬乾為末無灰酒打糊丸如桐子大每服三五十丸溫酒送下鹽湯亦可空心服乾物壓之仍行百步使藥力行日進二服此藥不用金石性不燥熱不傷五臟全憑制度得水火既濟之術奪丹砂燒煉之功大開脾胃能進飲食且脾屬土乃五行之主一失調養則五臟俱虛百病由此而生其藥益精髓補腎經固元陽輕腰腳安五臟通五竅令耳目聰明悅顏容烏髮鬢堅牙齒至老寫細字延年益壽乃仙家之良劑平補大有功效又方用白茯苓去皮遠志去心官桂去粗皮牛膝酒浸三日大棗蒸黃精蒸各三兩蛇床子二兩熟地黃一兩酒浸三日為末煉蜜丸如桐子大每服三十丸空心茴香湯下乾物壓之忌蘿蔔青菜豬羊魚膻之物又方用白芷桂心甘菊巨勝子白茯苓旋覆花各半兩蓽澄茄牛膝酒浸覆盆子蓮肉各一兩為末醋糊丸如桐子大每服三十丸溫酒送下至晚再服二十丸一月發白再黑明耳目壯筋骨補元氣陰陽不衰添精髓旺顏色大有效驗亦治五勞七傷又方用木香五錢當歸虎骨酥炙杜仲炒去絲肉蓯蓉酒浸葫蘆芭炒五味子白芷鹿茸各一兩為末煉蜜丸如桐子大每服三十丸空心溫酒或鹽湯下治男婦諸虛不足身體衰弱常服壯筋骨添精神增氣力寒暑不能侵邪夢不能入又方常用刷牙藥青鹽細辛甘松豬牙皂角三奈木賊槐角子石膏各一錢煎饅頭灰半兩共為末蘸擦又方豬牙皂角及生薑西國升麻及地黃木律旱蓮槐角子細辛荷蒂用相當青鹽等分同燒煅研細將來用最良明目牢牙須鬢黑誰知世上有仙方又方堪嗟髭鬢白如霜要黑原來有異方不用擦牙並染髮都來五味配陰陽赤石脂與川椒炒辰砂一味最為良茯神能養心中血乳香分兩要相當棗肉為丸桐子大空氣溫酒十五雙十服之後君休摘管教華髮黑如光兼能明目並延壽老翁變作少年郎每料各一兩無老少皆可取又方乾洗頭藥用香白芷零陵香甘松滑石等分為末摻於發內梳篦辟穀凡遠行水火不便或修行人欲省緣休糧用黃耆赤石脂龍骨各三錢防風半錢烏頭一錢炮於石臼內搗一千杵煉蜜丸如彈子大要行遠路飽吃飯一頓服一丸可行五百里二丸可行一千里又方用黑豆五升淘淨蒸三遍去皮大麻子三升浸一宿蒸三次口開去殼搗細和勻作丸入甑蒸從辰著火至子時住火天曉出甑至午時曬乾為末服飽不得食雜物一方加棗二升去皮核煮和團服一食十日不飢又方用大豆五升淘淨蒸三遍去皮為末大麻子五升湯浸一宿蒸三遍令口開去皮為末糯米五升淘淨白茯苓五兩去皮同糯米一處蒸熟共搗如泥團如拳大再入甑蒸從初更著火至半夜住火至寅時出甑午時曬乾為末服之以飽為度不得吃一切物用麻子汁下第一頓一月不飢第二頓四十日不飢第三頓一千日不飢第四頓永不飢顏彩日增氣力加倍如渴飲麻仁汁轉更不渴滋潤五臟若欲吃食時先用菜子三合為末煎湯放冷服之初間且吃三五日白米稀粥湯仍少少服三五日後諸般飯食無所避忌此藥大忌欲事又方用白茯苓四兩為末頭白麵一二兩同調稀以黃蠟三兩代油爆成煎餅飽食一頓便絕食至三日覺難忍三日後氣力漸生熟爆芝麻湯米飲涼水微用些小以潤腸胃無令涸竭開食時用葵菜湯並米飲稀粥少少服之又方用乳香金箔六個定粉銀硃木香松脂白茯苓雄黃赤石脂黃蠟珍珠辰砂白沙蜜各二錢先將蜜蠟松脂於銀石器內熔作汁銀匙攪和前藥末勻就熱丸作二十丸以密器收貯用時先吃白麵一飽待腹中淨用乳香指頭大煎湯一盞送一丸下勿食他物又方用茯苓末十兩乾薑甘草生薑各二兩香油四兩煉熟白麵二斤黃米粉二升總和為團甑上蒸過陰乾為末夏月日每服一匙新水調下亦可以助前藥又方用甘菊茯苓黃蠟松脂蜂蜜等分先煉蜜次下藥攪勻丸如彈子大每服一丸不拘湯下又方用白茯苓去皮定粉黃丹白松脂白沙蜜黃蠟各二兩硃砂三錢金箔二十個水銀三錢先將蜜蠟松脂於淨瓷碗內熔為汁傾藥在內以木匙攪勻候溫就火丸如指頭大用水銀為衣有死水銀法先洗手淨用水銀三兩點在手心內以指頭研如泥見手心青色將藥三五丸搓揉後以金箔約量攤碗內以藥丸在內搖動使金箔都在藥上密器收貯服時用乳香末半錢水三小盞煎湯溫送下不嚼破服後第三日覺飢以面和白茯苓末烙成煎餅食半飽以後藥在丹田永不飢渴久則交過五臟陰滓俱盡長生不死諸人得服並無所忌使人添氣力悅容顏身輕體健百病皆除救貧拔苦實濟世之良方長生之妙法其間欲飲食俱不妨事但七日之內吃食藥必隨下至半月藥在丹田永不出矣服時面東持藥唸咒一遍吹在藥上如此七遍畢以乳香湯送下咒曰天清地寧至神至靈三皇助我六甲護形去除百病使我長生清清淨淨心為甲庚左招南鬥右招七星吾今立化與天齊生吾奉太上老君急急如律令又方用青粱米醋二斗漬三日百蒸百曝藏之遠行一餐十日不飢重餐四百九十日不飢又方用米一升赤石脂三斤水漬淹之置於暖處二三日上青白衣搗為丸如李大日服三丸不飢又方用鐵腳鳳尾草同黑豆蒸熟揀去草每食五七粒始日自然忘食又方用松葉細切日服一合常服使人不老身體生毛毛皆綠色長數寸身香少睡不飢不渴可以絕谷若春夏秋冬皆服輕身益氣卻病延年又方用松實為末每服一合日三服則無飢渴勿食他物飲水不妨百日身輕快行絕谷又方用紫石英一名石芝為末常服永不飢渴益氣延年又方用大米二三合炒過以黃蠟二兩熔銚內再入米炒令蠟干取出任便食之即數日不飢如要吃食以胡桃肉二個嚼下即便思食闢蟲治諸物被蟲用莽草燒煙燻之則蠹蟲皆去盡治蚊蟲壁蝨用水鱉子川芎各一兩雄黃半兩為末蜜丸如芡實大燒一丸蚊蝨盡去治蚊蟲用社日祭余酒噴屋四壁能闢蚊又方於除夜五更使一人堂中向空扇一人問云扇甚的答云扇蚊子七問答乃已則無蚊蟲又方端午日五更依前法扇問答尤驗治壁蝨用紙書云欠我青州木瓜錢將此七字貼於床腳上忽然不見一云張賢買了木瓜不還錢一去三十年寫此貼床腳上亦驗又方用白馬蹄於床下焚燒壁蝨盡化為血治鼠耗用安息香蟹黃松鼠等分為末夜靜時焚燒其鼠悉來不得打殺以物盛放土上不復還矣治桑果樹生蟲正月一日雞鳴時持火遍照五果及桑樹上下則蟲不生治五穀生蟲用正月十五日殘糕糜熬令焦和谷種之能闢蟲治蟲蟻驚蟄日用石灰撒門限外免蟲蚊出又方三月三日取芥菜花鋪灶上及床蓆下可闢蟲蟻極驗又方三月三日收苦楝花或葉鋪於薦席下可避蚤蝨又方清明前二日夜雞鳴炊黍米熟取釜中湯遍洗井口甕邊地則無螞蟥百蟲不近並甕甚驗又方清明日日未出時採薺菜花枝候乾夏間做挑燈杖能祛蚊及取花陰乾暑月置近燈燭令蚊蛾不侵故名護生草又方清明日用熨斗內著火炒棗子於臥帳內上下令煙出令一人問炒甚的答云炒狗蚤七問七答則狗蚤不生又方五月五日取浮萍陰乾燒煙去蚊子又方五月五日用熨斗燒一棗置床下闢狗蚤又方端午日午時用硃砂寫茶字倒貼之蛇蠍不敢近又方端午日午時寫白字倒貼於柱上四處則無蠅子又方元日平旦用鹽豉吞七粒終歲不於食中誤吃蠅子又方端午日午時望太陽將水咒曰天上金雞吃蚊子腦髓吸太陽氣吹燈心上唸咒七遍遇夜將燈心點照闢去蚊子又方端日用臘水洗屋下無蚊蠅又方端午日取萵苣成片放櫥櫃中闢蟲蚊蛀衣帛等物葉亦得又方端午日午時書儀方二字倒貼於柱腳上能闢蚊蟲又方凡造醬於三伏內黃道日浸豆黃道日蒸拌忌婦人見則無蟲又方七月七日曬曝革裘無蟲又方七月收角蒿置氈褥書籍中闢蛀蟲又方臘日用豬脂四兩懸於廁上入夏則一家無蠅子又方臘月水日曬薦席能去蚤蝨又方人家不欲燕子來巢者書戊字貼至處又方闢蚰蜒端午日書滑字貼之又方闢蚊蚋書風字間字貼窗壁下又方凡入山林默唸儀方不見蛇蟲誦儀康不怕虎狼又方闢蛇法於四壁柱上用倒流水研墨書龍字貼之又方多用小片磚瓦寫儀方二字置四處蛇自畏退又方斷鼠法用黑犬血和蟹燒之諸鼠悉去又方每月辰日塞鼠穴則自無鼠又方遇寅日以物塞鼠穴鼠自斷又方用狼糞和印香燒可聚鼠又方夏間點燈欲無蚊蚋相近就臘前一日以水浸燈心少時曬乾收之夏月用又方端午日用麻線一條圍床周匝以蝙蝠血塗遍系床四面絕蚊蚋又方燒蝙蝠屎可闢蚊子又方夜明砂與海金砂二味同和苦楝花每到黃昏燒一捻蚊蟲飛去別人家又方木鱉茅香分兩停雄黃減半也須秤每至黃昏燒一炷安眠高枕到天明又方用木屑一斗天仙藤末四兩研勻如印香燃之蚊蚋悉去又方用鱉血畫圍蚊聚或早間開一路即從開處出又方咒曰天地太清日月太明陰陽太和急急如律令敕面太陽念七遍吸氣吹燈草上點之闢蚊蟲又方端午日取浮萍曬乾二月收桐花一作苦楝花夜明砂合搗為末作印香燒堂中蚊永無又方夏月不令百蟲飛入燈初上燈時用淨草或竹木七寸虔心咒曰波利瑟吒護生草救護眾生離煩惱一氣咒七遍將草橫置燈盞上諸蟲不入又方端午日取大蝦蟆一個用好墨一塊入於口中紅線縛住取正午方掘一穴深五寸埋於內至第二日午時取蝦蟆口中墨收之用時將墨於壁上畫葫蘆一個用淨水噴三口蚊子盡入葫蘆內不可打殺欲其去時用扇扇去取墨蝦蟆活則驗又方用浮萍羌活為末焚之蚊自絕又方用鱉殼夜明砂為末燒之又方闢鼠取大雄鼠一個割去其勢放之滿屋自咬鼠死尤勝似貓又方闢燕子用白紙朱書鳳凰二字貼巢上即去又方闢蛇凡行路入山有蛇帶雄黃在身及草內研雄黃水塗腳心或腿褲上帶之蛇自不敢近又方去壁蝨用麝香殼三個置床蓆下即除去又方斷蚰蜒用白礬水灑來處又方打春時拾春牛泥撒在檐下蚰蜒不生又方闢蚊子用苦楝花柏子菖蒲各一兩為末慢火燒聞氣自去又方除蚤蝨床有壁蝨多用蒴藋或茯苓末鋪摻茵席下或用牛角燒熏亦妙又方用辣蓼曬乾鋪席下除壁蝨又方用枸杞子樟腦雄黃為末包貯置床度下可去壁蝨又方用百部根燒煙燻之又方用好木瓜切片鋪床下又方用雄黃龜殼牛角屑等分為末如香燒之又方用菖蒲浮萍蔥各一斤為末每用半盞許撒席上次日皆自死又方用騾蹄牛角黃柏木瓜燒煙燻之已上諸方皆除壁蝨治蟣蝨用菖蒲神麯白礬各半兩硝石一分黑錫一兩銚內熔錫入礬硝炒研成粉卻入菖蒲曲末以水一碗煮綿帶子不拘多少一炊久候乾每條以水銀一銖於手心內唾調如泥搓揉帶上用繫腰及頭衣服上永無治頭上蝨用藜蘆為末摻發中經宿蝨皆自落又方用輕粉少許摻頭上一二日蝨皆盡又方人多蝨者將及冬用水銀二三錢臘茶末一錢於掌內以津唾調開將綿作繩挼勻在上以絹作帶裹之繫於腰間須隔衣二重每年易之治狗蚤用菖蒲末摻席上又方用草烏菖蒲根等分並一盞炒乾為末摻之又方用白膠香床下熏之蚤蝨盡去治蠅蟲用臘月雪水遇晏灑幾碟上蠅自去又方用綠礬水澤食巾蓋桌器蠅不敢近治闢鼠耗用木刻貓兒一個以雌鼠尿調彩色畫之鼠見自走治衣服有蝨用百部秦艽各一兩為末燒煙燻衣蝨盡落浮
