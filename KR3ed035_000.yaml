body:
  text: 附録服藥忌例凡藥內有術勿食桃李及雀肉胡荽大蒜青魚鮓飴糖羊肉有藜蘆勿食貍肉有黃連橘梗勿食豬肉有地黃勿食蕪荑有細辛勿食生菜有巴豆勿食蘆筍羹及野豬肉有半夏菖蒲勿食飴糖及羊肉有甘草勿食菘菜海藻有牡丹勿食生胡荽有商陸勿食犬肉有常山勿食生蔥生菜有鱉甲勿食莧菜有茯苓勿食醋物有天門冬勿食鯉魚有地黃何首烏勿食蘿蔔令人髭發白有空青硃砂勿食生血物有黃精勿食梅實凡服一切藥不可多食生胡荽及蒜雜生菜又不可食諸滑物果實又不可多食肥豬犬肉油膩肥羹魚鱠腥臊等物凡服藥通忌見死尸及産婦厭穢事凡服藥病在胸膈以上者先食後服藥病在心腹以下者先服藥而後食病在四肢血脈者宜空腹而在旦病在骨髓者宜飽滿而在夜有風疾勿食櫻桃芥菜丹黍小兒勿與蓮實芡實食食之不長六畜治馬諸病用白鳳仙花連根葉熬成膏馬有病抹馬眼角上馬即汗出立愈治馬斷梁先用鹽擦去清水後以胡桃去膜嚼爛貼之若皮肉碎填滿紙封之治牛馬一切疥癩瘡用及己為末敷之或生搗塗搽又方用藜蘆為末水調塗治六畜瘡癩用蕎麥瓤燒灰淋汁洗之治牛馬疫病用醋和藥灌之治牛馬傷熱用胡麻葉搗汁灌之立瘥治牛馬驢病用獺屎煮汁灌若蟲顙細研灌鼻中治六畜食米脹欲死用酒麴煮汁灌之立消治牛瘴疫用石菖蒲淡竹葉葛粉鬱金緑豆蒼朮等分為末每服一兩芭蕉自然汁三升入蜂蜜一兩黃蠟二錢調灌之未解再灌熱極加大黃鼻頭無汗加麻黃鼻口出血加蒲黃又方用真茶末二兩和水五升灌又方用人參細切水煮三升灌又方用安息香及蒼朮於欄中燒赤鼻吸其香立止又方用十二月內收兔頭燒灰和水灌之治牛尿血用當歸紅花為末酒煎冷灌治牛腹脹用燕屎一合水調灌治牛噎用皂角吹鼻中以鞋底拍尾仃骨下治牛肩爛用舊綿絮三兩燒灰存性麻油調敷忌水五日治牛漏蹄用紫礦為末豬脂和內蹄中燒鐵鈚烙之治牛生蟲用當歸搗爛醋浸一宿塗之治馬中結用雄雞一隻拳捶死就熱便開取心肝腸肚嘴爪帶糞入風化石灰一合剁爛入麻油四兩調勻灌之雞不用治馬傷水用亂髮燒煙燻其兩鼻後用川烏草烏白芷胡椒豬牙皂角等分麝香少許為末以竹筒盛藥一字吹入鼻中須臾打嚏清水流即效加瓜蒂兼治一切中結病證治馬諸瘡用夜合花葉黃丹乾薑檳榔五倍子為末先以鹽漿水洗瘡後用麻油加輕粉調敷治馬瘦喂不肥用貫衆一兩為末調灌久則瘦蟲自去即肥治馬鼻內顙病用蕎麥磨粉灌及連稈切飼之凡馬行遠路宜早歇遲喂未喂之先飲水數口方可喂草則無中結等病治馬打破者用馬腳下尿屎濕稀泥塗上干即易之或溝中青臭泥塗可已破成瘡者用丹枯白礬生薑五倍子二味燒灰存性等分為末入麝香少許麻油調敷已成膿者以漿水同蔥白煎湯洗淨敷之凡羊惡濕宜作高棧除其糞穢巳時放未時收若食露水草則生病治羊生疥癩用藜蘆根不拘多少捶碎以米泔浸之瓶盛塞口置熱灶邊數日味酸先以瓦片刮疥處令赤或湯洗之去痂拭乾以藥塗上兩次可愈若癩多遂旋塗恐不勝痛又方用百草霜及鹽桐油各二兩調勻塗之治羊中水先以水洗眼鼻中膿汙令淨次用鹽一大撮就杓內沸湯研化候冷澄取清汁注少許於兩鼻內五日後漸愈治羊夾蹄用羖羊脂煎熟去滓以鐵鈚子燒熱將脂勻鈚上烙之勿令入水次日即愈治貓病用烏藥水磨灌之治貓煨火疲瘁用硫黃少許納豬腸中炮或魚腸煨熟飼之治貓誤為人踏死用蘇木濃煎湯灌之治狗病用水調平胃散灌之又方用巴豆去殼和平胃散調灌之狗卒死用葵根塞鼻內可活治狗遍身膿癩用百部濃煎汁塗之治狗為蟲蠅齧者用麻油遍挼其身立去治雞病用真麻油灌之養雞不抱法每下卵時食內加麻子喂之自然不抱常川下蛋養生雞用淨溫水灌洗雞腳放之自然不走養雞鴨用土硫黃研細同飯拌勻喂不數日即肥治豬病割去尾尖出血即愈治瘴疫用蘿蔔或葉與食之不食則難救治魚遭毒急疏去毒水別引新水沖之多取芭蕉搗碎置新水來處使吸之可解或以糞清澆池面也可跋衛生易簡方後古語有云不為良相則為良醫余尚以此自愧仕固短於才而負素餐之責醫亦失其愛而虧述事之功惟孜孜砥礪欲求分毫裨補於時而無由以致其力適永樂丁亥欽承上命巡歷四方東南經涉於海隅西北旋轉於沙漠海內郡縣罔不周流每自公餘旁求藝術採輯良方凡遇遘疾之人即投醫藥料理按方施治獲效良多日就月將經十七載至永樂癸卯裒其所積研精汰冗纂集成書名曰衛生易簡已經上表具進所存余稿安敢祕藏若但區區之管見曷足以公諸人斯皆往聖前賢之所訂定用之經驗傳布人間今余不過掇拾多方之散逸為之類聚群分以便於仁者之檢用爾蓋施藥不如施方之意也又豈敢擬議其良醫之萬一耶時永樂甲辰孟夏如來誕日毗陵胡濙謹志醫之道人命生死所繫未可以藝而視之也昔神農氏之王天下首嘗百草以救生民之疾苦身屢毒而不知恤軒後繼立爰與岐伯又覆論難以發揮天地五運六氣之祕推明人身五臟六腑之因順陰陽寒暑之宜制涼溫補瀉之法蓋無非欲人反一身之中和以合乎天地自然之中和使不至有乖戾淫慝以害傷其生也聖人仁民愛物何其至哉迄後和扁孫董諸賢以及近世劉張朱李之輩則又皆體承往聖之心掀擴未發之奧冥觀默究巧治奇攻故其術益精其道益著天下之疲癃殘疾顛連而無告者往往得以盡其天年而無枉橫夭折之患嗚呼醫之道果可以藝而視之哉古聖賢已遠不可得而見矣觀今春官尚書毗陵胡公所輯衛生易簡方則知公之用心即古仁人君子濟世利民之良心也且其中所列諸疾皆人所常患而治之當急所用之藥皆世所常有而致之不難間嘗以一二證試之無不神驗誠為簡易有效公卿士庶之家所當寶有而不可無者以之鏤梓行世豈不宜哉雖然古人有言不為良相則為良醫是蓋負其志而不能大有為於時者之言也惟胡公則不然抱明敏特達之才際壅熙泰和之世見知天子擢任春宮典邦禮以協和神人贊皇猷而振宣風化士林交譽遠邇馳聲是能大有為於時而其相業之良可見矣矧於軒岐之術尤能惓惓博究辨證授方必欲躋斯民於仁壽之域其為醫道之良又何如耶此豫所以嘉其能愛其賢遂忘其蕪陋特為表著其美以繫於所輯方書之末後之君子倘因是感發以廣其仁愛之術利濟之心則於國家安養元元之道實亦有所裨益豈徒云然乎哉豈徒云然乎哉宣德丁未仲秋榮祿大夫少保兼太子少傅戶部尚書監修國史長沙夏原吉書衛生易簡方後序蓋聞德施群生而不以為惠道濟四海而不以為功此古昔聖賢之用心降及後世鮮或有聞而豫何幸於今見之昔我太宗文皇帝嘗命禮部侍郎胡公源潔遍遊天下名山俾以御編性理大全為喜陰騭孝順事實諸書勸勵士庶而又俾其廣求奇方妙藥修合良劑以扶植疲癃德至溥也曷嘗以為惠道至隆也曷嘗以為功惟公克推先帝天地生物之心周覽四方遇名醫異人輒就而咨詢之由是所得奇方日增月益不可勝計遂編録為卷十二名曰衛生易簡方表進於朝伏蒙聖覽嘉嘆再三將以刊布中外而利濟於天下後世未果龍駕上賓萬方哀悼及今又四三年公乃居宗伯之任一旦慨然懷先帝之深恩念是編之弗傳而以大嶽太和山所録副本鋟梓以傳於世且屬豫言識其後豫惟天地之德曰生為斯民立命而生其生者聖道之大也上古聖神蓋慮夫斯民之札瘥夭閼弗克遂其生於是為之醫藥以濟之自時厥後名醫相繼學益顯術益精神功妙劑不可殫述公家世業醫活人之功匪一朝夕至公乃以科第發身而尤克究其家學用以濟人多有奇效是編也雖本於先帝博施濟衆之心亦惟公克相成而有以贊夫天地生生之德者也將見是編播之海內傳於後世使瘡痍為之蘇息枯朽為之發生熙熙然不自知其躋於壽域矣公之德不既多乎豫故樂為書之宣德二年歲次丁未夏五月既望資善大夫太子少傅工部尚書謹身殿大學士兼修國史總裁建安楊榮書書衛生易簡方後衛生易簡方凡十二卷附録一卷禮部尚書胡公源潔纂集之書也公初以都給事中後改禮部侍郎將使命於四方者幾草年名山勝境靡不遊歷足迹所至過於司馬子長遠矣咨詢之次間得醫方便於愈疾者類次為書名之曰易簡蓋簡則措語不煩易則藥無隱僻語不煩則人皆可曉藥無隱則急或可求視他方之博而寡要者大有徑庭既成編表進於朝上悅之什襲緘𤵄藏之祕府公退以其副鏤梓傳諸遠邇嗚呼公之用心可謂勤矣其惠利及人可謂厚矣余又聞公之近世以醫業相承嘗居善藥以應人之求貧困者不責其直賴以全活啻千百故公食其報於明盛之時今公是書之行所賴全活者日益衆子孫食報於後蓋可必也雖然公以弘博雅重之量為聖天子心膂股肱出謀慮贊可否以成無為之治俾億兆黎元咸躋仁壽之域要皆以易簡為本其德澤所被又豈是書而已哉此公素志余故表而出之宣德二年春二月朔日榮祿大夫少保戶部尚書兼武英殿大學士永嘉黃淮書書衛生易簡方後衛生易簡方者今禮部尚書毗陵胡公源潔之所編也公在永樂間由給事中擢禮部侍郎恆奉命出使四方凡山川風物之異宜民生習俗之異尚莫不歷覽而周知其故間以方書所載及時俗所傳醫藥之品施以濟人輒籍記而驗察之歲月既久所得益多乃復精加博採區分類別編集成書為十二卷名曰衛生易簡方其用心亦勤矣永樂癸卯秋豫扈蹕塞外公適以事赴行在且進是書時秋半天甚寒上召公至幄中與語披閲再四極加稱賞逮夜取燭命中貴人以璽鈐識其上匣而藏之及退已二鼓矣豫竊慶公榮遇之隆而深喜是書之遭也數年來公不肯自祕爰命鋟梓以嘉惠四方不鄙謂豫題其後惟仁人君子之於世無所不用其心方公周遊天下按轡咨糸羌所以宣上德達下情其仁及於民者多矣而尤思傍輯是編以惠夫札瘥傷癢之不得其所者其用心何如也今公位列六卿以輔佐天子燮理元化為任又欲廣是書俾天下之人皆得以濟其疾苦全其夭閼其用心仁愛周遍委曲復若此亦豈非調元之一助歟豫於此益嘉是書之遭而知我太宗皇帝所以嘉獎於公者非偶然也故為書諸卷末以著公用心之仁而凡得是編者有以精察而用之則其澤及於人人者其可涯涘哉宣德二年丁未秋七月甲午太子少保禮部尚書兼武英殿大學士臨江金幼孜書書衛生易簡方後醫之濟人博矣古之人立論制方所見雖不同其所以利人之心則一尚書胡公政務之暇集衛生易簡方余視之有三善焉隨證用藥無所不備便於人一也治疾或止一二味又非難致之物便於人二也其類聚明白雖非專於醫者皆可據而用之便於人三也通都大郡良醫善藥之所萃固不為無助若荒州小邑醫藥不易致而猝遽有急得此書而用之其所濟可勝言歟觀公之所用心知公之所及人嗚呼厚矣哉宣德丁未夏六月望日嘉議大夫太常卿兼翰林學士南郡楊溥書衛生易簡方後題辭盈天地間唯五運六氣五運主病六氣為病乖沴相乘諸疾並作上古聖神憫生民罹於夭札嘗藥著書惠利萬糞然而詞簡義深後世讀者宜猶望洋乎蠟因率而變為局方之學也方法雖繁療病少驗醫道緣是隱晦故先正有云醫書非吾傳不能讀斯言信哉禮部尚書毗陵胡公素承家傳之業又為當代通儒發身科第薦至宗伯受知於太宗文皇帝命出使四方省觀風俗問民之休戚苦樂奔走於外將二十年足迹遍乎區內詢咨暇日尤注意於醫藥方書之事博採廣搜詳討細論得省易經驗者總三千九百六十三方分為十二卷服藥忌例二十二條六畜四十七方為附録書成表進上嘉納焉用其副鋟梓名曰衛生易簡方間出示泰受而讀之見其立言不泛辨證無失施劑克當未嘗不嘆公用心之仁且勤也昔吾婺丹溪朱先生以母之久病由是志於醫乃渡浙入吳逾宛陵走南徐抵建鄴尋師無所遇復還杭拜太無羅知悌其懇遂得傳劉張李三家之旨以歸而其學驚動一世著論多前人所未發況公於名山大川雄藩巨鎮以及殊方絶域偏州下邑歷覽靡遺其得於異人高士心傳手授率他書所未載者誠足以裨輔聖明安養黎元之化也傳曰仁者人之所親有慈慧惻隱之心以遂其生成殆公之謂矣此編宜與古書並行於世必也泰敢忘其僣竅題辭於後云國子祭酒金華貝泰書書衛生易簡方後自神農軒後氏作而醫之學始傳由是生民之札瘥夭閼賴以全活者不可悉數後賢迭興專門世業各自名家奇方妙用並著厥效蓋不能以一二計也今禮部尚書毗陵胡公源潔以端謹之操宏博之學自為進士歷戶科都給事中拜禮部侍郎受知太宗文皇帝眷顧之隆倚任之重巡行四方積有歲年凡遇名醫異人所授方藥匯次成編分門別類計十二卷名之曰衛生易簡方繕寫以進聖情歡悅將壽諸梓以廣其傳未幾龍駕賓天宸志未畢逮於今茲奄忽數載而公繼以本職兼攝南京國子祭酒尋有宗伯之命追惟先帝恩遇之厚濟衆之功未獲報稱夙夜靡忘乃以所進方書副本鏤板以傳且囑余言以識其後嗚呼昔先帝臨御宵旰弗遑惟恐一民之不得其所遂於萬幾餘暇博採群方製為妙藥臣民有疾輒以賜之皆有奇驗恩澤所加銘刻心骨何其至哉公之此編實所以體先帝博施濟衆之心而其惠濟於人者亦可謂遠矣然則觀此編者不惟有以脫沉疴於既殆全痿斃於再生而於我朝君臣同心同德之盛亦因以見焉宣德二年秋八月朔奉政大夫左春坊大學士翰林侍讀學士兼修國史廬陵曾棨拜於謹跋右衛生易簡方十二卷禮部尚書毗陵胡公之所輯也公為侍郎時奉使命於四方觀風問俗之餘又博採古今醫方其可徵驗者分類而編輯之曰衛生易簡方表進於廷太宗文皇帝嘉之已而公又鋟梓傳之以廣其惠利嗚呼公之心何其厚哉士之用於世志於致君澤民也故凡事有可利於人者必為之豈非仁人君子哉若公之輯此方以示人者是已觀此則知公之為臣其謀謨密勿有裨於治而惠及於人者必尤多也昔宋侍中陳堯叟録集驗方數卷為廣南西路轉運時聞廣俗疾病不服藥多夭橫者堯叟以方刻石於桂州驛舍令按方求藥人遵其教病者多愈夫堯叟宋名臣也有學行政事而又能濟人如此非所謂仁人君子耶公之名位與其存心夫豈減於堯叟乎可為公道其美也間以此示英故僣為題其後云奉政大夫右春坊大學士兼翰林侍講學士太原王英拜書題衛生易簡方後醫仁道也蓋始於神農黃帝其後扁鵲華他之流皆神於其術然世之君子欲博施濟衆者未嘗不用心焉故以伊尹之聖而論湯液陸宣公許學士皆著方書以傳若此者非一也其仁之及於人可以數計哉天地之生人仁也然不能使之全其生故聖賢為醫藥以濟其夭死所以成天地之仁而為人司命也此其心蓋與天地流通矣而可以藝小之耶禮部尚書毗陵胡公初使於四方公事之暇輯諸醫方之有驗者凡十二卷名之曰衛生易簡方既表獻於太宗皇帝將復鋟梓以惠天下公之心蓋伊尹陸宣公許學士之心也昔之君子有自明其志者曰達則為良相不達則為良醫蓋二者皆得以施其博濟之仁今公有是書傳於人人之受惠者多矣而又佐天子任禮樂之事推以節民心和民聲充而至於贊天地育萬物然後為功之成此仁者之所能而達者之所為也豈特醫乎哉故因觀是書而識於後云奉議大夫右春坊右庶子兼翰林侍讀學士泰和王直題
