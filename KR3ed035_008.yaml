滓澄清又熬將剩一盞以硇砂一錢傾入鍋內合之待乾用刀頭刲起以瓷器盛之量瘡大小用神效待膿水出盡以生肌藥收口生肌散用寒水石不拘多少以鹽泥包裹炭火煅之黃丹少許水飛過用皮紙抬於火上烘乾色變為度共研極細用治瘡初發背脅間未辨癰疽癰即皮光赤疽則皮肉紋起不澤並以赤皮蒜切片厚一分覆瘡正中以艾灸初痛灸至不痛不痛灸至痛無不效者並一切惡瘡疥蛇蟲沙蝨溪毒並研敷良治癰疽發背用大金星鳳尾草葉根酒煎服亦解硫黃丹石毒治熱毒癰腫用杜天麻莖葉搗敷之治癰疽惡瘡用營實即薔薇搗敷亦服生肌長肉治發背欲死用雞腸草搗敷之治癰疽發背用五葉藤搗爛罨患處立瘥治癰腫瘡毒狗咬用腫見消苗葉爛搗貼之治腫毒惡瘡用紫金藤搗爛罨之治腫毒用大黃末敷患處治發背番白草即海菖蒲和根搗爛罨患處立效治癰疽未潰用栝蔞根同赤小豆等分為末醋調敷之亦治消渴身熱煩滿傷暑治癰疽惡瘡小兒丹毒腹內熱結用連錢草搗汁服之立瘥治癰腫熱悶口乾用芭蕉根搗汁服及腫毒遊風研敷之治暴赤腫用榆皮三兩搗和三年醋渣封之日六七易治諸毒熱腫及蛇毒用馬兜鈴根水磨為泥封之日三四易立瘥治發背癰疽已成未成用干柞木葉四兩乾荷葉心蒂萱草根甘草節地榆各一兩為末每服半兩水二碗煎半碗作二服早晚常服病愈為度治諸腫毒用生薑一塊面東擲過梁落地就於落處陽日畫圓圈陰日畫方圈以姜蘸好醋於圈內磨取地上泥於缽內入大黃芒硝末同姜研爛敷患處留瘡口毒自出治發背癰疽疔腫惡瘡用芝麻桿不拘多少燒灰存性以滾水浸灰用木棒攪百十下少時以草紙襯竹蘿淋汁盡再燒熱又淋過卻澄清汁入鍋熬約十碗熬至二碗卻用新石灰研細不拘多少裝瓷罐內以前汁傾些入罐用竹木杖急攪一二百下又傾余汁入罐約四指高浸之勿令乾過三七日用又可點麻子用時不可多只用一粒米許置紙上滲去汁水點毒瘡頂上即時腫消如腫或瘡破者用手按實硬處點些小即痊仍服托裡散用鹽霜梅多年者五七個或十餘個搗爛以井花水一碗逗勻生絹濾汁飲之即愈又方用蕎麥灰灰條杆灰石灰旋風草灰其草於三月上旬丙丁日連根拔焙乾燒灰四味不拘多少務勻停每升灰用滾水二升泡於桶內淋出汁曬春三日夏二日秋四日冬五日入鍋慢火熬至七分復入小銅銚內熬成膏入黃丹攪勻以瓷器盛之如不濃添石灰攪不問年深久近無名惡瘡瘰癧藨靨瘤子起出刺字用藥點之其效如神凡點惡瘡紅血出者再點至黑血出就用紙封瘡上即愈若點上就出黑血者難療痔瘡在內用紙裹藥點之起字用刀輕刮字畫上塵垢以藥勻塗用紙封上三日冷水洗之鐵鍋熬藥起字不得治貼骨瘤牙癰一應膿水不幹者用穿山甲二十斤麩半升同炒泡起後入牛蒡子四兩共炒黃色為度播去麩為末每服三錢好酒調病在上食後服在下空心服治發背色黑不疼痛者用艾葉一斤雄黃硫黃各半兩水煮半日候溫敷之十餘遍若疼可療如不疼出黑血者難治治發背初生開不住用白鹽梅皂角燒灰存性為末米醋薑汁調塗四圍連換即不走開如發熱者以茶清調塗立效治熱腫用山豆根水磨濃汁塗干即更塗治發背腫毒乳癰惡瘡用大黃白芷各四錢酒水各一盅煎至一盅服如噁心先飲生薑自然汁少許孕婦無服老弱量減或加甘草梔子各一錢已成者瀉下膿血治背疽諸般瘡腫用黑瀝青白瀝青杏仁不去皮尖各一兩輕粉一錢乳香沒藥各一錢半云香松香各二錢半石鐵臼內槌一千下成膏擇開定成三日修合不許陰人雞犬見用紅絹攤貼不要留眼無分大小惡瘡治皆大效治乳癰用人牙齒燒灰細研酥調貼癰上治卒腫毒起急痛用大蕪菁根削去皮熟搗苦酒和如泥煮三沸急攪之出敷腫帛裹日三易之治一切癰疽發背癤毒惡瘡用遠志洗淨去心焙乾為末酒調二錢澄清服之以滓敷患處又方用赤芍藥當歸甘草等分為末每服二錢溫酒調下不拘時又方用川烏蚌粉草烏海金沙赤小豆天南星為末以生地黃汁調塗患處又方用木鱉子去殼半夏各二兩水銀四兩草烏半兩於鐵銚內慢火炒焦為末出火毒再研以水調敷瘡治渴疾即愈之後須預防發癤疽之患用忍冬草不拘多少根莖花葉皆可用置瓶內以無灰酒浸糠火煨一宿取出曬乾入甘草少許碾為末以所浸酒打糊丸如桐子大每服一百丸不拘時酒飲任下一方用忍冬草水浸煎服治發背腦疽一切惡瘡用甘草半兩為粗末沒藥一分研大瓜蔞一枚去皮以無灰酒三升熬一升溫頓服如服不盡作三次治癰疽腫毒用黃蜀葵花鹽摻收入瓷器密封經年不壞每用患處敷之若無花根葉皆可治發背用厚朴薑製陳皮去白各三錢蒼朮米泔浸五錢甘草炙二錢入桑黃菰五錢同為末瘡潰乾摻未潰油調塗神效治發背肉潰及諸惡毒衝心痛不可忍令人嘔吐並毒瘡並皆治之用綠豆粉四兩乳香二兩同研極細每服二錢新汲水濃調食後服便癰治便毒癰用冬葵子為末每服二錢匕酒調三兩服愈又方初覺腫痛即用鐵秤錘於上按磨數次自消散又方用胡桃七個燒過存性為末食前酒調服不過三次又方用鹿蹄草搗爛罨患處又方用生米粉生蜜調一合服休吃飯以利小便為度又方用皂角不蛀者燒過存性為末酒調方寸匕服立效又方用皂角子七個水吞服亦效又方用牡蠣大黃甘草各半兩懸蔞一個銼碎酒一大盅浸露一宿服之以利為度治便毒等惡瘡用栝蔞一個去皮生薑甘草各半兩牛蒡子微炒金銀花各三錢不犯銅鐵器槌碎以酒一升煎數沸空心溫服微利為度治外腎癰瘡用抱雞卵殼黃連輕粉等分為末以熬過清油調塗治便癰用連翹當歸大黃梔子芍藥鷺鷥藤各一錢水盞半生薑五片煎一盞去滓溫服量力加減熱甚者加以利之又方用大黃三錢牡蠣燒一錢梔子甘草炙地龍去土各半錢水盞半煎一盞去滓溫服以利為度凡癰無頭腫痛服此宣通立愈又方用黃柏黃芩各一兩地骨皮半兩乳香沒藥各二錢別研為末井花水調作膏攤紙上貼腫處凡癰癤貼此消毒止痛疔腫治疔腫垂死用菊葉一握搗絞汁入口即活冬用根極驗又方用磁石為末好醋和封腫上根即立出瘥治疔腫及中風傷寒頭痛用蒼耳根葉生搗童便絞汁冷服一升日三度甚驗又方用蒼耳子燒灰和臘月豬脂封腫上治疔腫甚者用附子末醋和塗又方用針刺四畔以石榴皮末著瘡上調面圍四畔灸痛為度調末敷上急裹經宿連根自出又方用端午採豨薟草為末酒調半兩服汗出愈一方加乳香少許生白礬末一匙好酒一盅調服忌涼水魚腥無干末用新草搗汁尤好又方用白芨白蘞赤蘞等分為末津調塗瘡上若只一瘡用一人津調瘡多用三人津調服藥用鏽鐵末一錢又方用蒼耳根莖苗子一色者燒灰為末用醋泔調塗瘡上毒根即出或藍靛調尤好或用煎藥濾酒吃以滓服瘡又方用蟬蛻殭蠶為末醋調塗四圍留瘡口俟根出稍長然後撥去再用藥塗瘡最有功效治魚臍疔瘡用絲瓜連須蔥韭菜石缽內搗如泥以酒和服以滓貼腋下如病在左手貼左腋下右手貼右腋下在左腳貼左胯右腳貼右胯如在中則貼心臍並用布帛縛住候肉下紅線處皆白則可為安如有潮熱亦用此法卻令人抱住恐其顫倒則難救治疔瘡用硇砂雄黃等分研細以生蜜就於角合子內收貯遇患先用銀篦挑破瘡口擠出惡血後用藥一豆大安入瘡口內以紙花貼即效毒氣入腹嘔吐者即以滴乳半兩綠豆粉一兩為末煎生甘草湯調三錢時時飲之常令灌潤胸膈又方用蟬殼七個煅為末以蜜調搽瘡口又方用土蜂房一小巢全蛇退一條全共盛器皿中黃泥封固火煅存性碾為細末每服一錢重空心好酒調服少頃腹中痛痛止瘡已化成黃水仍用大黃生薑甘草金銀花各一兩皂角針二兩瓜蔞一個好酒二升煎八分去滓服不拘時又方用白殭蠶為末津調或醋調塗根自出大妙治疔腫惡瘡附骨癰經年不效毒瘡用自死螳螂燒存性為末以臘月豬脂和敷極效治疔瘡用白礬四兩於銀石器內熔作汁下黃丹二兩使銀釵攪慢火熬成紫色收起如有瘡先挑破周圍以唾津調藥塗上數度無令瘡干瘡潰疔出看瘡顏色紅赤為效又方用生蜜與隔年蔥研成膏先將瘡周圍以竹篦刺破後用藥於瘡上攤之以緋帛蓋覆如人行二十里覺疔出然後以熱醋湯洗之又方用苦蕒搗絞汁頻敷即根出蠶蛾出時切不可取拗令蛾子赤爛蠶婦忌食苦蕒又方用馬齒莧和梳垢搗封或燒灰和陳醋封根即出仍生搗汁服又方用苦苣搗汁敷甚效根即出癰未出膿用汁滴上立潰莖葉敷蛇咬根煮服治赤白痢骨蒸生搗汁飲不可同血蜜食作痔疾治疔腫惡瘡用蟾酥半錢輕粉麝香各少許巴豆一錢去皮先將巴豆研如泥次下余藥同研極細以油紙裹定用時以針微撥破瘡貼藥少許瘡自消散已成者亦追去毒即潰如癰腫成膿無頭亦微撥破用藥二次便穿凡惡瘡不可不用又方用硇砂雄黃砒霜南星等分麝香少許為末用竹針刺開塗藥即時黃水出瘡愈又方用蟬退為末蜜水調半碗飲之及以津唾調塗瘡上即潰又方用烏梅肉三四個槌爛以帛緊縛在瘡上卻將菊花根苗擂酒飲之不飲酒者用湯次日晚去烏梅自潰又方用白礬五錢青黛三錢陳石灰三錢同研至無聲每服三錢井花水半碗柳條攪千百下頓服厚衣蓋覆良久用蔥豉湯入醋少許極熱服得汗則解又方若初不知是疔瘡已經數日毒氣入里用雄黃鬱金各五錢巴豆去殼油半錢為末麵糊丸如綠豆大每服七丸冷茶清吞下取利為度如未利再服治疔瘡不出者用巴豆去殼半粒磁石為末以蔥涎同蜜為膏敷上疔自出瘰癧治瘰病用胡桃肉燒黑和松脂搗敷又方用七月七日未出時收麻花五月五日收葉二件作炷子於病上灸百壯又方用狼屎燒灰敷之治瘰癧已破未破用牡蠣四兩甘草二兩為末每服一大錢食後臘茶同點日三服甚效治瘰癧內消用斑蝥一兩去翅足以粟米一升同炒米黃去米不用細研入薄荷末四兩研勻以雞子清丸如綠豆大空心臘茶下一丸加至九丸卻每日減一丸減至一丸後每日服五丸治瘰癧腫硬疼痛久不瘥用貍頭蹄骨塗酥炙黃為末每服空心粥飲調下一錢匕治瘰癧用水蓼子炒為末每服酒調二三錢下久則效又方用馬齒莧陰乾為末以臘月豬脂和先以暖泔水洗瘡拭乾敷之日三易治瘰癧喉痹卒攻痛用百商陸根生搗捻作餅子置瘡上以艾灸三四壯治瘰癧發腫堅結成核用莽草一兩為末雞子白和敷於帛上貼之日二易瘥癰疽未潰並宜敷之治瘰癧經年不瘥用玄參研爛敷之日二易治瘰癧並臁瘡用貓兒眼草不拘多少搗汁於無油鍋內慢火熬成膏入炒過黃丹半兩乳香麝香各二錢攪勻瓷器收貯癧瘡破與未破用麥粒大艾炷四圍灸之然後貼藥干即換攤藥用生青布臁瘡不灸貼藥後用雄黃樟腦麝香等分為末荊芥湯一盅五更調服天明再服黃芩黃連梔子玄參薄荷木鱉子各等分水盅半煎滾生下大黃再一滾去滓溫服治瘰癧用瀝青不拘多少蓖麻子去殼同研成膏先以蔥椒湯洗瘡淨用紅絹攤膏貼患處又方用石灰一塊自晨曬至午將瀝青在石上捶細後剝皮尖杏仁四十粒蓖麻子十四粒同搗為膏依前攤貼又方用煙突中煙核珠為末油調搽又方用姜石為末雞子清調勻雞翎掃於瘡上並治發背惡瘡又方用鹿頂骨燒灰存性為末先以蔥椒湯洗瘡淨拭乾摻藥或油調搽生肌又方用連翹左纏藤即金銀花各半斤大甘草節四兩三味共為末每服一大匙酒調或茶湯調服忌雞魚油面燒肉又方用天門冬浸酒服藥滓敷瘡又方用荊芥煎湯待冷洗瘡淨揀黑紫處以針刺破卻用雄黃樟腦為末以芝麻油調搽三四次候黃水出盡未見日蚯蚓糞雞子大一塊火內燒紅以穿山甲九片或十一片微炙共為末入乳香沒藥少許油調搽無不愈者又方用梧桐子一錢半皂角仁巴豆去皮膜油各一錢共研細於淨室中勿令人見以不語唾調藥捻成錠子如黃蟲糞大陰乾每瘡用針刺開入藥一錠已潰者不針就入藥俱用紙糊封之不令透氣待膿水出或硬塊在內擠出惡物自斂口愈矣忌生冷油膩腥葷面物又方用乾薑為末以生薑自然汁打糊和作錠子黃丹為衣每日一次隨瘡大小入藥在內追出膿盡生肉為度如瘡口不斂用大黃末以蔥白汁調搽即愈若瘡腫不破者用野菊花根搗爛煎酒服以滓貼瘡自消或不消瘡口亦自破依前用錠子追膿生肉斂口神效仍每日服下藥二貼用人參黃耆當歸酒浸川芎防風白芷肉桂粉草桔梗厚朴薑製各等分每服四錢以無灰酒二盞煎一盞食後溫服滓再煎又方用白朮檳榔甘草俱生用牽牛半生半炒熟郁李仁湯浸去皮斑蝥糯米炒去皮足翅不用米防風各等分為末糊丸如桐子大早晚煎甘草檳榔湯送下每服二十丸至一月後覺腹中微痛於小便中取下癧子毒物如魚目狀已破者自合未破者自消又方用斑蝥去頭足翅赤小豆白殭蠶苦丁香白丁香磨刀泥等分為細末十歲以上服一錢二十以上服二錢五更用新汲水一盞調下至辰時見效女人小便中男子大便中見赤白色三兩次為效當日服白黏粥不得與別物大忌油膩患三四年者只一服七八年者再一服又方用白膠一兩瓷器內熔開去滓再熔以蓖麻子六十四個作泥入膠內攪勻入小油半匙滴一點水中試輕硬得所量瘡大小以緋帛攤一膏可治三五瘡並治惡瘡軟癤皆效又方用臘月貓糞以新瓦兩個合在內用鹽泥固濟燒成灰小油調塗瘡口上又方用硇砂乳香沒藥半夏輕粉赤石脂等分為末糯米粉丸如桐子大每服十丸加至二十丸臨臥皂角子湯下又方用乳香砒霜各一錢硇砂一錢半黃丹半錢紅娘子十四個去足翅為末糯米粥和作餅子如膏三錢厚貼瘡以麵糊封之如不破者艾灸七炷大者不過一月其核自下又方斂瘡生肌用黃柏不拘多少為末麵糊塗患處甚妙治瘰癧結核無首尾並一切惡瘡及諸瘡腫用沉香木香雞舌香各三錢熏陸香麝香各一錢連翹五錢為末每服二錢水一盞煎六分不拘時服治熱毒瘰癧腫痛已消瘡已破出膿水服此藥用紫參苦參各一兩連翹滑石各二兩丹參一兩半膩粉麝香各三錢為末別用玄參一斤搗碎以酒三碗浸三日絞汁去滓用皂角子三百枚煨熟為末和玄參酒熬成膏搜前藥丸如桐子大每服一丸黃耆湯下一日加一丸至患人歲數即住如四十則二十丸止每日卻減一丸瘡自干有結內消治風毒結核瘰癧腫痛用牛蒡子微炒何首烏各二兩薄荷雄黃各一兩麝香牛黃各二錢半為末以皂角七挺水二升捶汁熬膏丸如桐子大每服二十丸黃耆煎湯下治久漏瘰癧發於頸腋間癢痛憎寒壯熱用白花蛇酒浸軟去皮焙乾秤二兩黑牽牛半兩半生半炒用生犀鎊半錢青皮為末每服二錢膩粉半錢研勻五更糯米飲調下以利下惡毒為度十餘日再進一服可絕根又方上藥取利後服此補之用海藻洗石決明煅羌活瞿麥穗等分為末每服二錢米湯調下治瘰癧用丁香五十個斑蝥十個麝香一錢別研為末以鹽豉五十粒湯浸爛斫如泥和前藥勻丸如綠豆大每服五七丸食前溫酒下日進三服至五七日外覺小便淋瀝是藥之效或便下如青筋膜之狀是病之根也忌濕面毒物又方用荊芥穗殭蠶黑牽牛各二錢斑蝥二十個去頭翅足糯米炒為末臨臥時先將滑石末一錢米飲調服半夜時再一服五更初卻用溫酒調藥一錢服訖如小便無惡物行次日再進一服又不行第三日五更初先進糯米稀粥湯卻再進前藥一服更以燈心湯琥珀末一錢重服以小便內利出惡物為愈治瘰癧瘡破潰用獨角仙燒為末貼之大效治卒患耳前後有瘡作核如杏核大小不等名馬刀瘡是瘰癧根用桃樹白皮貼瘡上以艾炷灸之覺熱痛者自消治一切瘰癧瘡用雄黃三錢乳香一錢信半錢為細末糯米麵和作餅子如錢眼大已破者貼瘡口上未破者灸三五壯貼上餅子用膏藥貼封至一月餘自然下如小球兒如未下再用一餅必下治瘰癧一切惡瘡消毒止痛活血潰膿去風生肌尤治杖瘡痛用桃槐柳枝各半斤當歸一兩木鱉子半兩去殼黃丹一斤乳香沒藥各半兩別研極細先用好油三斤慢火熬續下三枝候焦漉去不用下木鱉當歸焦去不用冷定下黃丹乳香沒藥以槐枝攪丹性死再用慢火熬不住手攪滴水中成珠不散為度以磁器盛之旋攤用治瘰癧結核用堇菜乾末和油煎成膏摩核上三五度瘥治瘭疽手足肩背累累如米色白刮之汁出發熱用蕪菁子熟搗敷之即止治瘰癧並風毒赤腫用地松搗敷干易之治瘰癧不問已破未破用烏雞子頂上開竅攪青黃勻卻以線系斑蝥一個去頭翅足入雞子中紙糊蓋之飯上蒸熟剝殼去斑蝥空心吃雞子一日一個以瘥為度又方用不蛀皂角三十枚作一束以棕櫚裹之縛定於廁坑內浸一月取出於長流水中再浸一月切不可用死水浸去棕曬乾不可焙搗為末每末一兩入麝香半錢全蠍七個研細拌勻每服二錢溫酒或湯飲調不過二三兩即愈又方用雄黃鬱金各五錢巴豆去殼油半錢斑蝥七個去翅嘴糯米炒變色為末麵糊丸如綠豆大每服五七丸臨臥冷茶清吞下
