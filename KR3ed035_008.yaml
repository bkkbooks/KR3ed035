body:
  text: 卷之八頭面治頭面腫大疼痛並喉痹用殭蠶一兩大黃二兩為末薑汁丸如彈子大每服一丸井花水入蜜少許研食後徐徐呷飲又方用砭針刺腫處出血立效治腦宣用皂角去皮弦子蜜炙捶碎水揉汁熬膏搐鼻內口咬箸良久涎出為度治面風用益母草灰麵湯和燒七次洗面用之治頭上乾溼癬瘡用白礬為末酒調塗之治大小腦疽用枳殼半個去瓤以生薑自然汁調飛羅面成膏填殼內蓋瘡上糊扎住待瘡愈取之治頭上瘡用海螵蛸白膠香各二錢研細入輕粉半錢再研先以清油潤瘡卻將藥末乾摻瘡上只一次便可甚者二次治大小人頭上軟癤用桃樹上霜打不落干桃子名桃奴為末油調敷治軟癤流膿不愈用爛船底油灰為末油調敷極效治一切風熱上攻頭面浮腫生瘡及偏正頭風用柴胡羌活當歸防風川芎甘草等分為粗末每服三錢水一盞姜三片煎七分去滓溫服治頭上風屑極癢以藜蘆根不拘多少為末先洗頭避風候半乾用藥摻擦在頭皮上卻束髮緊縛兩日夜治面瘡用平胃散以冷水調塗之治面皯用杏仁去皮搗和雞子白夜臥塗面明早以暖酒洗之治面上䵟黑子用李核仁去皮細研以雞子白和如餳塗至晚淡漿洗之後塗胡粉不過五六日效治面上皯搰用白附子為末臨臥先以漿水洗面後以白蜜調末塗紙上貼之漸次自落又方用白殭蠶為末如上貼之治面上黑痣用寒食前後取桑條燒灰淋汁熬成膏塗痣自落又方用烏梅為末唾調塗又方用茯苓為末以白蜜調塗亦落治面上白駁用鰻鱺魚皮炙令脂出塗之又方用官桂為末唾和敷之又方用蘿摩草拭之自然除去又方用蛇脫皮熟摩棄草中又方用半天河水洗之即空樹中及籬頭水也白駁即癜風治面上瘢靨用淨地上種鐵掃帚一株待黃落後去莖掃地上葉子並根共煎湯澄清洗面三四次其瘢自消又方用木蘭香一斤三年米醋浸令沒百日出曝乾為末以敷之每日亦服方寸匕又方用雞糞白為末塗之又方用殭蠶衣魚鷹屎白等分為末以面膏和塗減一切瘡瘢痕治減瘢痕及雜瘡用寒食飯研敷之治面上皯皰及婦人黑疱如雀卵色用白茯苓末蜜和敷之治面上多䵟𪒟如雀卵色用羖羊膽一枚酒二升煮三沸以塗拭之日三度差治年少面起細疱用浮萍挼盦之亦可搗汁飲少許治面上粉刺用菟絲子搗絞汁塗之瘥治豆瘡瘢並䵟𪒟㾴鼻用密陀僧為末乳汁調塗效治疳瘡生身面上用葵根燒灰和豬脂塗之治面耐風日用臘月豬脂常摩面上經風日不變治頭上白屑用山豆根末油浸塗如小兒即以乳汁調半錢敷治頭瘡白禿用雞窠中草和白頭翁草燒灰存性為末豬脂調敷治痄腮用赤小豆為末以雞子清調塗治眉毛脫落用七月烏麻花陰乾為末生烏麻油浸每夜敷之治頭瘡用大筍殼葉燒灰入少膩粉生油調敷治䵟𪒟風刺用苦參一斤紅芍藥冬瓜子各四兩玄參二兩為末每用一字手洗面上又方用白附子白芨白蘞密陀僧白茯苓胡粉等分為末淨洗臨臥以乳汁調一錢塗面旦洗光淨牛乳亦可洗面䵟藥用豬蹄一副去黑熬膏入蜜二大匙白芷瓜蔞白芨白蘞茯苓藿香各一兩梨二個再同熬至滴水不散濾過臨臥塗面次日將水洗之治頭面上瘡用鍋子底黑煤以小油打成膏攤紙上貼瘡面上少用恐有黑痕治眉斂頭瘡用小麥燒黑存性為末以小油調塗瘡上治靨用蕎麥秸一擔不爛者燒灰存性入石灰半斤用熱水淋汁以鐵器煮漆匙攪成膏子於靨上點自去或先以草莖刺破亦可又方用桑柴灰石灰淋汁熬膏草莖刺破點以新水沃之忌油膩等物治頭上生瘤子用蛛絲勒瘤子根三二日自然退落治頭面上瘡用雞子黃熟煮炒令油出以油和輕粉敷之治白禿瘡用山豆根水研敷髮鬢治發落不生用麻子一升熬黑壓油敷頭則發漸長又方用楸葉搗汁每日塗之自出又方用羊屎塗之漸出治髭發脫落能令再生用黑附子蔓荊子柏子仁各半兩為末烏雞脂和搗研干置瓦盒內封固百日取出塗在髭發脫處三五日即生自然牢壯不脫治黑髭發用自己亂髮洗淨每一兩入椒五十粒泥封固入爐大火一煅如黑糟細研酒服一錢匕髭髮長黑治鬚髮白用覆盆子榨取汁合成膏塗之不白又方用金櫻子和鐵粉研拔去白髮敷之再出黑者亦可染髮治年少發白拔去白髮以白蜜塗毛孔中即生黑者若不生搗梧桐子塗上必生治髭發乾燥用小麥麩半升半夏湯洗沉香半兩水二碗生薑一兩和皮細切同煎去滓取清汁入腦麝少許攪勻洗髭發自然潤澤治髭發黃赤一染即黑用生薑半斤生地黃一斤各淨洗研自然汁留滓以不蛀皂角十莖去黑皮並筋於前藥汁內蘸炙黃再蘸炙汁盡為度卻將藥滓同入罐內用火煅存性為末以鐵器盛末三錢湯調停三日臨臥將藥蘸髭發即黑又方用熊脂塗發梳之散頭入床底伏地一食頃出便盡黑不過一升脂驗又方用酸石榴五倍子芝麻葉同杵碎絹袋盛於鐵器內盛浸掠發自黑治髭發白用赤石脂川椒辰砂茯神乳香各一兩為末棗肉丸如桐子大空心酒下三十丸兼明目延壽老少皆可服治發落用生薑皮人參各一兩為末每用生薑片蘸藥於落處擦之二日一次用手足治手足忽發瘤用白梁米作粉鐵鐺熬赤以眾人唾和塗厚一寸即消治手足有傷而犯惡露則不可治惟用薤白爛搗以綿囊之火烘極熱去帛敷上以帛急裹冷即易亦可作餅安瘡上以艾灸上使熱氣入瘡中水下瘥治手指忽腫痛名代指用烏梅仁杵碎以苦酒和將患指漬其中須臾瘥治指掣痛用醬和蜜溫敷之愈治手足指頭害久不愈用雄黃研水塗數次即愈治甲疽弩肉裹甲膿血疼痛須剔去肉中甲或成瘡不瘥用乳香末膽礬燒研細等分敷之肉消愈又方用生牡蠣厚處生研細為末每服二錢研靛花酒調下如癰盛已潰者以末敷之更服藥日三服治甲疽或因割甲傷肌或因甲長侵肉成瘡腫痛復緣靴窄研損四畔黃水浸淫五指俱爛漸引上腳如火燒瘡用綠礬五兩置鐵板上火煅礬沸如金汁者良沸定汁盡去火待冷按為末色似黃丹先以鹽湯洗瘡拭乾敷之治臂腿脛痛用虎脛骨四兩粗搗熬黃羚羊角屑二兩芍藥四兩銼細無灰酒浸春夏七日秋冬倍之每旦空腹飲一杯冬間速要服以銀器盛於火爐中暖養三兩日即可服不計深淺皆效治寒足跟凍爛每五月五日午時以薑蔥艾揩一時許更不再發治腳指腫爛如火燒瘡用綠礬飛過為末先以鹽湯洗瘡拭乾敷之治足筋急痛用生薑半斤搗如泥貼裹痛處治遠行腳打成泡用水調生面糊貼過夜即干不可穿破治手足皴裂血疼痛及冒涉凍凌面目手足皴壞疼痛用豬腦髓著熱酒中洗之瘥治手足皴裂用獺四足燒灰蜜調塗又方用鵝尾罌塗擦治凍瘡及折破瘡用臘月新死鼠一枚油一升煎之令爛絞去滓再煎成膏塗治凍腳瘡用茄根並枯莖葉煮湯漬之茄不可多食動氣發痼疾又方用熱醋湯洗研藕貼之又方用五倍子煎湯洗又方用乾薑燒灰為末敷之或用雀腦髓塗凍破處治腳裂折用藉爛蒸研如泥敷之又方用五倍子為末和豬脂成膏入裂內或用牛髓和填縫內即好治凍瘡用黃柏為末乳汁調塗又方用山藥少許於新瓦上生磨為泥塗之治手足裂用白芨不拘多少為末水調塗裂處又方用頭髮一大握桐油一碗於瓦器內熬候油沸頭髮熔爛出火攤冷以瓦器收貯勿令灰入每用百沸湯泡洗皸裂令輕拭乾敷上即安一方加水粉又方用瀝青二兩黃蠟一兩共熬攪勻瓦罐盛貯先以熱湯洗令皮軟拭乾將藥於慢火上略炙熔敷之治手足皸裂春夏不愈者用生薑汁紅糟鹽臘月豬脂共研爛炒熱擦入裂肉一時雖痛少頃便皮軟皸合再用即安治腳指縫爛瘡用撏鵝時取鵝掌黃皮焙乾燒灰存性為末濕則摻之治臂腫並腕疼痛用死蛇一條煮取濃汁用大筒盛滿浸痛處冷即再暖浸不過三次愈治腳脛風搐用烏頭一兩炮裂附子二兩炮麻黃四兩去節同為末煉蜜丸如桐子大每服五丸空心酒下日三服忌熱物治腳痛成瘡用水蓼者湯頻淋洗瘡干自安癰疽治發背用活蝸牛一百個內淨瓶中以新汲水一盞浸之封系自晚至明取蝸牛放之其水如涎將蛤粉調雞翎掃瘡上日十餘度痛止瘡愈治癰腫發背乳房初起微赤用栝蔞搗末井花水調方匕服治癰腫用伏龍肝以蒜和作泥塗貼干則再易治發背用甘草末三兩大麥面九兩好酥少許和勻百沸湯溲如餅方圓大於瘡一分熱敷腫上冷則換已成膿水自出未成腫便消治腫毒用牛蒡子根入鹽花搗拓腫上治發背諸癰腫未有頭者用濕紙拓上先干處便炙之先疼炙至不疼先不疼炙至疼治癰疽惡瘡膿血不止用地骨皮洗先刮粗皮專刮細白瓤以粗皮與地骨煎湯淋瘡令膿血盡以細瓤貼之效治癰疽發背乳房用茱萸一升搗爛苦酒和貼治癰疽發背乳房初起微赤用苧根搗敷之數易治一切癰腫風疹用芭蕉根搗敷干即更上日易三四次無不差者治惡毒癰腫連陰及小腹疼不可忍者用茴香苗葉搗汁一升服日三四用其滓貼腫上冬間根亦可用極驗治一切腫用紅花搗汁服之不過三服便瘥治乳癰用生地黃汁敷之熱即易無不效治乳癰腫痛甚用白姜石為末以雞子白和如餳敷腫上干則易之亦治疔腫又方用榆白皮和雞子白搗敷立瘥治瘡癰蛇蟲等毒用青黛大黃末雞子清調塗治癰毒無頭用蜀葵為末敷之治發背癰疽已成者用龍葵一兩為末麝香一分研勻塗瘡上治一切癰腫無頭用葵子一粒新汲水吞下須臾即破如要兩處破服兩粒要破處多逐粒加之驗治消腫毒用大黃末飛丹米醋調塗治腫毒惡瘡用久陳米蒸作飯和醋研封腫上立瘥治癰腫未成膿用牛耳中垢封之愈治癰腫諸瘡已成膿不得破用雄雀屎一枚末敷之立效屎頭尖及堅者乃雄治癰發數處用牛糞燒灰以雞子白和敷之干即易治癰一切腫未成膿用白牡蠣為末水調塗干更上治凡腫毒已潰未潰用鯉魚燒灰醋調塗以瘥為度治癰腫惡瘡用露蜂房燒末醋調塗干更上亦可煎湯洗治癰已有膿當塊用醋和雀屎敷癰頭上如小豆大即穿治諸腫失治有膿用蛇蛻皮燒灰水和封腫上即膿出治熱毒癰腫用赤小豆為末雞子白調塗小兒急黃爛瘡煮汁洗不過三度瘥煮食令人美食開心孔去煩熱止小便數治一切腫毒用大豆和飯搗塗及煮食之亦下熱氣解諸藥毒消腫和桑汁煮下水鼓腹脹治一切癰疽用冬瓜削一大塊置瘡上熱則易之分散熱毒氣甚良治發背欲死用冬瓜去蓋合瘡上瓜當爛截去更合之瓜未盡瘡已斂小矣即用膏藥養之治癰腫癤毒內攻未出膿者用葵子水吞三五枚逐作竅膿出一方吞葵子百粒當日瘡頭開治癰毒無頭用蜀葵杵敷之治腫毒用粢米粉熬黑雞子白和如泥塗帛上貼之帛作竅以泄毒氣易之效治發背用石葦炒為末冷酒調服治癰疽發背乳房初起微赤用黃柏末和雞子白塗之治一切腫毒用白斂赤小豆莽草為末以雞子白調塗又白斂療湯火瘡生肌止痛治石癰堅如石不作膿者用生商陸根搗爛塗干即易之治乳石發動小便閉澀心神悶亂用船底青苔如雞子大以水一盞煎五分去滓溫服日三四服治一切熱毒腫同樟柳根和鹽少許爛搗敷之日再易治癰腫喉痹蛇蟲狂犬等毒並宜用紫荊煮汁服之亦可洗治腫毒已潰未潰者用鹿角膠一片水漬軟貼腫當頭上開孔若已潰還合者膿當被膠急撮出盡未有膿者腫當自消矣治發背初生用生麻三兩為末水三升煮一升分三服不拘時便定治一切癰腫發背初出疼痛難忍用栝蔞根為末每服三錢井花水調下不拘時又以唾調貼之治發背疽有膿用栝蔞馬齒草蛇皮燈草胡桃仁共研以少許水攪勻地上掘