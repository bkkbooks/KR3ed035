body:
  text: 卷之九瘡癤治卒得惡瘡人不識者用牛膝根搗爛敷之治魚臍瘡毒腫用瞿麥燒灰和油敷腫上甚妙治瘡疤將出用牛蒡子炒熟為末每服一錢荊芥二穗水一盞煎七分溫服如瘡膿已出更服亦妙治惡瘡丹毒用苧根三斤水三斗煮溶每日塗之治漏瘤瘡濕癬癢浸淫日廣癢不可忍搔之黃水出瘥後復發用羊蹄根爛搗酒調敷上一時間以冷水洗之日一敷瘥或用醋澱調黃水出者乾摻亦治白禿陰蝕疽痔治馬汗入瘡腫痛用生烏頭末醋調敷瘡口良久有黃水出愈治一切惡腫疥癬久不合者用血竭密陀僧為末敷之治諸瘡腫蛇犬咬用黃藥子為末冷水調敷瘡上干即再敷亦可服一二錢治卒得惡瘡不識者用苦竹葉燒灰和雞子黃敷之治惡瘡有蟲久不瘥用柏節燒油敷之及敷牛馬瘡疥治惡瘡連痂癢痛用萹蓄搗爛封之痂落即瘥治諸瘡用馬勃敷貼甚良治熱瘡用蕪荑搗爛和豬脂塗瘥治一切瘡腫用紫荊木煎湯洗除血長膚治瘡腫用山慈菇莖葉搗為膏入蜜貼瘡口上候清血出效治遊風熱毒風疹惡瘡疥癩小便壯熱用苦楝皮煎湯浸洗治風熱濕瘡癢痛用馬齒莧四兩爛研入青黛一兩再研均塗瘡上干再塗治惡瘡膿水不瘥者用黃蜀葵花作末敷之即愈服之治諸淋治瘡上有風水腫疼秘澀用蔥葉乾薑黃柏煮湯浸洗立愈正月勿食生蔥發麵上游風燒蔥和蜜食殺人治五般瘡癬用韭根炒存性搗末以豬脂調敷三度瘥治諸瘡中風寒水腫痛用韭白生搗敷之能生肌治反花瘡用馬齒莧一斤燒灰豬脂調敷之治肺毒瘡如大風疾用桑葉洗淨熟蒸一宿日乾為末水調二錢服治一切熱毒瘡用蚯蚓糞和鹽醋調塗治卒中瘑瘡其瘡常對在兩腳用桃葉杵爛和苦酒敷皮亦得治惡瘡用鯽魚骨燒灰敷之治諸惡毒瘡五色無常用乾薑末蜜和敷之治多年惡瘡不瘥或痛癢焮爛用馬糞研並齒末敷上不過三兩遍愈治惡瘡疥癬蟲瘻疽蟄毒用五穀和松枝雄黃燒灰存性為末醋調塗治惡瘡蛇犬咬用韭菜爛搗敷之治癧瘍風並鼠瘻用途中死蜣螂杵爛封之一宿瘥或燒為末苦酒和敷數遍愈先以鹽湯洗亦治疔瘡治癧瘍風及三年用烏賊魚骨醋磨先以布擦肉赤即敷之治癧瘍風用羊蹄根於生鐵上好醋磨旋刮塗患上未瘥入硫黃同磨治一切惡瘡中冷息肉用正月狐屎乾末新汲水食前一錢匕服治諸瘻用泔清溫洗以綿拭水取葵菜微火暖貼瘡引膿不過三二百葉膿盡即肉生忌房室魚蒜等物治鼠瘻腫核痛未成膿用柏葉杵爛敷之炒鹽熱置腫上熨令熱氣下即消治瘡內惡肉用寒食麵一兩水和作餅包巴豆半兩在內休教透氣以慢火燒黑為末量瘡口乾貼之治一切瘡肉出用烏梅燒灰為末敷上惡肉立盡極妙治惡瘡潰膿活血去惡肉用白礬鹽等分慢火炒乾為末量瘡貼之治惡瘡追毒去死肉用言雄黃各半錢乳香二錢麝香少許為末每用少許貼痛上膏藥封之治一切風熱瘡癬癰疽癤腫咽頰不利舌腫喉閉鼻衄咳嗽痰實腸胃燥澀大小便結滯用連翹當歸大黃梔子芍藥鷺鷥藤各等分為粗末每服五七錢水一大盅生薑五七片煎七分去滓溫服量力加減熱甚者加以利之治一切惡瘡追毒去死肉用巴豆半兩去皮雄黃豆粉各三錢為末量瘡干貼治惡瘡赤腫瘤用大黃二兩黃連半兩地骨皮一兩朴硝三錢為粗末每用三五錢水一盞煎七分去滓冷用雞翎掃腫處大妙治一切瘡癤癰疽無頭腫痛用大黃一兩牡蠣燒三錢甘草炒梔子各錢半地龍去土一錢為粗末每服五錢水一盞煎六分去滓溫服得利立愈治瘡惡毒連心痛悶睡臥不得用獨蒜二個爛研和生小油塗瘡上干即換痛立止治一切瘡有爛死肉用地榆為末摻之死肉自去止痛生肌亦治金瘡治諸般瘻瘡作孔穴多年不瘥者用龍葵根小蒜樓蔥附子雄黃麝香赤小豆各少許為末醋和作餅可瘡大小貼瘡上以艾炷灸之餅子焦黑即瘥又方用巴豆燒灰為末貼瘡孔內以膏藥封之大妙治瘡癤癰疽膿未得盡用黃丹半錢飛羅面一兩研勻滴水為劑捻如麥粒一頭大一頭小納瘡中用膏藥封之膿自出淨治惡瘡久不效用豆豉炒為末以臘月豬脂調塗又治舌上生瘡胸膈痛以末口內含一宿即愈又方用三家洗碗水煎沸入鹽少許溫洗不過三五次愈治蜂瘻瘡用五月五日收乾死蜣螂微炒為末醋和敷大妙又治一切惡瘡用油調敷治附骨癰死蜣螂七枚大麥一合同為末唾津調貼大效治一切瘻瘡用松脂為末填孔中滿每日填三次十餘日效治一切惡瘻瘡中有冷胬肉用正月狐子糞為末每服一錢新汲水調下食前服治胬肉如蛇用硫黃為末摻之大效治諸瘡內胬肉如蛇出數寸用硫黃一兩為末於胬肉上塗之其肉即縮治一切惡瘡不效常有膿水出不生肌用白礬綠礬等分先以白礬飛動入綠礬飛定為末摻之自生肌肉甚效又方用寒水石燒透入黃丹少許如桃花色加滑石赤石脂共為細末塗大效治惡瘡癬用驢糞燒灰研細頻摻瘡口治魚臍瘡用飛白礬地上攤過以寒食麵糊調貼治癤毒初起一二日用米醋煮肥皂爛研厚塗之紙花蓋干則換治軟癤流膿不愈用處瓷搗末摻癤口上或油調敷即愈治諸般惡瘡用大黃東牆上土為細末以無根井花水調塗干再搽經宿即愈治一切惡瘡並人食毒物用硼砂甘草各四兩入瓷瓶內以香油一斤浸之遇有患者急令服油一小盞立效浸久尤佳治瘻蛄瘡用良薑白芨瀝青等分為末嚼芝麻水同熬為膏入冷水凝定同緋帛一片火熨作膏藥貼瘡上又方用千年石灰茜草根燒灰同為末以小油調雞翎塗上治一切惡瘡用瀝青白膠各一兩春秋用油蠟三錢夏用油蠟二錢半冬用油蠟四錢先熔開油蠟下前二味以槐枝攪勻綿子濾過入冷水中手扯千餘遍如瘡已透吃數丸作劑於瘡口填亦妙攤紙上貼勿令火灸又方用天茄葉貼之或為細末貼亦妙又方用臘月人中白燒灰油調塗瘡疥上又方用瓦松不拘多少陰乾為末先用槐枝蔥白湯洗過摻之立效灸瘡久不斂者摻貼更妙又方用蒲公英搗之貼一切惡瘡惡刺又方用白殭蠶直者大黃二味等分為細末生薑自然汁與蜜同和丸如彈子大每服一丸細嚼下治惡瘡死肉用巴豆一錢去皮油五靈脂半兩黃丹二錢飛枯白礬一錢為細末以糊和為錠子入瘡內用之治惡瘡用紫花地丁根曬乾以四個半頭磚壘成爐子燒著地丁用絡垛磚一塊蓋了使磚眼內煙出熏瘡出黃水自愈治諸瘡水風腫用生白礬為末水調塗之自消治肺受熱毒遍身生瘡用苦參為末粟米飯和丸如桐子大每服五十丸空心米飲下治黃泡熱瘡用清油二兩青木香半兩青竹茹一小團杏仁二七粒去皮尖共置鐵銚內慢火熬令杏仁色黃去滓入松脂末半兩熬成膏每用少許擦瘡上治一切瘡癤癰疽發背已潰未潰悉皆治之大能排膿血生肌肉用巴豆去殼膜淨二兩木鱉子去殼二兩黃丹四兩飛過研細清油十兩槐柳嫩枝各七條七寸長銼細先將木鱉巴豆槐柳油內浸一宿慢火熬諸藥黑色用生絹濾出渣復熬下丹用長槐柳條不住手攪候有微煙起即提出點藥滴水面凝結成珠不散方成膏矣傾瓷器內收置新汲水內三日出毒然後用之治一切瘡疽及傷折損痛用巴豆去殼殭蠶去絲嘴赤芍藥白芷各五錢五倍子二錢黃連一錢亂髮如雞子大桃柳枝各七寸蓖麻子三十粒去殼豬膏一指面大以清油半斤浸藥三日慢火熬令發爛出火候冷絹濾去渣澄清再入銚內熬入飛過黃丹四兩以桃柳枝不住手攪青煙微出為度要滴在水上不散方成膏卻出火攪令溫再入乳香沒藥各五錢桂心末三錢略上火再攪令勻卻以淨瓷器收貯用治灸瘡腫痛用薤白切一升豬脂切一升以苦酒浸經宿微火煎三上三下去滓敷之治諸瘡並漏疳瘡中冷水常流不止用胡粉炭白灰等分為末以臘月豬脂和塗大效又方用黑牛新屎乘熱封上立效治諸瘡不收口用血竭寒水石各二錢白丁香三錢黃柏一錢大糞燒灰存性五錢為末唾津調塗瘡口上治魚睛瘡遍身赤白頭出水發熱憎寒用硃砂蟾酥白麵各一錢研細末飯丸如蘿蔔子大放瘡口內治惡瘡發悶嘔逆霍亂用羅兒青甘草各一兩白礬二錢半為末每服一錢新汲水調下立止又方用綠豆粉三錢乳香沒藥各一錢研細井花水大糞水澄清調服治諸瘡癤癰腫表毒用牡蠣大黃梔子等分為末每服五錢水盞半煎一盞去滓涼服治風瘡用桔梗防風地榆薄荷荊芥為末每服五錢茶調下治諸般惡瘡追毒去死肉用白礬二兩黃丹一兩硇砂三錢為末銚內同炒去盡水為度每用量瘡貼上治瘡毒嘔吐噁心用干胭脂半錢綠豆粉三錢研勻新汲水調下只一服立止治一切瘡生肌用白芨白蘞黃柏黃連乳香麝香黃丹等分為末摻瘡上三二日生肌肉滿治一切惡瘡臁瘡並諸般疳瘡用輕粉半錢乳香沒藥飛白礬各一兩麝香半錢為細末量瘡干貼治惡瘡用雄雞屎陰乾燒灰存性為末香油調敷又方用燕窩內外泥糞俱研極細羅過以清油調搽治豌豆瘡用蕪菁根搗汁挑瘡破敷上三食頃根出治惡瘡瘑瘻用酸漿草搗敷之治瘡癤癰疽用小青葉搗碎貼之甚效治一切瘡腫及風丹遍身如棗子癢痛用雞腸草搗爛敷之治惡瘡疥癬風疹用青蒿煎湯洗能殺蟲治中暑熱面上生癤用山黃楊子搗爛貼之立瘥治魚臍瘡腫痛不可忍者先以針刺瘡上及四畔作孔用白萵苣取汁滴入孔中痛即止人不可多食令人昏目治諸瘡及金瘡用牛蒡葉貼之治惡瘡疥瘻用狗溺苔又名朝生暮落花日乾為末和生油調塗牛糞上黑菌尤佳治面上生瘡用曼陀羅曬乾為末少許貼患處治惡毒瘡癬用天仙蓮葉搗敷之治遍身熱毒瘡痛貼著衣被不得睡用菖蒲一斗銼日乾為末布席上令患人恣臥其間仍以被覆既不黏復得睡五七日可愈治惡瘡疥癬殺蟲用酸泔洗之治諸般惡瘡初發用苦竹頭節長一二寸刮去青皮似紙薄大小隨瘡斟酌用白蒺藜蒼朮烏桕皮厚朴各五錢水一銚用竹筒煎煮將干為度乘竹筒熱以手按於瘡上頃之筒自黏瘡上不必手按更用前藥分兩再煮一筒候前筒冷以手撥去換熱者如前法其膿自吸入竹筒而瘡即愈又方吸筒以慈竹為之削去青多用五倍子少用白礬煮筒收起用時再煮熱按於患處又方用吳茱萸一兩小蒜二兩共研敷之日三換以好為度治多年瘡口不幹用冬瓜葉焙為末貼之效治蛇頭瘡用生黑豆為末卻將大梔子殼一個入末於內籠縛在指頭上即愈治一切惡瘡痛腫用豬膽生薑汁好黑墨濃磨以雞翎頻掃即愈臁瘡治臁瘡用降真香火燒過存性五倍子焙過各一兩麝香少許焙為末瘡以漿水洗淨干敷藥末以帛裹之治臁瘡並腳腿血風瘡用老松香如琥珀色者瓷器內熬過令為末以清油或臘豬脂調成膏用青蒻葉一片隨瘡大小以針於光面上密刺眼將膏塗在粗麵上油紙裹之先用飛鹽蔥椒煎湯洗瘡淨卻將蒻光面貼瘡絹帛縛定至五七日再洗換藥貼忌油面穢物甚驗又方用臘月豬膽汁搗生薑敷貼即愈又方用豬膽同黃蠟成膏先以茶清洗瘡淨卻用厚紙攤藥貼之又方用血竭為末敷瘡以干為度又方用黃丹無名異為末清油調搽濕則干敷又方用茱萸焙乾為末先以豬膽搽瘡後用末摻上四五日見效治臁瘡並腳上瘡痛癢流黃水用大黃黃連黃柏各半兩輕粉飛白礬各半錢淡豆豉灶心土各二兩為末以花椒熬油調敷瘡上用油紙包定甚效治臁瘡久不愈用老松香樟腦黃丹炒舊船石灰輕粉或再加白芷川芎螵蛸為末熔化松香加少清油和之以油紙隨瘡大小糊袋盛藥先用水洗瘡淨縛在瘡口上三四日一換一方單用白芷川芎螵蛸三味煎湯洗亦效治臁瘡久不愈者用川烏黃柏等分為末以唾津調塗紙上貼之治外臁腳瘡用累經燒過窯灶黃土研極爛入黃柏赤石脂黃丹輕粉拌勻以清油調稀用油絹盛藥敷瘡上卻以布絹縛定縱癢不可以手開動直候十數日後瘡愈卻去之治臁瘡用黃柏末輕粉以豬膽調成膏攤蠟紙上貼瘡緊扎住十日再換又方用牛蹄甲油浸燒灰為末油調敷又方用齏汁洗淨挹干細刮虎骨敷上又方用乳香沒藥赤石脂黃丹各二錢半石膏一兩為細末生桐油調攤紅絹上復以絹夾之貼瘡極效又方用東南桃枝白皮於火上炙脆為末乾摻或油調搽治臁瘡並風瘡用杉木燒灰存性為末五倍子瓦上焙乾為末先以茶清洗瘡後用荊津水洗以無漿帛拭乾貼藥又方用桃柳槐橘桑枝各一捻煎湯洗瘡又用米泔洗過挹干後以淨黃熔開捻成薄餅子如瘡口大七片每三日換一片至七片瘡必愈治臁瘡用槐椿桃楝柳條荊芥煎湯無時沃洗以無漿帛挹干用生黃蠟於紙上量瘡大小攤成十個都拴瘡上三日一次洗瘡除去著瘡蠟紙膏一個不用不候一月無問年深日近必然痊可用之累驗又方用好粉以香油調在碗里以艾燒煙燻黃色抹在瘡上有效又方用輕粉一錢黃連末二錢以豬膽一個針刺七孔滴下汁在盞內調成稠糊用竹攤滿瘡口上以紙數層蓋藥用無襁青絹緊緊拴住過十日再換疳瘡治下疳瘡用燈心灰入輕粉麝香少許干貼立效又方用飛白礬輕粉麝香為末先以口含漿水洗淨挹干貼瘡日上三兩次治疳瘡用蠶退燒灰三錢輕粉乳香各少許為末先以溫漿水洗淨乾摻之治疳瘡久不愈者用海浮石燒紅醋淬數次二兩金銀花一兩為末每服二錢半日二服瘡在上食後服在下食前服愈為度治下疳瘡用黃連黃柏等分以豬膽兩個拌浸卻用瓦或磚於火上燒紅放藥在上焙乾加乳香沒藥朴硝枯白礬無名異百藥煎血竭苦參共為末以清油調搽濕則乾摻又方用密陀僧黃連黃柏輕粉為末摻之以鹽艾煎湯沃洗治下疳腫不消用防風荊芥甘草節牛膝等分煎湯熏洗即消又方用益元散加防風荊芥何首烏煎湯溫洗之治疰疳瘡用輕粉韶粉和勻摻之治疳瘡用爐甘石火煅醋淬為末油調塗加孩兒茶尤好又方用生銀杏擂爛搽之又方用橄欖燒灰為末油調搽又方用黃柏以雞子清和炒三五次為末油調搽濕則乾摻漆瘡治漆瘡用蟹汁塗之即愈又方用芒硝濃煎湯沃洗又方用白礬煎湯浸洗又方用杉木煎湯洗效又方用莽草葉煎湯洗又方用無名異末水調敷又方用羊乳敷之愈亦治蜘蛛瘡飲之尤妙治漆瘡凍瘡犬咬瘡並用秫米嚼爛塗敷治漆瘡久不瘥用漆草搗爛敷之患處立效疥癬治疥初成或始痛時用薑黃敷之治瘡癬初生或痛時用鹽口嚼塗之治瘡癬用蛇床子末和豬脂塗之治癬瘡用蘆薈一兩甘草炙半兩為末先以溫漿水洗淨帛拭乾敷之立瘥治疥癬滿身作瘡用何首烏艾等分水濃煎浸洗甚能解痛生肌肉治生癬疥用藜蘆為末生油和敷又方用松膠研細入少輕粉先用油塗疥敷末一日夜干頑者兩度治癬瘡並一切蟲腫毒用羊蹄根醋磨塗速效治疥瘡用巴豆十粒火炮黃去皮膜右順手研如面入酥與膩粉少許同研勻抓疥破以竹篦子點藥不得落眼內及外腎上如熏灸著外腎以黃丹塗甚妙治癬濕癢用楮葉半斤爛搗封癬上治乾癬積年生痂搔之黃水出每逢陰雨即癢用斑蝥半兩微炒為末蜜調敷之又方用狼毒為末敷之治濕癬用蕪荑為末和白蜜塗治疥瘡用苦楝根醋磨塗又方用薤葉煮湯洗或搗如泥敷之治濕癬白禿及杖瘡用馬齒莧熬塗甚效治頑麻風癬瘡用臘月牛膽一個內千年石灰懸掛陰乾以銅燈盞盛柏油煎臭椿皮數沸撈去椿皮用油調膽內石灰塗患處數次即愈先以茵陳煎湯洗瘡淨搽藥治疥瘡用石灰鍋內炒極透出火毒香油調敷治癬瘡用樟樹皮為末醋調敷之又方用山豆根為末臘月豬脂調塗之治遍身疥癬瘙癢或致肌肉頑麻並紫癜白癜風並皆治之用荊芥穗蔓荊子威靈仙何首烏防風甘草等分為末每服二錢食後溫酒調服治瘡癬瘙癢不常用蛇床子半兩黃連三分胡粉一兩結砂子水銀一分同胡粉點水研黑盡為末以清油調稀先以鹽漿水洗瘡淨後塗藥干即換不過三五度瘥治積年疥癩不愈者用水銀三錢茶末水許於瓷器內以唾津擦化為末輕粉三合狼毒一兩沉水者一半炒為末一半生用以清油出藥面一寸高浸三日候藥沉油清只點清油塗瘡上仍以口鼻於藥盞上吸入藥氣治疥瘡用白礬為末豬脂調敷甚驗並治惡瘡諸瘻治疥癩牛皮癬瘡用陸英葉陰乾為末小油調塗大效治風疳癬疥或癢或痛經年不效並一切惡瘡用巴豆三錢去皮當歸半兩輕粉一錢先以清油半斤慢火熬沸下巴豆當歸熬至焦黑不用卻下黃蠟三錢熔開次下輕粉攪勻冷定瓷盒內盛之每用量瘡搽抹治疥瘡用黃柏蛇床子白礬等分為細末先用黃柏花椒厚朴枳殼各少許巴豆數粒蔥三莖置清油二兩內熬數沸濾去渣將前藥末於熱油內放冷調搽治頑癬久不可者用梗樹皮四兩剪草白芨各二兩巴豆七粒連殼碾為細末新汲水調如糊厚敷癬上干去之再敷立效不須抓破治疥癬無時疼癢愈發有時不問新久者用吳茱萸牛蒡子荊芥各等分牡蠣半兩輕粉半錢信砒二錢為細末研勻每臨臥抄一錢油調遍身搓摩上一半如後有癢不止更以少許塗之股髀之間聞香悉愈治諸風疥癬及癩用浮萍一兩荊芥川芎甘草麻黃各半兩為粗末每服一兩水一碗入蔥白豆豉煎至半碗無時服汗出為度治癬雜瘡用白膠香黃柏輕粉為細末羊骨髓調塗癬上治肺風流溢皮膚作疥癬瘙癢多膿水似癩瘡用五倍子生為末搗丸如綠豆大每服七丸食後茶酒任下日進三服大妙治癬瘡用草烏磨塗大驗治諸般疥癩瘡用馬兜鈴子一兩半白礬二錢半硫黃三錢為末以清油調勻塗手上搓熱呵之以鼻臭吸其氣瘡自安治風瘙遍身癢用莎草一握煎湯浴之立效治遍身風癢瘡疥用茵陳煮濃汁洗立瘥治風瘙瘡疥遍身用荊芥濃煎湯洗或坐浸湯中丹疹治大小丹赤遊風腫用景天即慎火草搗汁或乾末和苦酒敷之治丹癮疹用白芷根葉煮汁洗之瘥治大小風疹不止用白礬研細投熱酒中化勻以馬尾塗之治丹癮疹用酪和鹽煮熱以摩之手下即消治火丹遍身赤腫用蘿摩草搗汁敷之或就搗敷應手即消治大小赤遊風用芒硝煎汁拭丹上治火丹用藍靛敷之即消治熱丹赤腫用栝蔞末釅醋調塗之治五色丹名油腫不可輕忽用榆白皮末和雞子清敷之治丹發疼痛用萹蓄搗汁服一升未瘥再服效治風癮疹癢毒用楓皮或脂煎湯熱洗治火丹用有刺慄皮煎湯洗治風疹入腹身體強舌乾燥用蔓菁子二兩為末每服溫酒調一錢匕下治天行癍瘡須臾遍身皆帶白漿此惡毒氣用葵菜葉煮熟以蒜齏啖之則止治風癍癮疹用牛膝不拘多少酒浸一宿焙乾為末每服二錢溫酒調下治瘡疹入腹用蠶砂濃煎湯洗避風治火遊腫流遍身赤色入腹即死用生豬肉貼赤處其肉臭惡蟲鳥不食治火丹赤腫用黃芩為末水調塗立止治五色丹毒遍身散行用乾薑末蜜調塗立愈又方用甑帶燒灰為末以雞子白水和塗之即效治丹毒流腫用蚯蚓糞為末水和敷之日三次治癮疹用伏龍肝三五錢置碗內傾熱酒一盞漬少時休取蓋盞便吸飲酒立愈治時疾發豌豆瘡及赤瘡子未透心煩狂躁氣喘妄語或見鬼神用龍眼一錢細研旋滴豬心血和丸如雞頭大每服一丸紫草湯下心神便定得腫瘡復發透依常將息治人並六畜天行時氣豌豆瘡用黍瓤濃煮汁先之瘥瘡黑者杵蒜封之亦可以蕓薹煮湯洗治一切疹用枳殼水煮為煎塗之干又塗治風疹用枳實醋漬炙熱熨上即消治風疹癢不止用枳殼三兩麩炒黃去瓤為末每服二錢水一盞煎六分去滓不拘時服治風瘙癮疹遍身癢成瘡用蠶砂苦參濃煎湯去滓熱洗避風又方用白殭蠶焙黃為末每服酒調一錢匕服立瘥治風疹遍身不瘥用煅過雲母粉清水調服治風熱遍身癮疹用牛蒡子浮萍等分為末每服二錢薄荷湯調下治纏蛇丹用灶心土乾研清油調塗又方用糯米粉和鹽同嚼唾患處又方用鏽鐵釘磨水搽治癮疹風毒腳腫並用大戟煮水熱淋日再三日愈癭瘤治頸下卒結囊欲成癭用海藻一斤酒二升漬數日稍稍飲之又治頷下瘰癧治癭氣用海藻昆布等分為末蜜丸如杏核大含咽津或作散綿裹一線醋浸含之治骨石肉膿血五等癭瘤二三年不瘥大如杯盞或破潰漏膿水令人骨消肉盡或硬或軟寐臥驚悸體中掣縮愈而復發用烏魚骨硫黃琥珀紫石英鐘乳石各一錢白石脂丹參各三錢乾薑附子大黃芒硝各一兩為細末以竹筒盛勿泄氣如瘡濕摻藥三四度乾者以豬脂和敷此藥止痛除惡肉大效治癭瘤結硬用通草二兩杏仁去皮尖牛蒡子出油各一合吳射干昆布訶黎勒海藻各四兩為末煉蜜丸如彈子大含化咽津日三服治生瘤子用砒霜硇砂黃丹雄黃粉霜輕粉硃砂沒藥各一錢乳香三錢斑蝥生用二十個同研為末糯米粥丸如棋子樣爆干先灸破瘤頂三炷為則以藥餅蓋上用黃柏末水調貼之數日自然枯乾落下又方用銅綠為末草刺破瘤摻在上膏藥封貼之治頭面生瘤贅用蛛絲纏勒瘤根三五日自然退落有驗七夕纏尤效治石氣筋血肉五般癭證用海藻洗昆布洗礬石枯龍膽海蛤通草貝母松蘿各一兩麥曲半夏湯浸洗七次各一兩三錢為末每服二錢酒調臨臥徐徐嚥下忌鯽魚雞肉五辛生果油膩物治皮膚項面上生瘡瘤大者如拳小者如慄或軟或硬不疼不痛不好輒用針灸用生南星大者一枚研爛入好醋五七滴為膏如無生者以乾者為末醋調如膏先將小針刺痛處令氣透卻以藥攤紙上象瘤大小貼之覺癢則頻貼取效治瘤贅用黃丹信硇砂各二錢乳香半錢研細滴水為丸如米大先用針刺破瘤根內藥一粒以紙丸塞住紙花封之久而自落忌食雜物治項癭用海藻海帶海螵蛸海蛤昆布各二錢縮砂連翹玄參甘草炙各三錢香附子半兩共為末每服一錢飛鹽湯一盞調臨睡徐徐嚥下或以鹽梅肉搗和丸如杏核大每服一丸噙化海藻甘草雖相反惟此劑宜用極效又方用豬肺管上團肉一塊將新瓦焙乾臨臥細嚼以酒嚥下極效治藨子用地膚子白礬等分為末煎湯洗數次即盡去治癭氣用海藻三兩海螵蛸二兩海帶兩半大腹子去皮芒硝柳根各一兩珍珠三錢煉蜜丸如杏核大臨臥噙化一丸金瘡治金瘡血不止用小薊葉挼爛封之又方用白薇末貼之立止又方用桑柴灰敷亦止痛又方用白芍藥一兩熬黃為末酒調二錢服或米飲調亦止痛又方用紫檀刮取細末敷之又方用石灰一升石榴花半斤搗末取少許敷上擦少時血斷便瘥又方用血竭末敷之血與疼痛立止治金瘡刃不出止血止痛用甑帶燒灰封敷治金瘡腸出隨即推入用桑皮作線縫住以熱雞血塗上又方用磁石滑石等分為末以白米飲調方寸匕日再服治金瘡血流用桑皮中白汁塗傷處須臾血止治金瘡血內漏用雄黃如大豆內瘡中血皆化為水治金瘡用檳榔黃連少許為末敷之即瘥又方用青蒿搗爛敷止血定痛生肌甚良又方用白芨為末塗之治金瘡刀斧傷用石灰包裹定痛止血立瘥治金瘡用五月五日採露草一百種陰乾燒作灰與石灰等分以井花水和丸燒白刮敷瘡上止血生肌又方用葵葉燒灰或干葉為末皆可敷又方用琥珀屑敷之止血生肌瘡口即合又方用蟹黃及足中肉熬末內瘡中筋斷亦可續又方用晚蠶蛾為末摻勻絹裹止血生肌隨手瘡合治金瘡破腹腸突出用幹人屎抹腸即自入治刀瘡用大黃石灰等分為末敷上即效或炒為粉紅色敷治金瘡用黃柏四兩去粗皮黃連去須黃葵花焙乾烏賊魚骨黃丹飛過各三兩降真末檳榔龍骨密陀僧血竭韶粉各一兩白芍藥木鱉子各半兩乳香各二錢研極細和勻厚紙包裹勿令透氣候三日方可用凡遇金刃所傷血不止者作急用藥干貼血痛立止或所傷日久用蔥鹽湯洗去惡物挹干以唾津調貼用紙封蓋瘡口留一竅出膿水及被傷血流太多恐傷斷脈絡血筒急揩去血用藥干貼之立止治金石刀刃並一切打撲傷損血出不止用烏魚骨一兩石灰四兩青薊草萵苣菜各一握約一虎口以五月五日未出本人不語將三味同搗爛次下骨灰杵勻搏作餅子曬乾用時旋刮敷之立效此藥敷上無膿退痂便愈又方用黃丹白礬等分為末貼之又方用蔥炒熱搗爛乘熱包縛痛與血隨止蔥冷再換又方用鍋底黑煅研敷之又方用無名異末搽又方用白芨石膏煅共為末摻上亦可收口治刀傷出血用野葛葉挼敷甚效又方用五月五日午時取青蒿和石灰搗捻作餅子收藏凡金刃所傷者刮末敷之治刀箭傷用端午日午時採苧麻葉曬乾為末貼損處大效折傷治一切破傷多用燈心草爛嚼和唾貼之以帛裹定血立止又方用自然銅研極細水飛過同當歸沒藥末各半錢酒調頻服仍以手摩痛處治跌骨碎破用生地黃搗爛熨熱裹三日夜數易若血聚以針決之治續斷筋用旋花根洗淨搗量瘡大小敷之日易一二次乃瘥治閃折筋骨傷損用骨碎補為末煮黃米粥和之裹傷處治墜跌傷損瘀血在腹刺痛用敗蒲席以蒲黃芍藥當歸大黃朴硝煎服血當下治下一切惡血用琥珀大黃鱉甲為末每服方寸匕酒調服治從高墜下或重物壓損瘀血用琥珀刮屑方寸匕酒調服及取蒲黃二三匕服日四五度治一切折傷筋骨瘀痛用沒藥研爛熱酒調服破症消腫推陳置新治墜落車馬折傷筋骨疼痛用延胡索為末豆淋酒調二錢服治被毆傷瘀血聚腹滿用豉一升水三升煮三沸分服不瘥再服治從高墜下頭破腦出中風口噤用大豆一升熬去腥勿使太熟杵末蒸之氣遍令甑下盆中以酒一升淋之溫服覆取汗敷膏瘡上心痛筋攣膝痛脹滿並和甘草煮服治馬墜撲損用稻杆燒灰以新熟酒未壓者連糟入鹽和合淋前灰汁以淋痛處立瘥治壓撲損傷用胡桃肉杵和酒溫服便瘥治傷損瘀血用飴糖熬焦和酒服之能下惡血治折傷用麥麩和醋蒸包傷處治墜馬積血心腹唾血無數用乾荷花並干藕為末酒調方寸匕日三服治從高墜下及打擊內傷用麝香水蛭各一兩銼碎炒煙出為末酒調一錢當下蓄血未止再服其效如神治被打腹中瘀血用白馬蹄燒灰為末酒服方寸匕日三夜一亦治婦人血病凡食馬肉忌生薑蒼耳孕婦忌食馬驢騾肉治撲打墜損惡血攻心悶亂疼痛用荷葉五斤燒令煙盡為末食前以熱童便一盞調三錢匕日三服治磕撲損傷肌膚青腫用茄種通黃極大者切片如指厚新瓦上焙乾為末臨臥酒調二錢匕服一夜消盡無痕跡也治打撲傷損刀斧傷用夏枯草口嚼爛盦上即愈治負重擔肩破用剪貓兒頭上毛以不語唾黏貼破處治骨頭打碎用破草鞋燒灰為末油調塗貼治攧撲重傷者用生薑汁四兩香油四兩順攪勻以無灰酒熱調下又方用松節煎酒服治閃肭用米醋糟平胃散相和罨之治骨損用醋搗肥皂極爛厚盦之以帛束住治打撲刀斧傷損用帶須蔥燒熟熱搗爛盦上冷則換治一切破傷血不止者用白麵盦之立止治磕撲損傷接骨即將折處湊上綁定用雄雞一隻取血以好酒一碗旋熱就刺血在內攪勻飲之即愈又方用土龜一個研細以好酒半碗調服隨覺遍身拘急即愈傷輕者止可用半個又方用綠豆粉半升人發蔥白各二兩同炒九次用自然銅半兩醋淬五七次共研為末以骷髏醋調成膏貼之又方用蠶砂一小碗入小麥數粒同炒黃為度綠豆粉一大匙炒綠色飛白礬二兩輕粉少許共研勻於銅器內以好醋溫熱調成膏攤於四五層紙上裹損處三日一換三次即止兼治風濕痹及杖瘡又方用少婦發一團包指頭大乳香一塊在內以麻纏五七層如雞子大於烈火內燒灰存性為末每服一字酒調下又方用狗頭一個燒灰存性為末熱釅醋調成膏敷傷處以帛重裹於暖處臥治傷肢折臂斷筋損骨但有皮相連者用生地黃研汁好酒和服一月筋皮連續並杵碎炒熱封損處無比應效治刀斧斷筋用金錢子花葉莖根去土淨搗取自然汁滴瘡口中以滓封瘡上不過半月斷筋即續大效治打撲損傷筋骨瘀血在內疼痛用鼠糞燒過為末以臘豬脂調敷封裹其痛即止治打撲肭損痛不可忍用乳香二錢另研烏梅五個去核焙為末白萵苣子二兩八錢炒黃為末白米一捻細研再共研勻煉蜜丸如栗子大細嚼熱湯送下病在上食後在下食前治骨折用乳香末摻極痛處以小黃米粥塗上卻用五靈脂一兩茴香一錢共為末厚摻以帛裹定用木片夾之少壯人二日效老者五六日效又方用半兩銅線醋蘸燒為末木香自然銅各一錢麝香少許為極細末每服三錍頭嚼丁香一枚乳香一粒無灰酒一盞在上食後在下食前服如不折其藥反出服罷痛甚勿疑待一日如骨未接再服老者十餘日少者五七日愈又方用澱粉當歸各一錢硼砂錢半為末每服一錢煎蘇木湯調下服後仍頻飲蘇木湯此藥能接骨續筋止痛活血又方用接骨木半兩乳香半錢芍藥當歸川芎自然銅各一兩為末以黃蠟四兩熔開投藥末攪勻候溫眾手丸如龍眼大瘀血傷損疼痛好酒一盞浸化一丸熱服若碎折筋骨先用此藥敷貼然後服之又方用夜合樹皮去粗四兩炒黑色即合歡花樹芥菜子一兩炒為末酒調二錢澄清臨臥服之以滓罨瘡上扎縛定又方用蔥白砂糖等分爛研敷之痛立止仍無瘢痕又方用綠豆粉新鐵銚內炒紫色以新汲水調稀厚敷損處貼以紙將杉片夾定立效又方用柏葉荷葉皂角俱生用骨碎補去毛等分為末於折傷處揣定令入原位以薑汁調藥如糊攤紙上貼骨斷處用杉木片夾定以繩縛之莫令搖動三五日後開看以溫蔥湯洗之後再貼藥復夾七日如痛甚加沒藥治一切打撲並金刀傷損身體血出用硫黃明淨者四兩花蕊石一兩俱為粗末拌勻先用紙筋和鹽泥固濟瓦罐一個候泥干入藥於內再用泥封口候乾安在四方磚石上書八卦五行字用炭一秤籠疊周匝自巳午時從下著火漸令上徹直至經宿火冷又放經宿罐冷取出細研羅過瓷盒盛貯但有損傷血出急摻此藥血自化為黃水如內損血入臟腑熱煎童便入酒少許調一錢服立效若牛觝腸出不損者急送入用細絲桑白皮尖茸為線縫合肚皮縫上摻藥血止立活如無桑白皮用生麻縷亦得並不得封裹瘡口恐作膿血如瘡干以津液潤之然後摻藥婦人產後敗血不盡惡血奔心胎死腹中胎衣不下並用童便調服治從高墜下及木石所壓一切傷損血瘀痛用大黃一兩酒蒸杏仁三七粒去皮尖研細酒一碗煎六分去滓雞鳴時服至曉取下瘀血若傷重便覺氣絕不能言取藥不及急掰開口熱小便灌之又方用大黃黑牽牛赤芍藥當歸等分為末每服二三錢熱酒調下約行六七里再用熱酒調牽牛末二錢催之須下惡血成塊若傷重大小便不通者尤宜服此又方用破故紙炒茴香辣桂等分為末每服二錢熱酒調下又方用胡猻姜研爛取汁酒煎服滓敷傷處又方用南星白芷半夏白芨黃柏赤小豆等分為末薑汁調敷患處蜜調亦好又方用澤蘭炒附子炮去皮各一分當歸炒蜀椒炒甘草炙桂心各三分川芎炒六分為末每服二錢溫調下日三服忌生蔥豬肉冷水菘菜立效治打撲傷損敗血流入胃脘嘔黑血如豆汁用當歸白芍藥芎藭百合水浸半日荊芥穗等分每服四錢水一盞酒半盞煎七分服治針灸傷經絡膿血不止用黃耆四兩當歸半兩肉桂去粗木香乳香別研沉香各半兩為末用綠豆粉二兩薑汁煮糊丸如桐子大每服五十丸熱水送下不拘時治傷折閃肭用杜牛膝搗罨甚效孕婦勿服破血墮胎治打撲傷損及閃肭骨節用接骨草葉搗爛罨患處五效治閃抅手足疼痛用生薑蔥白爛搗和麵炒熱盦之治傷重者用生蔥荊芥土當歸煎湯溫熱淋洗治傷損筋骨碎斷即煎蔥淋洗拔伸整頓令骨相續平正卻用生薑汁或生地黃汁和水調攤熟帛或厚紙上貼之次以木皮約如指大片疏排周匝以小繩緊縛三日如前淋洗換藥貼裹候骨生牢方可去夾又方用穿山甲炒黃丁香皮各三兩土當歸一兩枇杷葉根百草霜各半兩焙碾為末以薑汁或地黃汁調貼傷處治傷重腸內有瘀血用白芍藥熟地黃川芎當歸等分每服三錢水盞半煎七分空心熱服又方用當歸大黃等分三錢水煎去滓空心熱服治筋斷骨碎痛不可忍用硼砂一錢半水粉當歸各一錢為末每服二錢煎蘇木湯調服仍時時飲蘇木湯立效亦治飛禽走獸骨折凡腦骨傷碎輕手撙平用藥敷貼絹片包裹不可見風著水恐成破傷風在發內損者須剪去發敷之若傷碎太陽穴則不可治凡肩甲骨出用椅當圈住脅仍以軟衣被盛襯使人挺定兩人拔伸卻墜下手腕又令曲著手腕絹片縛之凡金井骨在脅之下有損不可夾縛只是捺平令安貼用藥敷之兩脅骨亦然凡跨骨從臀上出者可用三兩人挺定腿拔伸用腳捺入如跨骨從襠出則不可整凡手骨出者若向左出則向右邊拔入向右出則向左拔入凡手腳骨皆有兩脛若一脛斷則可治兩脛俱斷則不治凡損傷重者大概要拔伸捺正或取開捺正然後敷貼填塗夾縛拔伸務要相近本骨損處不可挫去別骨節上凡捺正要時時轉動使活凡傷重必用藥水泡洗然後塗藥凡夾縛夏三兩日冬四五日解開用熟藥水泡洗去舊藥切不可驚動損處仍敷藥夾縛凡損一月尚可整理久則不可
