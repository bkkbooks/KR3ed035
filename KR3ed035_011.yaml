如桑椹子色為度同為末五靈脂四兩別研和勻酒浸蒸餅丸如桐子大每服十丸空心溫酒或鹽湯送下日二服大效治産後中風腰脅不得轉動用生地黃生薑各五兩另研取汁交互以汁浸滓一宿次日漬盡汁各炒黃為末每服二三錢酒調下乳汁少治乳無汁用鬼箭五兩水六升煮四升一服八合日三服大效治乳令汁多燒野豬膏每用一匙和酒一盞日三服十日後可供三四孩兒飲治乳汁少用栝蔞為末每服方寸匕酒調或米飲調日二服即流溢又方用土瓜為末酒調一錢日三服又方用精豬肉或豬蹄煮清汁和美味調益元散五七錢食後連服三五服更用木梳梳乳周回乳汁自下又方用三稜三個水二碗煎一碗洗奶取汁極效又方用葵子煎湯飲兼治五淋但滑腸動風惟宜服丹石人又方用萵苣三五根濃煎湯飲又方用穿山甲五錢為末米泔水調服又方用狐貍脂炙熟溫酒研服又方用栝蔞子洗淨炒熟為末每服半匙服訖睡少頃便有乳又方用栝蔞根燒灰為末每服二錢匕米飲調下又方用鐘乳石為末每服一錢酒調下又方用白藥子為末每服一錢煎豬蹄湯調下又方用漏蘆為末每服一錢溫酒調下又方用白殭蠶為末每服二錢酒一盞芝麻茶少許同調熱服仍用木梳於奶上梳十遍乳汁自足又方用赤小豆煮汁頓飲乳如泉流治氣脈壅塞乳汁不行用漏蘆半兩蛇蛻炙三條栝蔞三個急火燒存性為末每服二錢溫酒調下仍吃熱羹助之治氣少力弱無乳汁用豬蹄一隻通草五兩水一斗煮取汁五升飲之又方針肩井二穴亦效吹乳治吹乳用芭蕉葉搗爛敷貼又方用白丁香半兩為末每服一錢匕溫酒調下又方用穿山甲炙黃木通各一兩自然銅半兩生用共為末每服二錢溫酒調下又方用男子梳上百齒霜飯丸如桐子大酒下三丸又方用皂角燒灰為末蛤粉等分酒調一錢服又方用樺皮燒灰存性為末熱酒調下二錢食後服又方用蠶蛻燒灰五錢輕粉三錢麝香少許為末每服二錢熱酒調下又方用淘米木勺上沙子七粒酒吞下以吹帚杖透乳孔又方用鼠糞五十粒麝香一字為末食後熱酒一盞調服立愈又方用頭垢丸如桐子大五丸以無根水下治吹乳憎寒壯熱用豬肪脂冷水浸拓熱即易又方用葛蔓燒灰為末每服二錢匕熱酒調下不過三服愈又方用女人口吮之吮時先口中含暖水旋吐數吮即瘥治妒乳硬欲結膿令消用鹿角於石上磨白汁塗干又塗不得手近以人嗍去黃水即愈治男子妒乳腫用蕪菁根生搗和鹽醋漿水煮汁洗之五六度瘥又搗和雞子白封之亦妙治妒乳及癰用葵莖及子為末酒服方寸匕愈治乳腫不消用赤小豆莽草等分為末苦酒和敷之治乳結硬癰用鯶魚皮燒灰空心暖酒服二錢匕治乳癰汁不出內結膿腫用蜂房燒灰每服二錢水一盞煎六分去滓溫服治乳癰如石硬先治軟用蛇蛻皮一尺燒灰為末溫酒調下即軟次用車脂和蛤粉丸如豌豆大每服一丸溫酒送下立愈治乳癰用蛇蛻燒灰一錢甘草炙半錢為末溫酒調下又方用五月五日粽箬燒灰酒調服即散又方用馬鞭草一握生薑一塊酒一碗擂絞汁服滓敷患處治乳瘡腫痛用芝麻一合炒焦研細以燈盞油調塗産後及雜證治産後發渴用煉蜜以熟水溫調服治産後口乾舌縮用雞子一個傾入一盞滾水內攪勻蓋少時服治産後虛勞發熱骨節疼痛汗出不止用豬腰子一隻去膜切細鹽酒拌勻先用粳米一合入蔥椒煮粥鹽醋調和將腰子鋪碗底以熱粥蓋子如作盦生狀空心服治産後虛羸盜汗惡寒用茱萸一合酒三升漬半日煮服治産後心悶目不開用赤小豆生杵末東流水服方寸匕未瘥再服治産後不能食煩滿用赤小豆三七枚燒灰存性為末冷水調服治産後祕結膨脹不通氣急坐臥不安用麥芽末一合酒調服良久即通神效治産後咳逆氣亂心煩用乾柿一個切細水煮呷服治産後腹痛用羌活二兩酒二升煎一升作二服治産後血痢用生薑切細以面拌捏成球子慢火炒焦黃為末每服三錢空心米飲調下治産後血痢小便不通臍腹絞痛用生馬齒菜杵汁三合煎一沸下蜜一合攪服治産後諸痢用薤白和肥羊肉去脂作炙食或以羊腰脂炒薤白食又方用蒼耳葉搗汁溫服半盞日三四服治産後惡露上潮痞結大小便不通用芒硝蒲黃細墨等分為末童便水各半盞調三錢服治産後虛弱和血通經用當歸一兩芍藥香附子炒各二兩為末每服二錢米飲調下治産後心腹絞痛欲絶者用蒲黃炒五靈脂酒研淘去沙土等分為末先以好醋調二錢熬成膏入水一盞煎七分熱服治産後心氣痛用雞子一個熱酒一盅打勻服治産後喉乾咳嗽用豬脂胡粉煅過為末白湯調漱咽治産後腹中如錐刺痛用敗醬草五兩水四升酒二升煮取二升每服七合食前日三服大驗又方用羌活為末每服三錢酒煎服治婦人小腹痛面青或黃或赤或黑不能喘息用苦參一兩為末醋一盞半煮八分作二服又方用禹餘糧為末每服二錢匕米飲調下日二三服極效治婦人兒枕疼用陳蟹殼燒灰為末酒調服治産多不絶用肉桂紅花麝香各半兩為末以天落水和丸如緑豆大每服五六十丸牛膝煎湯空心服治婦人五心煩熱用赤芍藥水仙荷葉等分為末每服二錢白滾湯調下治陰生瘡用鯽魚膽搽治陰中蟲疽用杏仁燒煙盡研如泥綿裹納之治婦女肺熱久嗽身如火炙肌瘦成勞用枇杷葉木通款冬花紫菀杏仁桑白皮等分大黃減半各如常制同為末蜜丸如櫻桃大食後夜臥各含化一丸終一劑即愈治婦女中風煩渴用紅花子五合微炒搗碎每服一匙水一盞煎七分徐徐呷服治婦人一切風攻頭目痛用天南星一個掘地坑子火燒令赤安於坑中以醋一盞傾入蓋之不令透氣候冷取出為末每服一字以酒調下重者半錢治婦人過忍小便致胞轉用滑石末蔥湯調二錢下治婦人小戶嫁痛用烏賊魚骨燒灰為末酒調方寸匕日三服治婦人內傷痛楚及暈並臍腹刺痛用沒藥研細溫酒調一錢服便止治婦人夢與鬼交用安息香硫黃合為丸燒熏丹穴永斷治婦人勞怯發熱吐紅四肢無力飲食少進用人參一兩當歸生地黃黃連黃柏各二兩為末煉蜜丸如桐子大硃砂為衣米湯下三四十丸日二服治婦人諸虛不足用當歸熟地黃各酒浸一宿焙乾白芍藥川芎等分每服七八錢水一盞煎八分溫服更隨證加減血氣不調加吳茱萸甘草胎動下血加熟艾阿膠補下元加乾薑甘草血崩淋瀝加炮附子赤石脂便血及帶下加荊芥地椒血氣滯腹內刺痛加肉桂産後傷風頭痛加石膏甘草血風癆加荊芥柴胡潮熱加前胡乾葛人參黃芩虛熱口乾加麥門冬黃芩嘔吐不止加藿香白朮人參産後虛憊血熱煩悶加生地黃産後腹脹加枳殼肉桂産後惡露腹痛不止加桃仁蘇木牛膝産後寒熱往來加柴胡麥門冬經血淋瀝不斷加炒乾蓮房血滯不通加紅花桃仁大便閉加大黃桃仁産後悶亂加茯神遠志虛而多汗加煅牡蠣桂枝妊娠心腹痛加竹茹如有敗血則用當歸近上節白芍藥熟地黃煎服治婦人室女血氣不調及胎前産後諸疾用香附子炒去毛半斤烏藥炒四兩甘草炙一兩為末以生薑四兩蔥白一握搗絞汁並好醋半碗共打糊丸如彈子大每服二三丸血氣不順心胸痞滿紫蘇湯化下翻胃嘔吐脾胃感冷以老薑一塊燒黑切五片鹽少許煎湯化下驚憂喜怒傷神心滿腫疼面浮石菖蒲湯化下血暈悶血刺痛血積血症良薑赤芍藥醋水各半盞煎湯化下腹痛腰腿疼茴香湯化下喘滿氣急面浮生薑紫蘇湯化下吐血喉中腥氣黃桑葉湯化下血澀大便祕結枳殼或青皮湯化下崩中帶下小便頻數炒吳茱萸湯化下經絡感熱血脈妄行生地黃湯下敗血沖胃咳逆生薑柿蒂湯化下妊娠傷食胸膈不快木香或縮砂湯化下妊娠臨月近上逼心名曰子懸亦用生薑紫蘇湯化下産後寒氣入腹臍下刺痛炒吳茱萸湯化下産後子腸脫下鯽魚頭煎湯化下
