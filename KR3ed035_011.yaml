body:
  text: 卷之十一婦人經候不調治血脈不調用苦益菜為末每服一二錢溫酒或艾醋湯調服治月水不利用醍醐葉絞汁和酒煎服一盞治經血不止用五靈脂末炒令煙盡每服二錢當歸二片酒一盞煎六分去滓熱服三五服大效治月水不通用厚朴三兩水三升煎一升為三服空心不過三四劑瘥又方用鼠糞燒灰為末每服一錢熱酒調下治月信不調用阿膠炒成珠為末酒調一錢服又方用香附子炒黃為末每服一錢醋少許陳米湯調下治經脈不通用巴豆去油如緑豆大三丸以烏金石末一錢調湯送下即通年小者丸如菜子大又方用皂角一枚去皮弦子巴豆一粒去殼杏仁二個去皮尖同搗細以津唾和作一團用新綿裹之留蒂納陰中二寸許少頃即通候黃紅水去盡取出治經候不調用香附子一斤分作四分以好酒米醋童便鹽水各浸一分俱七日焙乾為末醋糊丸如桐子大每服七十丸空心食前溫酒調下瘦人宜加澤蘭葉赤茯苓各二兩治婦人年四十九歲以後天癸當住每月仍行或過多不止用黃芩心二兩以米醋浸七日炙乾又浸又炙如此七次為末醋糊丸如桐子大每服七十丸空心溫酒送下日二服治經脈逆行血風攻腦頭目旋悶不省人事用喝起草嫩心即蒼耳陰乾為末不拘時酒調一大盞服其功最大服之多者連通腦門治月經欲來前後腹中痛用當歸米醋微炒延胡索紅花沒藥等分為末每服二錢溫酒調下治月經不來赤白帶下用枯白礬蛇床子等分為末醋糊丸如彈子大胭脂為衣綿裹納於陰中如熱極再換治血枯用川大黃為末醋熬成膏捻作小錢大餅子每服酒磨化一餅子治乾血勞用大麥芽炒小麥芽炒千里馬灰即左腳破草鞋各一兩為末每服三四錢酒調下治經血不行及癥瘕用乾漆炒牛膝各一兩為末生地黃汁一升同入砂鍋內熬成膏丸如桐子大每服一丸加至三五丸溫酒送下不拘時治月候積年不來或數月不通用龍胎瓦松景天各少許水二碗煎一碗去滓分作三服無時大效龍胎似乾魚有鱗或在山間水中出蜀中甚多治經水不調身黃用白礬半兩陳皮三錢為末以黃蠟半兩熔開和丸如桐子大每服三五十丸湯吞下治月候不幹用當歸一兩附子一個牡丹皮鹿茸地黃人參各三錢為末醋糊丸如桐子大每服五七十丸阿膠湯下治經候不調用人參草果白朮縮砂白茯苓紅棗肉煨過焙乾為末每服二三錢空心白湯調下又方用當歸川芎白芍藥熟地黃酒蒸焙等分每服四錢水一盞煎八分空心服崩中去血多者加膠艾煎服治經候不調血臟冷痛用當歸附子炮等分每服三錢水一盞煎八分空心溫服治營衛不調寒熱自汗腫滿用大豆炒去皮一兩半茯神一兩琥珀一錢為末每服一錢濃煎烏豆紫蘇湯調下治室女經候不調血氣相搏腹中刺痛用橘紅二兩延胡索去皮醋煮當歸酒浸炒各一兩為末酒糊丸如桐子大每服一百丸空心艾醋湯下治經候不調血氣刺痛腹肋脹滿頭暈噁心崩漏帶下便血症瘕用香附子一斤米醋浸一日瓦瓶中慢火煮醋盡薄切焙乾艾葉四兩當歸二兩為末醋糊丸如桐子大每服五十丸淡醋湯下治血癖用大黃三兩為末酒二升煮十沸頓服治少女血熱風毒皮膚生癮疹並行經脈用凌霄花為末每服二錢食前溫酒調下甚效即紫葳治血氣刺心痛不可忍用五靈脂蒲黃等分為末每服二錢醋一盞煎成膏再入水一盞煎至七分熱服立效治血氣腹腫用山豆根為末每服三錢空心熱酒調下治一切血病及産婦一切傷損用益母草竹刀切洗淨銀器內煉成膏瓦器盛之每服一大匙酒調下治血氣百病諸虛不足用當歸四兩地黃二兩為末蜜丸如桐子大每服二十丸食前米飲下治月水滯澀結成瘕塊肋脹欲死用馬鞭草根苗五斤銼細水五斗煎至一斗去滓別於淨器中熬成膏每服食前溫酒調半匙下治血氣逆煩悶心痛用水牛角燒存性為末每服方寸匕酒調下治月候傷過及崩中用小薊根搗取汁半升服之治無故尿血用龍骨為末每服方寸匕空心食前酒調日三服治月經太過用甜瓜仁為末去油水調服患腳氣人食甜瓜永不瘥多食發黃動冷氣令人虛治血氣攻心痛不可忍用蓼根細銼酒浸服之瘥治血氣逆心悶痛用生蒜搗汁服二盞即瘥治失血用紫蘇不拘多少大鍋內水煎將干濾去滓熬膏以赤小豆炒熟為末和丸如桐子大每服三五十丸酒下常服瘥治血氣脹滿用劉寄奴穗實為末每服三錢酒煎服不可過多能令人吐利此破血之仙藥治血氣血積血癖用藕節荷葉蒂等分為末每服二匕熱酒調或煎服無時日三大效又方用鱉甲琥珀大黃等分為末每服二錢匕酒調或煎服多下惡血血盡住服治血塊用蘩蔞即雞腸草以醋煮汁服之無時或以童便絞汁服亦妙或為末一升醋三升同熬稠丸如桐子大每服十丸空心溫酒送下日三服血塊自下治血氣風虛四肢不收或仰息不得用石膏二兩甘草一兩炙為末每服方寸匕溫酒下無時崩中治崩中連日不止用熱艾雞子大乾薑一錢水五盞煎至二盞半入炒阿膠末半兩消化溫分三服空腹食前一日服盡又方用槐耳燒灰為末每服方寸匕酒調服不問年月遠近皆治又方用白殭蠶衣魚等分為末井花水調服日三瘥又方用五靈脂為末十兩水五盞煎三盅去滓再煎為膏入神麯二兩丸如桐子大每服二十丸空心溫酒下治崩中血凝注用生胡麻一升搗爛入湯中絞汁半升服立瘥又方用貫衆炒為末每服三錢醋調服或煎服立止又方用蒲黃黑神散服立效又方用硃砂新瓦上炒香為末每服二錢白湯調下又方用童子發以瓦二片相合封兩頭火煉為末每服方寸匕酒調下又方用伏龍肝末五六錢米泔水半碗調服即止又方用蠶故紙一張剪碎炒焦槐子炒黃等分為末每服二錢酒調服立止又方用破故紙炒黃蒲黃炒千年石灰炒黃等分為末每服三錢空心熱酒調服立止纍驗又方用婦人油發半兩燒灰千針草灰半兩為末每服三錢火煅稱錘淬酒調服又方用蠶砂為末每服三錢熱酒調服又方用龍骨燒赤當歸各一兩香附子炒三錢棕毛灰半兩為末每服三四錢空心米飲調下忌油膩雞豬魚兔等物又方用干蓮蓬棕櫚皮及毛各燒灰半兩香附子三錢炒為末每服三四錢空心米飲調下又方用柏葉一握水煎服無時又方用石葦為末每服三錢酒調服治血崩血痢用黃柏黃連各四兩苦酒五升煎減半溫服無時大效又方用柏葉二兩芍藥一兩炒過同為末每服二錢匕水酒共一盞煎五分溫服無時又方用甑帶燒灰故蒲是也每服三錢匕溫酒調下無時治崩中蓋是陽乘陰則經水沸溢宜清之用黃芩為末每服三錢燒稱錘淬酒調下又方用綿子黃絹馬尾艾葉藕節蓮蓬油發赤松皮棕櫚蒲黃各燒灰等分為末醋煮糯米糊丸如桐子大每服一百丸米飲下又方用干蓮房燒灰存性為末每服二錢酒調下又方用綿子棕櫚頭髮共燒灰存性百草霜同研為末每服三錢空心酒調服又方用荊芥穗就燈頭上燒焦為末每服三錢童便調下又方用防風去蘆又炙為末酒煮糊清調下二錢空心日二服極驗治漏下血不絶用槐花燒灰為末每服二錢匕食前溫酒調服治血崩大便血及冷痢用牛角䚡燒灰存性為末每服二錢童便或醋調服治傷中崩絶用醍醐菜搗汁和酒煎沸服一合治血崩用蒲黃黃芩各一兩荷葉灰半兩為末每服三錢空心酒調下帶下治白帶下臍腹冷痛面黃虛困用白葵花一兩陰乾為末每服二錢匕空心溫酒調下如赤帶下用赤花治赤白帶下用益母草開花時採搗為末每服二錢食前溫酒調下又方用酸漿草陰乾為末每服三錢空心酒調下又方用白芍藥三兩乾薑半兩炒黃為末每服二錢空心米飲調下又方用地榆三兩米醋一升煮十餘沸去滓食前熱服一合又方用雲母粉溫水調服三方寸匕立見神效又方用酸石榴五枚連殼舂絞取汁每服五合服汁盡即斷治斷赤下用韭白黃柏濃煮汁飲治赤白帶下用狗頭骨燒灰為末每服二錢匕空心食前溫酒調下日二服治漏下五色羸瘦者用鱉甲燒黃為末酒調方寸匕日二服治赤白帶下用舊蓮房為末麝香少許空心米飲調下又方用赤石脂煅海螵蛸側柏葉等分為末每服二錢米泔調下日三服極效治室女虛寒帶下純白用鹿茸酒蒸焙二兩白蘞金毛狗脊燎去毛各一兩為末以艾煎醋打糯米糊丸如桐子大每服五十丸空心溫酒送下治白帶下用白馬蹄燒透為末每服三錢溫酒調下若赤帶下用赤馬蹄燒灰服治赤帶下用蒲黃滑石為末每服三錢水調下治赤白帶下用野人肝銼碎炒煙出為末每服三錢空心溫酒調下又方用兔皮燒灰為末每服三錢溫酒調下無時無子治婦人無子用正月雨水夫妻各飲一杯還房當即有孕又方用二月丁亥日收桃杏花陰乾為末戊子日和井花水服方寸匕日三服大驗又方用二月乙酉日日中北首臥合陰陽有子必貴治衝任虛損下焦久冷月事不調不成孕育崩漏帶下用生硫黃六兩禹餘糧九兩醋淬赤石脂煅紅附子炮去皮臍海螵蛸去殼各三兩為末醋糊丸如桐子大每服三十丸空心溫酒醋湯任下治諸虛不足久不妊娠骨熱形羸崩中帶下用鹿角霜白朮白茯苓香白芷白薇山藥白芍藥牡蠣煅烏賊魚骨等分為末麵糊丸如桐子大每服五十丸空心米飲送下治虛寒胎孕不成或多損墜用澤蘭葉白朮各兩半乾薑炮肉桂去皮各半兩當歸熟地黃川芎石斛酒浸炒白芍藥牡丹皮延胡索各一兩為末醋糊丸如桐子大每服五十丸空心溫酒下又方用細辛沉香木香各五錢杜仲炒斷絲附子炮去皮臍防風川芎白芨乾薑茯苓豆蔻桂心為末煉蜜丸如桐子大每服三十丸空心溫酒下日二服不過一月有孕如覺有孕即停服無夫婦人不可服又方用秦艽桂心杜仲防風厚朴各三分生附子白茯苓各一兩半白薇乾薑沙參牛膝半夏各五錢人參細辛各一兩並生碾為末煉蜜丸如緑豆大每服三五十丸空心米飲或酒任下不過四十九日即便有妊既有即停服胎漏治胎漏下血及因事下血用枳殼炒黃芩各半兩白朮一兩為末水煎食前溫服妊娠下血名曰胎漏胞胎乾者兒亡又方用生地黃為末每服方寸匕酒調服無時又方用乾地黃一兩赤石脂三錢同為末每服二錢溫酒調下日三服又方用丹參一兩半酒五盞煎三盞分作三服無時大效又方用生乾地黃乾薑等分為末每服二錢溫酒調下又方用縮砂一兩益智半兩為末每服三錢空心白湯調下又方用香附子炒去毛為末每服三錢白湯調下又方用新地黃汁二升酒四合同煎三五沸分作二三服又方用阿膠炒黃為末每服二錢匕食前粥飲調下治妊娠卒下血用葵子一升水五升煮二升分作三服又方用鹿角膠二兩酒煮消盡頓服又方用阿膠三兩炙搗為末酒一升半煎令消一服愈又方用阿膠二兩為末生地黃半斤搗取汁以酒三升和絞分三服治妊娠卒胎動腰痛或轉搶心或血不止用艾葉雞子大一塊酒四升煮二升分作二服無時或用醋煎又方用菖蒲半斤搗取汁服之又方用生曲半餅為末水和絞汁服三升又方用蔥白一握濃煮汁飲之又方用當歸四兩芎藭九兩酒三升水四升煎二升分服若子活即安死即自下治妊娠忽下黃水如膠或如豆汁用苧根切二升銀一斤水九升煎四升每用一升入酒半升再煎作二服又方用秫米黃耆各一兩細銼水七升煎三升服治胎漏用桃奴燒存性為末每服方寸匕水調服治胎動痛下血不止用蠟如雞子大煎消三五沸酒半升投和服之即安安胎治胎動不安用銀以水煮汁卻用蔥白一握投汁煮作羹服之又方用苧根二兩銼碎銀五兩酒水各一盞同煎一盞去