人者用大栝樓黃者一枚新汲水九合浸汁下蜜半合朴硝八分不令消盡分二服立瘥治傷寒時氣頭痛壯熱用葛根搗汁一大盞豉一合煎六分去豉作二服汗出即瘥未汗再服心熱加梔子十枚治傷寒熱病口瘡用黃柏削去粗皮取裡面好處薄削以蜜浸之一宿令濃含其汁若胸中熱有瘡飲五合尤佳治傷寒啖噫不止及噦逆用丁香一兩為末每服一錢人參湯下治傷寒下痢用梔子十四枚水四升煎二升半入豉四合再煮至一升去渣分再服得吐餘無服治傷寒下部生䘌瘡用烏梅肉三兩炒燥為末煉蜜丸如桐子大以石榴皮煎湯食前下十丸治傷寒頭痛四五日壯熱胸中煩痛用烏梅十四個鹽五合水一升煎去一半服吐之治傷寒小腹脹滿小便不通用石燕子為細末蔥白湯調半錢服得通為度治傷寒汗出不解已三四日胸中悶吐用豉一升鹽一合水四升煎一升半分三服當吐治傷寒寒熱骨節碎痛及中風面目浮腫並用蔥細切煎湯或作羹粥食之良治傷寒咳嗽用半夏橘紅各三錢生薑五片水一盅煎七分服及研細白礬蜜調下治傷寒初起用好茱萸半兩水蠱半煎一盅空心服治急傷寒用半夏四錢生薑七片酒煎服治陰證傷寒因女色者用陳皮一兩炒焦以酒烹下濾酒飲之凡傷寒汗後不可飲酒治初感冒用帶須蔥白七莖煎湯嚼下生薑一塊得汗愈治陰毒傷寒手足逆冷脈息沉細頭痛腰重用川烏乾薑等分銼碎炒令轉色放冷搗細每服一錢水一盞鹽一撮煎半盞溫服兼治陰毒咳逆等疾治陰毒傷寒四肢逆冷宜尉以茱萸一升酒和勻絹袋盛蒸熱尉腳心候氣通暢勻暖即停尉治傷寒胸膈閉痛用枳實炒麩為末米飲調三錢下日二服治陰毒傷寒用烏藥一合炒令黑煙起投水中煎三五沸服一盞候汗出回陽立瘥治傷寒自利六脈沉伏手足厥冷用乾薑一兩附子一枚生去皮臍銼細每服三錢水一盞半煎七分食前溫服兼治體虛中寒昏不知人及臍腹冷痛霍亂轉筋一切虛寒之證又方用甘草二兩炙乾薑一兩半附子半兩生用去皮臍銼細每服三錢水一盞煎七分溫服不拘時治傷寒八九日不解風濕相搏身體煩疼用甘草半兩桂枝一兩附子一個炮銼細每服五錢水一盞姜四片煎八分溫服治傷寒汗下後不解而煩躁者用附子一個去皮生破八塊只用二塊人參八分甘草三分乾薑三分茯苓五分銼細每服五錢水一盞煎八分溫服治傷寒潮熱譫語如有所見大便六七日不通用厚朴去皮薑製大黃各一兩枳實一枚麵炒去瓤銼細每服五錢水盞半煎八分溫服以利為度治傷寒汗後表證已解或吐下後邪氣未除熱結在裡心胸煩渴甚欲飲水用知母二錢甘草一錢石膏五錢水一盞粳米三十粒煎七分去渣溫服治傷寒結胸心下堅滿而痛按之如石脈浮用半夏湯洗三錢黃連一分栝蔞破四塊用一塊水一盞半先煎栝蔞至一盞卻下諸藥煎八分去渣溫服以微吐黃涎為愈治傷寒汗後及吐下後虛煩不得眠少氣用大梔子四枚甘草三錢水一盞煎七分去渣溫服治傷寒四五日病在胸膈痰氣緊滿於上不得息者用青甜瓜蒂一兩炒黃赤小豆一兩銼細每服三錢水一盞半入豉一合煎六分去渣溫服以吐得快為度體虛者休服治傷寒失下熱毒在胃發斑甚則煩躁譫語用玄參升麻甘草炙等分共四錢水一盞煎七分去渣溫服治傷寒發狂逾牆上屋用黃連寒水石等分共二錢為末濃煎甘草湯候冷調服治傷寒病後邪入經絡體瘦肌熱或咳嗽用柴胡二錢甘草半錢水一盞煎八分食後熱服治傷寒産後婦人病與男子交接名陰易用其褌襠燒灰研細冷水調服以小便利為愈若男子病後與婦人交接名陽易用韭根去青一握約經寸半豭鼠糞十四粒兩頭尖者水一盞煎六分頻服之以汗出之為愈治傷寒手足逆冷謂之四厥以附子生銼碎水煮減半蘸洗良久遂溫大妙治傷寒時氣用柴胡水煮汁服之大效治一切傷寒中暑頭疼寒熱用蒼朮二錢防風半錢甘草一錢水一盞蔥白一莖鹽少許煎五分去渣熱服臥定以汗出為效治陰毒傷寒用百合二兩煮濃汁飲一升良治傷寒瘥後交接復發欲死眼不開不能語用梔子三十枚水三升煎一升服治熱病新瘥早起及多食復發用梔子十枚水三升煎一升去渣溫服臥令汗出若食不消加大黃又方用鱉甲燒灰為末服方寸匕治傷寒後男女交接用丹黍米三兩煮薄粥酒和飲之發汗出愈治頭痛口乾煩熱小便赤少用蜂房十二分炙水二升煎八合分二服當利諸惡毒隨小便出之瘥治時氣三日頭痛煩熱用皂角燒灰為末新汲水一盞蜜與薑汁各少許和二錢服之先用暖水淋浴服藥須臾汗出愈治時氣五六日心煩不解用竹瀝半盞新水半盞和勻服不拘時治時疫傷寒毒攻手足腫痛用虎杖根銼細水煮以漬手足令踝上有水尺許止之治熱病不解而下痢欲死用龍骨半斤搗碎水一斗煮五升候極冷稍稍飲得汗即愈治傷寒熱病後毒氣衝目痛用露蜂房半兩水二升煮一升重濾洗日三四度亦治赤目翳治傷寒熱毒氣攻眼生赤白翳用烏賊魚骨一兩去皮為末入龍腦少許更研極細取少許點日三度治時氣煩渴用生藕汁一盞生蜜一合和勻分二服治勞復用雄鼠糞頭尖硬者一合蔥頭豉汁煎數沸去渣服治交接勞復陰腫或縮入腹絞痛用蚯蚓數條絞汁服之良治大病後小勞便鼻血出用牡蠣十分石膏五分為末酒調方寸匕服亦可蜜丸如梧桐子大服之治時行熱病初得便用甜菜搗汁飲即瘥治傷寒勞復身熱便赤用胡黃連一兩梔子二兩去皮入蜜半兩和炒微焦為末用豬腸汁丸如梧桐子大每服用生薑二片烏梅一個童便三合浸半日去渣食後暖便溫下十丸臨臥再服驗治天行勞復發渴用故膩頭巾浸汁暖服一升治傷寒瘥後未滿百日交合必致手足拘攣速當汗之滿四日難療宜用乾薑末四兩湯調頓服覆蓋出汗得解手足伸遂愈治傷寒病後欲令不勞復用頭垢微燒水丸梧桐子大米飲服一丸治時氣餘熱不退煩躁發渴四肢無力不能飲食用牛蒡子根搗汁不計時候服一盞立效治天行熱狂煩悶消渴並癰毒熱悶口乾並用芭蕉根絞汁服亦治黃疸治時行病發瘡用升麻五兩水蜜二味同煎三沸半服半敷瘡治天行熱病發赤黑斑用青木香二兩水二升煮一升頓服之效治時氣熱毒心神煩躁用藍靛一匙新汲水一盞調服治天行病結胸滿痛身體壯熱狂言用苦參炒黃為末每服二錢水一盞煎八分去渣溫服連進三服有汗無汗皆愈又方苦參二兩醋二升煮二升二合盡飲吐或覆取汗愈治發狂無常不避水火用苦參末蜜丸如梧桐子大每服十丸薄荷湯下治傷寒大煩渴熱甚三焦有瘡張口吐舌不識人腹中食少三蟲食其五臟用白龍骨半斤碎之以水一斗煮取四升沉升中令冷每服五合日三服又方用豬膽一枚苦酒半斤煮之待溫滿飲一口蟲乃死下治男女傷寒用大黃黃芩麻黃蒼朮甘草各半錢生薑三片蔥白三根棗子三個水一碗煎七分溫服若汗未出再煎渣服小兒一錢水一盅煎服極效治男女頭疼寒熱百骨節疼用甘草麻黃各一錢半杏仁一錢生薑三片蔥白三根水一碗煎七分溫服小兒量減出汗為效治溫病食勞復用杏仁五兩醋二升煎一升服取汗瘥治天行病毒攻手足疼痛作坑深三尺大小容足燒令熱以酒灌坑中著屐踞坑上衣壅勿令泄氣治四時傷寒不正之氣用木香葉為末每服一二錢熱酒調服治傷寒感冒一切雜證加減香蘇散用香附子炒去毛紫蘇葉各二錢陳皮一錢甘草炙半錢銼細水一盞半生薑三片連根蔥白三莖煎一盞熱服不拘時日三服甚效頭痛加川芎白芷偏正頭痛加細辛石膏薄荷太陽穴痛加荊芥穗石膏傷風自汗加桂枝傷風無汗加麻黃去節乾薑傷風熱寒加蒼朮傷風發熱不退加柴胡黃芩傷風咳嗽不止加半夏杏仁去皮尖傷風胸膈痞寒加制枳殼傷風鼻塞聲重咽膈不利加苦梗旋覆花傷風痰涎壅盛加白附子天南星傷風鼻內出血加茅花傷風氣促不安加大腹皮桑白皮傷風鼻不通頭昏加羌活荊芥傷風不散吐血不時加生地黃傷風不解耳內出膿疼痛加羌活荊芥傷風不解咽喉腫痛加苦梗傷風中脘寒不思飲食加去白青皮枳殼傷風嘔吐噁心不止加丁香半夏傷風頭暈眼花頭倒支持不住加熟附子傷風時作寒栗加桂枝傷風痰壅嘔吐不止加白附子旋覆花半夏傷風后時時作虛熱不退加人參傷風飲食不能消化加縮砂青皮傷風一向不解作潮熱白日至日中不退日日如是加地骨皮柴胡人參初感風頭痛作熱鼻塞聲重加羌活川芎感風腰疼不能屈伸加官桂桃仁感風渾身痛不止加赤芍藥延胡索感風頸項強急不能轉頭加羌活官桂腹肚痛加木香肚腹疼刺不可忍加薑黃茱萸七粒小腹疼痛無時不可忍加木香薑棗婦人忽然大便痛腫不能下地加木香木瓜茱萸婦人被性所苦胸膈痞疼脅肋刺痛小便急疼加木香枳殼婦人被氣疼所苦加木香縮砂脾胃不和中脘不快加陳皮神麯傷食吐嘔泄瀉腹痛加乾薑木香心卒痛者加延胡索酒一盞飲酒大過或遍身發疸或兩目昏黃加茵陳梔子中酒吐惡加烏梅丁香婦人經水將行先作寒熱加蘇木紅花婦人産後作虛熱不退煩渴加人參地黃産後發熱不退加人參黃耆産後腰疼不已加當歸官桂冷嗽不已加乾薑五味子杏仁脾寒加良薑青皮草果腳氣加木香木瓜牛膝茱萸川楝子感風寒發熱頭疼加不換金正氣散感寒頭疼壯熱惡寒身痛不能轉動加生料五積散飲食不下欲吐不吐加丁香蘿蔔子感寒頭痛發熱身疼分陰陽加敗毒散石膏婦人産後風腳手疼痛用生料五積散人參敗毒散加木瓜不換金正氣散加生地黃川芎同煎凡傷寒熱病新瘥及大病後血氣未平復脾胃尚虛弱但宜食糜粥寧飢慎勿過飽不得他有所食若食豬肉羊血肥魚油膩等物必大瀉難治食餅餌骮鱠炙脯修棗栗桃杏梅李堅硬之物不能克化必致復危食羊肉則發喘悶食牛肉則患痢結症食豬羊腸成痼疾食犬馬禽肉發黃難救食燒肉成消渴食諸骨汁發熱成骨蒸食兔肉必心痛食雞肉成蟲症食魚鮓必發黃食鵝肉則霍亂食蚶子必危篤食濕面發潮熱食黃瓜稍瓜必再病食茄子成瘧疾食扁豆滯胸中寒氣食葵菜必喪明食諸生菜心病顏色不復飲酒太早發狂悶飲白酒必浮腫汗後飲冷水損心包令人虛不能復若口渴宜服西瓜水梨可止渴退餘熱瘥後未滿百日切忌犯房室壯實者亦宜忌兩月不爾病復難療若梳頭太早必發頭風洗面太早頭潮熱濯足太早則足痹洗浴太早發熱昏悶躁怒成痞疾遠行則腳弱緩風舉動耗氣則成偏枯思慮太重則成氣消不得早起不得勞心費力反此則病必復夫傷寒感冒但有輕重之分重者為傷輕者為感必須問症以察於外切脈以審於內尤當辨其陰陽觀其傳變一日至三日病在皮膚者為表宜投藥汗之以驅散其寒邪有汗不得服麻黃無汗不得服桂枝四日五日之間病在胸膈痰氣緊滿枝上宜投藥以吐之六日七日之間其病入腹臟腑結燥狂言潮熱宜投藥以下之又有初得病即胸腹悶痛胃氣喘息則又不可拘以日數即宜下之又有六七日尚或頭痛惡寒項上有汗小便清利乃表症未除仍宜汗之若應汗而反下則熱蓄於裡必致發狂而或結胸若應下而反汗則津竭體虛必至亡陽而譫語若應吐而溫補則毒氣鬱於內心發而為斑色如錦紋者生色黑者難療其中變易非止一端略舉其概以備倉卒調理傷寒不可不謹臨症用藥切宜詳慎
