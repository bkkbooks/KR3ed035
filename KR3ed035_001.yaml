body:
  text: 卷之一諸風治中風不語手足不遂口眼喎斜鼻流清涕頭旋目眩言語澀滯心胸痰積口中涎水手足頑痹腰膝疼痛久立不得頭痛尤甚攻耳成膿而聾又沖眼赤及骨節風繞腕風腎臟風胎風頭風暗風心風大風白癜風並膈氣冷熱諸氣等症並皆治之用威靈仙一味冬三月丙丁戊巳日採洗淨焙乾為末好酒和令微濕入竹筒內牢塞口九蒸九曝如干添酒重灑之以白飯和搗為丸如桐子大每服二十丸至三十丸溫酒下又方但用威靈仙陰乾為末每日空心溫酒調二錢匕服可漸加至六錢匕利過兩行則減之病除乃停服其性甚善不觸諸藥但惡茶及麵湯可煎甘草梔子湯代飲蓋此草生時比衆草先採以不聞水聲者良治三十六種風用馬齒莧一石水二石煎令味盡去渣澄清入黃蠟三兩熬成膏每服酒調一匙下有瘡以膏塗治癱緩風及諸風手腳不遂腰腿無力用阿膠驢皮熬者炙令微起以水一升煮香豉二合去渣入膠煮六七沸膠煬化盡頓服之仍煮蔥豉粥一升任意服食三四劑則止治偏風手足不遂皮膚不仁用仙靈皮脾一斤細銼生絹袋盛於瓷器中以無灰酒一斗浸之厚紙重封不通氣春夏三日秋冬五日後開每日隨性暖飲之當令醺醺不得大醉若酒盡再合服之無不效合時忌雞犬見亦益陽事治中風口偏用生鹿肉並生椒同搗敷之右患敷左左患敷右看正即除之治中風口噤不開涎潮用皂角一挺去皮塗豬脂炙黃為末每服一錢匕溫酒調服如氣實脈盛服二錢匕若牙關不開用白梅揩齒口開即灌藥吐出風涎即差治中風面目相引偏僻牙拘急舌不可轉用桂心酒煮取汁故布蘸掩病上正即止左喎拓右右喎拓左大效治中風失音不語偏風口眼喎斜時吐涎水四肢麻痹骨間疼痛腰膝無力者五月五日六月六日九月九日採稀蘞葉洗淨曝乾入甑中層層灑酒與蜜蒸之又曝如此九遍為末蜜丸如梧桐子大每服五七十丸溫酒吞下治卒中風不語以竹燒瀝灌飲之良治卒中風昏昏若醉四肢不收口角涎出用肥實不蛀豬牙皂角四挺光明晉礬一兩共為末每服半錢重者三字匕溫水調灌下令涎出一二升當時惺惺用之纍效治風冷癱緩用蠶沙五升醇酒三升灑拌甑內蒸熱暖室中鋪於油單上令患人就所患一邊臥厚蓋覆汗出為度仍令頭面不得壅覆如未痊再作治心臟風熱氣壅膈脹用薄荷煎作茶飲立效及治中風失音吐痰除賊風頭風下氣消宿食陰陽毒氣傷寒頭痛能引諸藥入營衛治中風遍身冷口噤不知人用獨活四兩好酒一升煎取半升分溫服治中風及壅滯用旋覆花洗淨搗羅為末煉蜜丸如梧桐子大臨臥茶湯下五七丸治初中風一日內癱瘓用膽礬研細每服一字溫醋湯下立吐出涎治暴風口噤金瘡用垣蟬衣酒漬服之甚效治中風口眼喎斜用硬石灰一合以醋炒調如泥於不患邊塗之立便牽正一方以白水牛鼻炙熱於不患邊尉之漸正治癱緩風手足軃曳口眼喎斜言語謇澀步履不正用川烏去皮臍五靈脂各五兩為末入腦麝研勻滴水丸如彈子大每服一丸先以生薑汁研化次暖酒調服每日空心晚食前各一服至五七丸便抬得手移得步十丸可自梳頭三十丸全愈治中風煩熱皮膚瘙癢用醍醐四兩每服酒調下半匙治諸風用浮萍為丸古歌云不在山不在岸採我之時七月半選甚癱風與緩風些小微風都不算豆淋酒內下三丸鐵幞頭上也出汗治風壅痰涎唾多咽膈不利用牛蒡子微炒荊芥穗各一兩甘草炙半兩共為末食後臨臥湯點二錢治痰癖卒風生薑八兩附子四兩水五升煮取二升分再服禁豬肉冷水治風氣客於皮膚瘙癢不已用露蜂房微炙蟬蛻等分為末酒調一錢匕日二三服又方用薄荷蟬蛻等分為末酒調一錢匕日三服治遍身風癢生瘡疥用蒺藜子苗煮湯浴洗治風心煩恍惚腹中痛或時悶絶復蘇用羖羊角屑微炒搗羅細末不拘時溫酒調一錢匕服治癧節風百骨節疼痛不可忍用虎頭骨一具塗酥炙黃捶碎絹袋盛以酒二斗浸五宿隨性暖飲之妙治白虎風走注疼痛兩膝熱腫用虎脛骨塗酥炙黑附子炮裂去皮臍各一兩為末每服溫酒調二錢匕日再服治風痹癱緩口噤及産後諸風用大豆炒黑煙未斷及熱投酒中良久取酒熱飲治熱風心胸煩熱用生大豆於食後服半兩明目鎮心溫補益顏色不忘治久風濕痹筋攣膝痛用黃卷一升熬香為末空心暖酒調一匙服亦除五臟胃氣結聚去麵點黑痣潤皮毛黃卷以大豆為芽孽生便乾之者是也治暖風四肢不收用豉三升水九升煮取三升分三服日二作亦可酒漬飲治風毒腳膝攣急骨節疼痛豉五升九蒸九曝酒一斗浸經宿空心隨性緩飲之治中風不語舌強用人乳汁五合三年陳醬五合和研以生布絞汁不拘時少少與服良久當語治中風口噤不語及虛勞血癖心腹攪痛用乳香細研方寸匕酒煎蘇木湯調服立吐惡物治中風不省人事牙關緊急聲如拽鋸口出涎沫用藜蘆一兩去蘆頭以防風湯浴過焙乾炒褐色為末每服半錢溫湯調下以吐風涎為效如人行三里不吐再服一方加大南星一個去皮臍上剜一坑內陳醋二橡斗四面火炙令黃同藜蘆搗為末生面為丸如赤豆大每服三丸溫酒下治半身不遂失音不語用萆麻子油一升酒一斗銅鉢盛煮一日熟旋服之治急中風目瞑牙噤無門下藥者用天南星末以中指點末揩齒大牙左右三二十揩其口自開始得下藥以天南星白龍腦等分研末五月五日午時合患者只用一字至半錢治中風四肢逆冷口吐清水宛轉啼呼者用桂心二兩細銼水三升煮取二升去渣溫盡服治歷節諸風百節痠疼用松脂三十斤煉五十遍或二十遍亦可以煉酥三升溫和松脂三升熟攪令極稠空腹服方寸匕酒調日三數食麵粥為佳忌血腥生冷果子百日差又方用松脂二十斤酒五斗漬三七日每服一合日五六服治中風身直不得屈伸反復者用槐皮黃白者切之以酒或水六升煮取二升去渣溫稍稍服之治偏風及一切風用新嫩桑枝銼一升水一斗煎取三升夏用井中沉恐酢壞每日空心服一盞服盡再煎治中賊風口偏不能語者用茱萸酒一升煮四五沸冷服半升日三服得少汗差治卒中風口喎用皂角五兩去皮子為末以陳醋和右喎塗左左喎塗右干更敷之又方用巴豆七枚去殼煉研喎左塗右手心喎右塗左手心以暖水一盞安向手心須臾便正洗去藥並抽掣中指治歷節諸風骨節疼痛晝夜不可忍者用沒藥半兩虎腦骨三兩塗酥炙黃為末同沒藥研細溫酒調二錢日三服大佳治中風身直不能屈伸者刮取枳樹皮一升酒二升漬一宿服五合至一升酒盡再造服治中風不語用淡豉茱萸各一升水五升煮取二升稍稍服之又方以苦酒煮白芥子敷頭一周以帛包之一日一夜乃差治風順氣利腸用蘇子一升微炒杵碎生絹袋盛於三鬥清酒中浸三宿少少飲之治風瘙癢痛用茱萸一升酒五升煮一升半去渣暖洗治風氣所攻臟腑積滯用牽牛子以童便浸一宿後長流水上洗半日卻用生絹袋盛掛於當風處令乾每日鹽湯下三十粒極能搜風亦善消虛腫炙服人體清爽治風痰鼻拓用萆麻子不拘多少去皮掰為兩片以黃連等分捶碎同置水中浸七宿後空心日午臥時用浸藥水吞下一片水盡旋添勿令乾服兩月後吃大蒜豬肉試驗如不發動便是效若發動時依前再服直候不發如只腿脹用針出毒物纍有效驗治虛風不省人事吐瀉不止或數轉筋四肢發厥用天南星為末每服三錢大棗三枚水一盞煎八分溫服未省再服則四肢漸暖神識便省治中風心肺風熱手足不遂及風痹不仁恍惚煩躁用熊肉一斤如常法調和作醃臢空腹食之若腹中有積聚痼疾者食熊肉終身不愈治風眩羸瘦虛勞手足無力及小兒驚癇用羊頭一枚蒸熟切碎以五味調和食之羊腎作羹食治腎勞損精竭治中風急喉痹欲死者用白殭蠶焙黃為末生薑自然汁調灌下喉立愈治卒患偏風口喎語澀用衣魚摩耳下向左摩右向右摩左正即止治頭風強不得顧視用穿地作坑燒令通赤水灑令冷以生桃葉鋪席下臥之令項在藥上以衣著項邊令氣上蒸病人汗出良久即瘥治風勞毒腫痛或牽引小腹及腰痛用桃仁一升去皮尖雙仁炒令煙出熱研如膏以酒三升和勻一服取汗再服瘥治偏風半身不遂失音不語用生杏仁七枚不去皮尖吞之從十七加至七七枚周而復始夜後即以竹瀝下之任意多少日料一升取盡治諸風用胡麻合蒼耳子服之良治卒中風不得語用大豆煮汁煎如飴含之亦濃煮汁飲治卒中風頭面腫用杏仁研如膏敷之或用臘豬脂和敷之治風毒骨髓疼痛用芍藥二分虎骨一兩炙為末夾絹袋盛酒三升漬五日每服三合日三服治風熱毒攻目臉四肢腫痛臘月以新瓦罐注熱水用朴硝二升投湯中攪勻掛北檐下硝滲出收之以人乳汁調半錢掃應手神驗治中風不省人事用香油或生薑自然汁灌之即醒治熱毒浮風及消渴風疹丹毒用緑豆研汁煮飲或就煮食益氣力潤皮肉可長食治風毒腫白虎病用三年釅醋五斗煎三三沸切蔥白二三升煮一沸漉出布帛熱裹病上尉之瘥為度治風涎暴作氣塞用青甜瓜蒂約半寸許曝乾不限多少為末量疾每用一二錢匕膩粉一錢匕水半合調勻灌之臥服良久涎自出如未出含砂糖一塊下咽即涎出此物甚不損人全勝石碌硇砂諸藥亦治身面四肢浮腫咳逆殺蟲治中風失音用韭研絞汁服亦治心脾骨疼甚然此物多食則昏神暗目又不可與蜜同食其花食之動風治風寒濕毒四肢攣急及腳氣疼不可踐地用紫蘇二兩杵碎水二升研取汁煮粳米二合作粥和蔥豉椒姜食之治一切冷毒風氣用獨蒜爛搗和雄黃杏仁為丸空腹飲下三丸靜坐少時若鬼氣者當毛出即瘥並治腎氣止霍亂吐瀉腹痛除邪辟瘟去蠱毒療勞瘧痃癖治熱風汗出心悶用水和雲母服之不過再服立瘥治中風痰盛服熱藥不得者用南星八錢木香一錢銼細每服四錢生薑十片水一大盞煎七分溫服治中風痰壅昏不知人口眼喎斜半身不遂用附子去皮南星各一兩生用木香半兩不見火細銼每服四錢生薑九片煎七分去渣溫服虛寒甚者加天雄川烏治中風口眼喎斜半身不遂用白附子白殭蠶全蠍去毒並生用各等分為末每服二錢熱酒調下不拘時治諸風緩縱言語蹇澀遍身頑麻皮膚瘙癢用川烏去皮臍炮一兩荊芥穗二兩共為末醋糊丸如梧桐子大每服二十丸溫酒熱水任下及治婦人血風頭痛眼暈並腸風下血不止服之尤效治癘風手指攣曲節間痛不可忍用萆麻子一兩去皮黃連銼如豆以小瓶入水一升同浸春夏三日秋冬五日後取一枚劈破面東以浸藥水平旦時服漸加至四五枚微利不妨瓶中水少更添忌食動風物纍有效治驚風墜涎天南星一個重一兩換酒浸七伏時取出於新瓦上周回炭火炙令乾列置於濕地去火毒用瓷器盛之冷搗末用硃砂一分同研每服半錢荊芥湯調下每日空心午時進二服治偏風半身不遂及大風冷痰癖脹滿用生附子一兩銼碎酒一升漬春冬五日夏秋三日服一合以瘥為度治風頭項強不得顧視用大豆蒸一升令變色內囊中枕之治中風口噤用荊莖竹莖火燒取津瀝一合飲之風噤自退又方用獨活一兩漬酒一升浸熬升半以大豆五合炒煙出投酒中名豆淋酒飲三合口噤者灌之日進三四服自愈治中風不語者用少婦乳半合好酒半升攪勻分服即愈又方用烏龜尿少許點舌下神妙取尿法以龜坐荷葉上用豬鬃鼻內刺之治風痱卒得不語口噤手足不遂而不強直者用伏龍肝五升冷水八升攪汁飲之令盡佳亦治中惡身體不痛四肢不收神智不亂一臂不遂能言者可治不能