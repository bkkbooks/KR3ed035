半夏二錢半湯洗七次為末分作二服每服水一盞半生薑十片煎七分去渣溫服治一切痰嗽不已諸藥無效世傳極驗用粟殼一斤醋炒烏梅四兩為末每服二三錢沸湯點常服食後日三服治寒嗽用麻黃四兩官桂一兩為末以蠟二錢同煎每服一二錢溫服治胸中熱積年咳嗽用莨菪子二升肥棗一百枚水三升慢火煮水盡取棗旦暮日午各食一枚去胸中毒熱氣嗽自止治熱勞蒸嗽唾血者用地黃汁三合白粥攪勻空心食之治肺病咳嗽唾膿用薏苡仁三兩為末水一升煎三合入酒一合溫服無時大效治熱嗽用紫花梨搗汁服亦止消渴治諸般咳嗽用天雄炮裂去皮臍為末每服一字溫酒調下立愈勿多服治肺傷用紫菀水煎服之效又方用沙參為末水煎服之治㗇呷咳嗽喉中作聲不得眠用白前為末溫酒調二錢匕服治久嗽用烏梅肉四兩炒粟殼四兩去頂瓤蜜炒黃通聖散四兩為末先用麻黃四兩知母二錢銼碎河水熬味出澄清入瓷器再熬成膏和前末丸如彈子大硃砂金箔為衣每服一丸臨臥細嚼薑湯送下治痰嗽用白礬一兩人參半兩巴豆十粒去皮油為末醋糊丸如桐子大豆粉為衣每服三五丸臨臥薑湯下又方用知母貝母各一兩巴豆二十粒去皮細為末每服一字生薑三片蘸末臥細嚼下次早利一行粥補甚效治諸嗽久不愈用人參阿膠炒款冬花粟殼醋浸炒等分每服三錢烏梅二個水盞半煎七分半夜服治草睘嗄用萆麻子去殼炒熟揀甜者吃多服見效治咳嗽用南星炮裂為末每服一錢水一盞生薑七片煎至五分溫服空心日午臨臥各一服大治風痰治久嗽成癆肺痿用天門冬麥門冬知母杏仁各三兩當歸地黃黃連阿膠各一兩半蒲黃京墨桔梗薄荷各一兩麝香少許各依常法修製為末和勻銀器內煉白蜜丸如彈子大每日三食後濃煎薄荷湯漱口細嚼一丸津唾送下上床時再噙一丸仰睡令藥汁流入肺竅則肺潤嗽止服至七日決定除根若患肺癰亦宜噙服凡治嗽當審其或為風寒濕熱之氣所幹或因喜怒憂思過度或啖鹹酸而停飲或嗜欲負重而勞傷皆能致嗽各當隨其所感施治仍須量其虛實用藥則疾易愈而無差誤之失切宜慎之
