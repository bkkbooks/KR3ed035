body:
  text: 卷之二頭風治頭風腦中冷面上遊風目淚涕唾用川芎苗細嚼茶清送下治頭腦風傷風小兒風涎用薄荷葉每日食後嚼三兩片大能涼上膈去風痰通關膈治諸頭風及面上遊風用排風草為末每用一字搐鼻中自然頭目清爽去風清上治頭風頭旋用九月九日採菊花曝乾糯米一斗蒸熟菊花五兩拌勻多用面曲醞酒如常法候熟每次暖一小盞治搖頭風用井底泥調大黃芒硝末塗之治頭目風用荊芥穗細辛川芎等分為末食後湯點二錢服又方用桃仁五合去皮以粳米飯漿研令細以漿水絞取汁令桃仁盡方止微溫洗面極妙令人光潤延年治頭風用川芎水洗淨薄切焙乾為末煉蜜丸如彈子大不拘時茶清嚼下一丸又方用大附子一個去皮臍緑豆一合同煮豆熟為度去附子服豆即瘥每個附子可煮五服後為末服之治偏頭風用蓽茇為末令患者口中含左邊痛左邊吸一字右邊痛右鼻吸一字甚效治頭風旋用蟬殼微炒為末每服溫酒調一錢匕下治頭風目眩用水蘇清酒煮汁一升服及以汁洗頭令髮香白屑不生澆灰淋汁洗亦好治頭風用山豆根搗為末油調塗又方用杏仁一升去皮尖雙仁水研絞汁熬如膏和酒或羹粥內攪二匙食後服十日後汗出來瘥治初得頭風用童便和蔥豉作湯飲佳治偏正頭風及一切頭疼用香白芷二兩為末煉蜜丸如龍眼大每服二三丸食後細嚼茶清送下治頭風用端午日採蒼耳二兩茵陳一兩甘草半兩為末每服五錢熱酒或熱茶調下又方用蒼耳川芎當歸等分為末每服三錢臨臥茶清調服又方用草烏細辛等分黃丹少許為末吹入鼻中又方用川烏極大者一枚河水煮七次銼碎鹽炒黃細辛四兩酒浸茶芽半斤麝香少許為末每服三錢食後臨臥茶清調下少時更以熱湯催汗出或鼻出涕為度又方用光明硫黃硝石各一兩研細水丸如指頭大空心茶嚼下並治頭疼不可忍又方用苦丁香川芎藜蘆等分為末口噙水吹入鼻內頭痛治偏頭風痛用雄黃細辛等分為末左邊痛嗅入右鼻右邊痛嗅入左鼻立效治痰厥頭痛用烏梅肉十個鹽二錢水一盞煎七分去渣無時溫服吐即佳治時氣頭痛不止用朴硝二兩為末生油調塗頂上治偏正頭疼用穀精草一兩為末白麵調攤紙上貼痛處干又換治風頭痛每遇天陰風雨先發者用桂心一兩為末酒調如膏敷頂上並額角治偏正頭疼夾腦風連兩太陽穴疼用白殭蠶為末蔥茶調服方寸匕治頭痛用附子炮石膏煅等分為末腦麝少許茶酒調半錢服治卒頭痛如破非冷非風蓋胸膈有痰氣上攻所致名厥頭痛吐之即瘥多用好茶煎二三升暖飲須臾吐吐畢又飲能如此數過須吐汁乃止不損人待渴即瘥治頭痛欲裂用當歸二兩酒一升煮六合飲再服瘥治氣虛頭痛用附子一枚炮去皮臍為末蔥涕和丸如梧桐子大每服五十丸空心茶清下治風吹項背頭目昏眩腦痛用香白芷大塊潔白者沸湯洗四五次銼干為末煉蜜丸如彈子大每服一丸細嚼用荊芥湯點茶下及治婦人胎前産後傷風頭痛治風寒流注陽經以致偏正頭疼久年不愈用大附子一枚生去皮臍切作四塊以生薑自然汁一盞浸一宿火炙乾再蘸再炙汁盡為度高良薑等分為末每服二錢臘茶清調下食後連進二服忌熱物少時治遠年近日一切偏正頭疼用蘿蔔汁一蟬殼許令病者仰臥右疼注左鼻左疼注右鼻兩邊皆疼並注之治偏正頭疼用川芎二兩香附子炒四兩共為末以茶清調服得臘茶清尤好又方用川烏天南星等分為末蔥白連須搗爛調末貼於太陽痛處治氣厥頭疼用川芎天台烏藥等分為末每服二錢食後臘茶清調服或蔥茶湯調服婦人氣盛頭疼及産後頭痛悉皆治之治偏正頭痛用甘菊花石膏川芎各三錢為末每服三錢茶清調下一方用白芷去菊花又方用馬牙硝和酥安鼻內治一切頭疼服藥不效者用甘草一兩半水一碗煎七分去渣溫服未效加二兩眩暈治一時為寒所中口不能言眩暈欲倒用乾薑一兩附子生去皮臍細切一枚每服三錢水盞半煎七分食前溫服治諸風目眩用蟬蛻為末米飲下一錢匕治一切失血過多眩暈不蘇用芎藭當歸酒浸等分每服四錢水一盞煎七分不拘時溫服虛甚加附子治冒雨中濕眩暈嘔逆頭重不食用川芎半夏湯洗七次白朮各一錢甘草半錢炙水一盞薑七片煎服不拘時治頭目眩暈用大黃荊芥穗防風等分為粗末大作劑水煎去渣服以利為度一方有川芎治感寒濕頭目眩暈用附子白朮川芎各一錢官桂甘草炙各半錢水盞半薑七片煎七分溫服治發汗多頭眩筋惕肉瞤用牡蠣粉炒黃防風白朮等分為末每服二錢酒調下米飲亦得日二三服霍亂治霍亂吐瀉腹痛用高良薑一兩銼細水三盞煎二盞半去渣下粳米二合煮粥食又方用高良薑五兩炙焦銼細酒一升煎三五沸頓服立止治霍亂不吐不下用丁香十四枚為末以熱湯一盅調頓服治霍亂腹痛吐下用桑葉搗汁服一盞冬月用乾者煎濃汁服治霍亂痢瀉不止轉筋入腹欲死用生薑三兩搗爛酒一升煮三四沸頓服治霍亂吐下不止用艾一握水三升煮一升頓服治霍亂轉筋用柏枝煎湯淋洗治大瀉霍亂不止用附子炮去皮臍為末每服四錢鹽半錢水二盞煎一盞溫服立止治霍亂心腹脹痛煩悶短氣未得吐下若轉筋燒梔子二七枚研末熟水調服治霍亂用厚朴薑汁浸火炙為末新水調二錢匕服不拘時治霍亂後胃氣煩逆用苦苣根生搗汁飲治轉筋用故綿以釅醋浸瓶中蒸及熱裹病人腳冷更易勿停瘥治霍亂吐痢不止用扁豆末和醋服之下氣又方吐痢後轉筋生搗扁豆葉一握以少醋浸汁服之立瘥治霍亂心腹脹痛煩悶短氣未得吐下飲好醋三盞老小羸者飲一二盞治霍亂糯米一合水研煮粥服此米不可多食發風動氣使人多睡緩人筋令人軟孕婦食不利子飼小貓犬令腳屈不能行治霍亂轉筋取蓼一手握去兩頭水二升半煮一升頓服又方肝虛轉筋用赤蓼莖葉切三合水三合酒一盞煎八分去渣溫分二服治霍亂後吐逆不止用糯米以清水研一碗飲之即止治霍亂後煩躁臥不安穩用蔥白二十莖大棗二十枚水三升煎二升分服治霍亂心悸熱渴用糯米水研冷熟水混取米泔汁任意飲之治霍亂轉筋用香薷濃煮汁服半升無不瘥者若四肢煩冷汗出而渴者加蓼子同煮飲之治霍亂心腹脹滿未得吐下用小蒜一升銼細水三升煮一升頓服治筋脈攣急不得屈伸者用薏苡仁生為末每服二錢米飲調下無時日進三服勿令間斷常服大妙治腿轉筋但用自腳踏實地自止治足筋急痛用生薑半斤搗如膏貼裹痛處治轉筋吐瀉用艾葉木瓜各半兩鹽二錢水盅半煎一盅待冷飲治乾霍亂欲吐不吐欲瀉不瀉用鹽一兩生薑半兩切同炒色變以水一碗煎熟溫服甚者加童便一盞治霍亂用橘皮生薑煎服又方用乾薑小蒜葉官桂各單方水煎服治霍亂吐瀉用屋下倒挂塵滾湯泡澄清服之大忌飲食入腹則死吃冷水不妨不可吃湯治霍亂轉筋用皂角末吹一小豆入鼻中得嚏便瘥又方用山豆根末二錢橘皮湯調下治霍亂煩躁用亂髮如雞子大燒灰鹽湯二盞和服之未愈再服又方用木瓜煎湯或枝葉亦可治霍亂吐瀉轉筋治霍亂吐痢用桃葉三升切細水五升煮一升三合溫分二服治霍亂心痛無汗吐不止用梨枝葉一握水二升煎一升服治霍亂轉筋煩渴用米泔汁飲數升立瘥治霍亂不吐用白粱粉五合水一升和如粥頓服黃粱粉糯米亦可治霍亂吐下後大渴多飲則傷人用黃粱米五升水一斗煮三升澄清稍稍飲亦止泄痢治霍亂吐瀉轉筋頭旋眼花四肢逆冷用吳茱萸木瓜食鹽各半兩同炒焦先用瓦瓶水三升煮百沸入前藥煎至二升服之又方用枯白礬為末每服一錢沸湯調服又方用鹽一撮醋一盞煎七分溫服或鹽梅咸酸等物亦可煎服治霍亂吐瀉不能服藥用緑豆胡椒各四十九粒研碎水煎服如渴甚新汲水調服甚效又方用木瓜茱萸各二錢茴香甘草各半錢水二盞薑三片紫蘇十葉煎六分空心服治五臟中寒口噤失音四肢強直兼治胃脘停痰冷氣刺痛及胃虛感寒嘔吐不止用人參甘草乾薑白朮等分銼細每服四錢水一盞煎七分溫服及治諸症有加減法若為寒氣濕氣所中者加附子一兩若霍亂吐瀉者加橘紅青橘各一兩若干霍亂心腹作痛先以鹽湯少許頻服候吐出令透即服此藥若嘔吐者加橘紅丁香半夏一兩生薑十片同煎若泄瀉者加橘紅茯苓一兩若溏泄不已者加橘紅茯苓附子若不喜飲水穀不化者再加縮砂若霍亂吐下心腹作痛手足逆冷於本方內去白朮加熟附子若傷寒結胸先以橘梗枳殼等分煎服不愈者及諸吐利後胸痞欲絶心膈高處急痛手足不可近者加枳實茯苓若渴者再加栝蔞根若霍亂後轉筋者加火煅石膏若臍築者腎氣動也去朮加官桂腎惡燥故去朮恐作奔豚故加桂若悸多者加茯苓若渴欲飲水者去朮加附子若飲酒過多及啖炙爆熱物發鼻衄加川芎若傷胃吐血此藥能寬中脘分利陰陽安定血脈只用本方嘔吐治嘔吐用檳榔一顆煨陳皮一分炙為末水一盞煎半盞服治時氣嘔逆不下食用半夏半兩湯洗七次生薑一兩水一盞煎六分去渣分二服不拘時溫服治久積冷不食嘔吐不止冷在胃中用半夏五兩湯洗七次為末每服三錢白麵一兩搜切作棋子水煮麵熟為度以薑醋和服治嘔而胸中滿及乾嘔吐涎沫而頭疼者用茱萸一升棗二十枚生薑人參各一兩水五升煎三升每服七合日三治嘔逆不能食用訶梨勒皮二兩去核炒為末蜜丸如梧桐子大空心服二十丸日二服治嘔噦不止不欲食用枇杷葉煮汁飲之治嘔噦用面醋和作彈丸二三十枚煮熟漉出浸漿水中少頃乘熱吞下三兩枚加至八九枚未定晚後飯前再吞治胃受邪熱心煩喜冷嘔吐不止用葛根二錢半夏錢半湯洗七次甘草炙一錢水一盞入竹茹一塊薑五片煎七分去渣冷服不拘時治乾嘔噦用茯苓白朮人參黃耆各三錢銼細水三盞薑五片煎一盞去渣溫服如吐瀉轉筋頭痛自汗脈浮者加桂枝五錢如吐瀉轉筋頭痛無汗脈浮者加麻黃五錢治口中常如淡泔嘔出用大黃六兩水六升煎取二升去渣分服泄瀉治水瀉用黃連厚朴各二錢或四錢以薑汁拌勻炒乾仍用生薑三片水一盅煎七分服又方用車前子炒焦為末米飲調一錢服治脾胃虛弱不進飲食泄瀉用破故紙炒四兩肉豆蔻二兩生為末以大棗四十九枚生薑四兩切同煮棗爛去薑取棗肉研膏和藥丸如桐子大每服五十丸鹽湯下治久病大腸滑泄用五倍子五兩為末麵糊丸如桐子大每服五十丸米飲送下日三服治臟腑泄瀉不調用乳香一兩肉豆蔻一兩面裹煨熟為末以陳米粉糊丸如桐子大每服五七十丸空心米飲湯下治白瀉不止用五味子二兩吳茱萸五錢同炒香熟為末每服三錢陳粟米飲湯空心臨臥調服七日痊愈治泄瀉轉筋用木瓜艾葉各二錢水一盞煎七分入醋少許鹽一捻服之又方用吳茱萸艾葉各三錢水二盞煎盞半分三服即效又方用生薑一塊煨艾葉一把水煎熱服治泄瀉手足冷不渴腹痛用人參白朮乾薑甘草水二盞煎八分食前服中寒重者加附子治久患脾泄用生薑四兩黃連一兩銼碎同炒薑脆赤色去薑用黃連為末每服二錢空心茶清調下或服蠟礬丸亦效見癰疽門諸痢治初得痢冷熱赤白及霍亂用甘草一兩炙豆蔻七個銼水三升煎一升分服治赤白痢多用艾葉醋煎服或入生薑同煎止一切瀉痢亦止心腹痛及五臟痔瀉血並療疥癬治痢用紫參半斤水五升煎取二升入甘草二兩煎至半升分溫二服治寒痢水瀉乾薑為末米飲調一錢服立效治大熱毒純血痢用宣黃連六兩水七