body:
  text: 卷之十二小兒兒初生治小兒初生用甘草一指節長炙透銼碎以水二合煮取一合以指頭纏綿蘸汁點兒口中約一蜆殼吐出胸中惡汁待其飢渴更與之若兩服不吐盡一合止則兒智慧無病又方初生時即用豬膽一枚以水七升煎取四升澄清浴兒令長大及終身永無瘡疥治初生兒至十日口噤用牛黃少許研細以淡竹瀝調一字灌之更以豬乳點口中即瘥治小兒初生三日去驚邪避惡氣用牛黃大豆許細研以赤蜜如酸棗許共研勻以棉蘸之與吮一日令盡治兒生七日助穀神以導達腸胃用粟米研爛煮粥飲如乳每日與半栗殼吃又方兒生三日即以粳米擂碎煮作濃汁如乳與大豆許於口中胎熱胎寒治小兒胎中受熱生下面赤眼閉不開大小便不通不能進乳用澤瀉二錢半生地黃二錢豬苓赤茯苓天花粉各錢半茵陳甘草各一錢銼碎和勻每服三錢水一盞煎七分令乳母食後捏去宿乳服藥少頃乳之治小兒生下遍體皆黃身熱大小便不通乳食不進啼叫不止用生地黃赤芍藥川芎當歸天花粉各一錢水一盞煎七分乳母服並略滴些小與兒口中治小兒腦熱常閉目用大黃一分水二盞漬一宿每日與半盞頻稍服及塗頂上干即再塗治小兒五臟大熱用山梔子炒過為末每服二錢水煎服治小兒吐血不止用黃連末一錢豆豉二十粒水一盞煎六分去滓溫服量大小加減治小兒尿血用甘草五分水六合煎二合一歲兒一日服令盡又方用升麻五分水五合煎一合去滓溫服治小兒大小便不通用蜂房燒灰為末酒調一錢日二服治小兒熱毒赤腫用破草鞋和發燒灰醋和敷又方用芭蕉根汁煎塗之又方用伏龍肝為末以芭蕉油調敷又方用鯉魚膽或血塗即瘥又方用向南燕窩泥為末以雞子清調敷又方用針將腫處劃破以鱔血塗之又方用筆管盛水蛭拄腫上令食去惡血治小兒胎中受寒生下再感外風面色青白四肢厥冷大便青黑及腹疼盤腸內吊用當歸炒黃耆蜜炙細辛黃芩龍骨桂心赤芍藥各二錢為末每服以乳汁調下一字日三服仍看兒大小加減治內吊腹疼用乳香沒藥各三錢木香薑黃各四錢木鱉十二個為末煉蜜成劑貯瓷罐內量兒大小加減煎鉤藤湯化下又方用蓬朮半兩阿魏一錢以溫水化阿魏浸蓬朮一晝夜焙乾為末每服一字煎紫蘇米飲空心調下治小兒盤腸氣痛用木香一塊於乳鉢內磨水半盞調乳香沒藥末少許煎數沸服之立效又方用炒茴香延胡索等分為末空心米飲調下量兒大小服之重舌治小兒重舌用黃柏末和苦竹瀝點舌上又方用亂髮燒灰為末敷舌上又方用烏賊魚骨燒灰和雞子黃敷之又方用針刺去惡血即愈又方用蒲黃塗之亦瘥治小兒舌腫塞口欲滿者用紫雪一分竹瀝半合研勻頻置口中以盡為度治兒初生舌下有膜如石榴子連於舌根可摘斷之微有血無害如血不止燒發灰摻之若不摘斷令兒長大言語不利鵝口口瘡治小兒白屑滿舌狀如鵝口用發纏指頭蘸井花水拭舌上如不脫濃煮栗木汁以綿纏箸頭蘸拭卻用煅過黃丹摻之又方用硃砂白礬等分為末先以亂髮纏指揩舌上令淨以末敷之治小兒口瘡通白及風疳瘡蝕透者用白殭蠶炒黃為末蜜和敷之立效治小兒心有客熱滿口生瘡用天南星末醋調貼腳心又方用吳茱萸為末米醋調塗腳心亦可又方用黃連為末蜜水調服治小兒口生爛瘡用羖羊生乳含之瘥又方用桑皮中白汁敷之便愈治小兒口瘡飲乳不得用白礬如雞子大置好醋一盞中頻塗兒足底即愈又方用硝石為末摻瘡日三五度亦治重舌又方用巴豆一二粒去殼研爛入硃砂或黃丹少許貼在囟上如四邊起小泡便用溫水洗去藥更用菖蒲水洗之甚效臍風撮口治小兒因剪臍傷於風濕或尿在抱裙之內遂成臍風面赤唇青啼聲不出名曰撮口用白殭蠶為末蜜調塗口內即瘥又方用牛黃一錢竹瀝少許研勻抹入口中治小兒撮口及發噤用晚蠶蛾二枚炙黃為末蜜和敷兒口內又方用蠍稍四尾殭蠶七枚瞿麥半錢為末先以鵝毛管吹藥少許入鼻內使噴嚏啼叫後用薄荷湯調少許與服又方用川烏尖三個麝香少許別研為末和勻每服半字金銀薄荷湯調下治小兒臍赤腫用杏仁杵爛敷臍腫上治小兒臍瘡不幹用白礬煅白龍骨煅等分為末敷之又方用綿子燒灰存性為末塗敷又方用黃柏為末貼之又方用龍骨燒灰為末敷之又方用飛礬為末貼之又方用甑帶燒灰為末敷之治小兒撮口用雀甕鼠婦同研如泥先刺破兒口角出血後塗藥在口角並口內治撮口發噤用甘草二錢半水一盞煎六分去滓溫與服令吐痰涎自愈胎驚夜啼治兒在胎中受驚生未滿月而驚啼用硃砂牛黃麝香各少許研細取豬乳汁調稀抹入口中治小兒夜啼用蟬殼十四枚全者去大腳為末入硃砂少許蜜調與吮服又方用燈心燒灰塗乳上與吃又方用雞翼安席下勿令母知又方用干牛糞如手大安臥席下勿令母知子母俱吉又方用前胡為末蜜丸如小豆大日服一丸熟水下至五七丸以瘥為度又方用火柴頭一個長四五寸削平一面硃砂寫云撥火杖撥火杖瘥來作神將捉著夜啼鬼打殺不要放急急如律令又方用燈花二枚或四枚研為末以燈心煎湯調抹口中乳汁送下日三服治小兒腹痛夜啼用牛黃如小豆大乳汁化服又方用甘草炙黃耆當歸赤芍藥木香等分為末每用少許塗乳頭上使吃服又方於臍兒下用硃筆書田字一個即瘥治小兒驚啼用真麝香研細每服清水調下一字日三量兒大小與服治胎驚風癇啼叫用全蠍一枚以生薄荷四葉裹之線扎定火上炙燥為末分作四服或入麝香硃砂少許麥門冬湯下若大人風痰作一服又方用仙人杖安睡處身畔此杖即筍欲成竹時立死者變蒸發熱治小兒變蒸與傷寒相似但上唇中心有白點子者為變蒸用麻黃去節大黃杏仁各一分燒灰存性為末每服一字水半盞煎服抱兒於溫暖處連進之有微汗身涼即瘥治小兒變蒸發熱或咳嗽痰涎鼻塞身重用人參白朮白茯苓白芍藥甘草天花粉橘梗各二錢細辛一分為末每服一錢水半盞薑一片薄荷一葉煎服治小兒發熱用郁李仁根煎湯浴洗又方用苦參煎湯浴洗又方用白芷煮湯浴之避風治小兒熱渴不止用葛根半兩水一盞煎六分去滓溫服治小兒五心煩熱渴欲飲水者用黑豆水煮熟與食之並飲汁即愈急慢驚風治小兒急慢驚風用乳香甘遂等分為末每服半錢乳香湯調下或童便調亦妙又方用牛黃一錢水研細先以蛇蛻一分水一盞煎半盞濾去滓調牛黃服五歲以上倍服又方用冷坑中糞清水一呷與之服即愈又方用青礞石磨水灌服又方用青礞石末一兩焰硝一兩同入甘鍋內炭火煅通紅須消盡為灰候冷如金色研為細末急驚風痰發熱者薄荷自然汁入蜜調服慢驚脾虛者以青州白丸子碾煎稀糊入熟蜜調下神效治小兒驚風用猢猻糞燒灰存性碗覆地上出火毒為末生蜜調少許灌之又方用白殭蠶蠍梢等分天雄尖附子尖共一錢炮為末每服一字或半錢以生薑溫水調灌之又方用苦丁香黎蘆等分為末每服半錢溫酒調下治小兒急驚壯熱上壅痰涎大便不通用鬱金雄黃各一分膩粉半錢為末醋糊丸如黍米大一歲二丸薄荷湯臘茶清下又方用大黃朴硝各二錢為末每服一字溫茶清或冷水調下又方用生薑自然汁百沸湯和服亦效治小兒慢驚風用白殭蠶全蠍各三枚微炒為末每服一字煎麻黃湯調下又方用輕粉硃砂不拘多少為末七月初五日取青蒿研汁丸如粟米大一歲以下服一丸二三歲服二三丸乳汁送下亦治急驚風又方用北棗陳皮濃煎湯服又方用烏藥磨水暖熱與服治驚風痰嗽時作潮熱用南星二兩天竺黃半兩雄黃辰砂各一分別研麝香一錢別研為末煉蜜丸如芡實大甘草薄荷湯化下一丸又方用南星半夏各半斤米泔水浸南星一二日半夏五七日以透為度洗淨曬乾切作片生薑自然汁浸一日夜洗出曬乾濃皂角水浸一日夜洗出曬乾明礬水浸一日夜洗出曬乾朴硝水浸一日夜洗出曬乾為末每末三兩入硃砂一兩麝香半錢滴水研丸如雞頭肉大驚風金銀煎湯化下有熱薄荷煎湯化下咳嗽人參或五味子煎湯化下冬月加川烏夏月加硼砂尤妙治小兒驚邪用燕窩屎煎湯浴洗良治小兒熱驚客杵用驢乳與飲治小兒壯熱驚癇用李葉煎湯浴洗治小兒驚癇迷悶嚼舌仰目用牛黃一大豆許研和蜜水服之治小兒驚癇用熊膽兩大豆許和乳汁及竹瀝服得去心中涎良治小兒驚癇疳痢用虎膽研水服之治小兒胎風手足搐搦用蚤休為末即紫河車又名金線重樓每服半錢冷水調下治小兒未滿月驚似中風欲死者用硃砂為末新汲水調塗五心上立效治小兒驚癇寒熱用鉤藤甘草炙各二分水二盞煎半盞日夜溫服大良又方用羚羊角燒灰為末酒調或乳汁服治小兒急慢驚風用硃砂一豆粒大殭蠶全蠍各一枚為末乳汁調塗兩太陽穴並五心舌上治小兒牙關不開用南星煨熟紙裹不要透氣剪雞頭大一竅透氣於鼻孔中牙關立開治小兒並大人噤口風用不蛀皂角炙去皮子蘿蔔或子共研為末米醋調以雞翎蘸塗牙齦上即瘥治驚風手足搐搦涎潮上壅用川烏生去皮臍一兩全蠍十個去毒為粗末作三服水一盞薑七片煎七分溫服治小兒百日左右恐被風吹囟門用麝香蠍尾去毒薄荷葉牛黃青黛末各一字匕以熟棗肉和成膏新綿上塗勻貼於囟上四方可出一指許火上炙手頻尉封之無患囟亦易合治小兒解顱不合即囟門用蟹螯足及白蘞各半兩為末乳汁和貼骨縫上或生搗爛塗亦得中惡天吊治小兒卒中惡毒心腹刺痛腹皮青黑不能喘息悶亂欲死用女青末內口中並治吐痢卒死酒服亦治大人又方急服蘇合香丸及用皂角末吹鼻內又方用降真香白膠香沉香虎頭骨炙鬼臼龍膽草人參茯苓雄黃各半兩麝香一錢為末煉蜜丸如芡實大乳香湯下一丸及令兒佩帶並燒臥房內尤妙治辟惡魅用虎爪懸小兒臂上治小兒蘊熱痰塞經絡頭目仰視名為天吊用金牛即蟬殼以漿水同煮一日曝乾為末每用一字冷水調下又方用雄黃別研甘草炙荊芥穗炒白礬煅臘茶等分為末每服半錢至一錢人參湯或薄荷湯調下仍量大小加減服又方用鉤藤人參犀角屑各半兩甘草炙全蠍天麻各一分為末每服一錢水半盞煎三分溫服風癇治小兒癇熱煩悶發溫用屋遊即屋上青苔煮汁服之立效治小兒風癇熱癇用細辛大黃炮防風各三分甘草炙犀角屑各半分水半盞煎服治小兒風癇用全蠍五枚大石榴一枚剜去蓋並子以蠍放在內仍蓋之紙泥固濟微火炙乾漸加火燒令通赤放冷去泥取石榴為末每服半錢或一錢乳汁調灌之立愈兒稍大用防風煎湯調下又方用鱉甲炙黃為末每服一錢乳汁調下亦可丸如小豆大每服三丸乳下治小兒諸癇用白朮蜜浸厚朴以甘草水煮焙乾各一分附子去皮臍犀角鎊末各一錢全蠍七個每個以薄荷葉裹定卻將麻黃湯泡軟纏縛慢火炙黃為末取竹瀝為膏丸如黑豆大每服一丸金銀薄荷湯化下隨兒大小加減治小兒癲癇及婦人心風諸疾用甘遂末一錢豬心一個取三管頭血三條和甘遂末將豬心批作兩片入藥在內用線縛定濕紙包裹慢火煨熟不可過度取藥細研辰砂末一錢和勻分作四丸每服一丸豬心煎湯化下再服別取豬心煎湯極效治小兒胃寒蟲上諸證危惡與癇相似用乾漆燒煙盡白蕪荑等分為末米飲調下一字至一錢治小兒發熱驚癇毛焦疳痢羸瘦用青黛末蜜水調方寸匕服治癇疾愈後復作用黃耆蜜塗炙鉤藤鉤子細辛甘草炙各半兩蛇蛻皮二寸酒炙蟬殼四個洗去土牛黃一字別研