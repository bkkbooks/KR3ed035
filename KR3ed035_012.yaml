名爛瘡用桃仁搗和麵脂敷治小兒熱瘡用亂髮如梨大一團雞子黃煮熟共置銚內炭火上熬初干發焦液出𦚼取液盡為度以此液敷瘡即以苦參末摻之治小兒壯熱一切瘡疥皮膚瘙癢用楸梓白皮煎湯洗治小兒疳瘡久不愈多生於面部兩耳前令乳母口中嚼白米成膏塗之不過三五上則愈小兒並乳母皆忌雞豬魚兔酒醋動風發熱之物治小兒頭瘡用蓼實搗末和蜜或雞子白塗上蟲出不作瘢治小兒浸淫瘡疼痛不可忍發寒熱用小薊末新水調敷干即易治小兒軟癤用霜打不落干桃子為末油調敷治小兒一切濕瘡疳瘡用黃連黃柏各半兩為末黃丹一兩火飛輕粉一錢麝香一字別研和勻先以溫水洗然後貼之治濕癬瘡用蛇床子為末先以韭菜根煎湯洗次用臘月豬脂調藥敷之蟲痛疝氣治小兒腹內有蟲疼痛用苦楝皮二兩白蕪荑半兩為末水一盞末一錢煎二分放冷待發時服之治小兒蟲咬心痛欲絶者用五靈脂末一錢匕飛白礬末半錢匕水一盞煎服不拘時當吐出蟲即愈治諸蟲作痛用白蕪荑乾漆炒煙盡等分為末每服一字米飲調下臨發時服又方用乾漆炒煙盡二分雄黃一分為末麵糊丸如黍米大量兒大小與服以東向石榴根煎湯下或苦楝根或蕪荑煎湯皆可治因疳生蟲五心煩熱用蕪荑黃連神麯炒等分為末麵糊丸如黍米大空心米飲下治一切疳蟲攻刺心腹疼痛用胡粉炒鶴蝨檳榔苦楝根各一兩枯白礬三錢為末麵糊丸如麻子大量兒大小加減米湯下治小兒陰囊熱腫痛用蚯蚓糞甘草汁調塗治小兒並男婦陰腫燥癢用桃仁搗爛敷之治疝氣用蕪花醋浸炒木香檳榔三稜炒各半兩茯苓青皮去白全蠍肉桂附子炮硇砂各一分為末先將硇砂浸洗去土頓在湯瓶上候成膏子和粳醋打麵糊丸如緑豆大每服三十丸空心溫酒下治積氣肚疼用縮砂甘草炙益智炒去殼三稜莪朮青皮去瓤炒等分為末白湯調下治外腎腫硬及陰瘡用乾地龍為末先以蔥椒湯於避風處洗次用津唾調敷治小兒膀胱蘊熱風濕相乘陰囊腫脹大小便不利用白牽牛二兩桑白皮白朮白通去節陳皮去白各半兩為末每服二錢薑湯調下空心服雜證治小兒未滿一歲其母又妊令兒精神不爽身體痿瘁名為鬾病用伏翼燒令煙盡為末每服半錢米飲調下日三服治小兒不能言用社日祭余酒內兒口中飲則速語治小兒並大人多年牙齒不生用黑豆三十粒牛糞火內燒令煙盡為末入麝少許研勻先以針挑不生齒處令血出用末少許揩不得見風忌酸鹹物又方用大芎乾地黃各半兩山薯蕷當歸芍藥甘草炙各一分為末熱湯調稠搽齒腳治小兒臍中汁出並赤腫用白礬燒灰為末敷之治小兒耵耳用硫黃為末摻耳中日一夜一即瘥治小兒白禿髮不生汁出燥痛用陳香薷三兩水二盞煎取濃汁半盞入胡粉一兩豬脂半兩和勻塗於頭上日頻敷之又方用椿楸桃葉心取汁敷之五七次大效治白禿用白頭翁根搗敷一宿或作瘡二十日愈又方用甜瓜蔓不拘多少河水浸一宿砂鍋熬取極苦汁濾去滓慢火熬成膏盛瓷器中先剃頭去盡瘡痂死血出盡以河水洗淨卻用膏一盞加半夏末三錢生薑自然汁一兩匙狗膽一枚同調不過三兩上立可大忌豬雞魚兔動風發熱之物又方用葶藶子杵爛水煎洗並塗貼黃水出三五次自效又方用雞窩中草白頭翁花燒灰為末先以酸泔水洗淨後用臘豬脂和藥塗之三五次即效又方用榆白皮為末醋調塗之有蟲出者永除根大驗治小兒食土炭黃瘦用青胡桃皮曝乾為末水糊丸如緑豆大每服五七丸溫水送下治小兒食土黃似金色用黃連水煎濃汁和愛食之土日乾與食自不食也治小兒目赤腫似桃用杏仁十四枚口內含去皮尖細嚼以新棉裹頻擠汁入眼雖痛痛止即效治小兒疳澀眼數日不開用涼膈散煎服數貼則愈治小兒火燒瘡用赤地利為末小油調塗沒瘢痕治火瘡滅瘢痕用鹿角膠末雞翎掃之治小兒頭瘡白禿用莽草葉為末蜜調塗並煎湯洗勿令入眼及與白蘞赤小豆為末雞子白調如糊貼毒腫干即易治小兒睡中遺尿用桂末雄雞肝等分搗丸如小豆大溫水下二三十丸日三服又方用羊肚盛水滿系兩頭熟煮開取水頓服之即瘥治小兒凍耳成瘡或癢或痛用黃柏白蘞各半兩為末先以湯洗瘡後用生油調塗治凍爛腳成瘡用香附子為末面水調貼之即愈治鼻衄用生蘿蔔去葉搗汁仰頭滴入鼻中或血妄行取汁飲之立效治大腸虛弱肛門脫下用龍骨訶子肉炒去核各一分大沒石子二枚罌粟殼去瓤醋塗炙二錢為末白湯點服仍用蔥湯熏洗令軟款款以手托上又用新磚一片燒紅以醋澆之氣上即用腳布疊數重壓定使磚氣上透不可過熱令病者以臀坐於布上如覺布濕遂旋減之以常得溫熱為度並常服前藥治小兒通身浮腫小便不利用長流水加燈心煎五苓散時時灌之更於避風暖處頻浴汗出則腫消自愈治骨痛或出膿血用水蛇皮一條燒灰油調敷治小兒疳眼赤爛用苦參蔓荊子防風龍膽草玄參等分為末豬膽糊為丸如緑豆大丸數量大小茶清下治眼生障用栝蔞根甘草赤芍藥草決明等分為末每服半錢蜜湯調下乳子詩曰養小須調護看承莫縱馳乳多終損骨食壅即傷脾衾厚非為益衣單正所宜無風頻見日寒暑順天時
