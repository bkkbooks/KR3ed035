body:
  text: 卷之三痰飲治胸中有痰瘀癖氣者用白礬一兩水二升煮取一升入蜜一合更煮少時溫頓服須臾即吐如未吐再以熱水一盞即便吐治冷痰飲噁心用蓽茇一兩為末食前用清米飲調半錢服治痰飲胸膈痞滿用大栝蔞洗淨槌碎半夏湯浸七次銼俱焙乾為末用洗栝蔞水熬成膏研為丸如桐子大生薑湯下二十丸治痰飲吐水無時用赤石脂一斤搗篩為末每服方寸匕酒飲任下加至三匕服一斤盡終身不吐痰水又不下利治膈壅風痰用半夏洗淨為末生薑自然汁和為餅子濕紙裹於慢火煨熟水兩盞用餅子一塊如彈子大入鹽半錢煎一盞溫服治風痰用鬱金一分藜蘆十分為末每服一字用溫漿水一盞先以少漿水調下余水漱口都服便以食壓之治痰涎用檳榔末白湯調二錢服治一切風痰食不消化大便澀滯用訶梨三枚搗和酒頓服三五度良治痰飲流注疼痛用大半夏二兩湯浸洗過為末風化朴硝一兩以生薑自然汁打糊丸如桐子大每服五丸薑湯下痛在上臨臥服痛在下空心服治唾如膠漆稠黏咽喉不利用旋覆花為末每服二三錢水煎時呷服即漸清利治中脘停痰臂痛難舉手足不得轉用半夏二兩茯苓一兩枳殼去穰麩炒半兩風化朴硝二錢半為末薑汁打糊丸如桐子大每服三十丸薑湯下治痰飲上氣不思飲食小便不利頭目昏眩用吳茱萸湯泡白茯苓去皮等分為末煉蜜丸如桐子大每服三十丸熟水溫酒任下治中脘氣滯胸膈煩滿痰飲不利頭目不清用生南星去皮半夏湯泡七次各五兩為末以薑汁和軟攤在篩中以楮葉蓋之令發黃色曬乾收之須五六月內做用香附子一兩炒去毛以做成曲二兩共為末水糊丸如桐子大每服四十丸食後薑湯下治胸膈停痰滿悶嘔逆噁心吐痰水用茯苓去皮二錢半夏湯洗七次三錢水一盞姜七片煎七分空心服又方用陳皮半夏等分水一盞姜七片煎七分服常服止嗽化痰養液治痰壅胸痞氣輳用黑牽牛一斤取頭末四兩皂角去皮弦酥炙黃去子一兩六錢生白礬一兩二錢為末水丸如桐子大每服三五十丸空心溫酒送下五日十日一服輕者半月一月一服久服永無癱瘓之疾治痰盛寬胸膈快氣用黑牽牛三兩皂角去皮弦二兩微燒白礬枯半夏曲炒陳皮去白各一兩為末煮蘿蔔為丸如桐子大每服四五十丸臨臥淡薑湯下治頑痰不化用石青一兩石碌半兩俱水飛為末曲糊丸如綠豆大每服一十丸溫湯下有痰即吐去一二碗不損人治痰及一切頭風用豬牙皂角炮延胡索各一錢青黛半錢為末滴水丸如桐子大捏作餅子曬乾每用一餅新水化開男左女右仰面以蘆筒鼻內灌之口咬銅錢一十五文其涎便出頭風更不再發喘急治久患肺氣喘急用杏仁去皮尖二兩童便浸一日一換夏月一日三四換浸半月取出焙乾研細每服一棗大薄荷一葉蜜一雞頭大水一盞煎七分食後溫服甚者兩劑瘥永不發忌腥物治肺燥喘熱大腸秘用杏仁一升去皮尖水一開半研取汁入生蜜四兩甘草一錢銀石器中慢火熬成稀膏瓷器盛之食後夜臥入少酥沸湯點一匙服如無上症入鹽點常服潤五臟治咳嗽喘促用鯉魚一頭重四兩去鱗紙裹炮熟去刺研爛以糯米一合煮粥將熟投魚肉合煮食治喘化痰用豬蹄甲四十九個洗淨控干每個甲內半夏白礬末各一字入罐內封閉勿令煙出火煅通赤去火細研入麝香一錢匕共研勻凡喘咳嗽用糯米飲調一錢下小兒半錢至妙治肺癰喘不得臥用葶藶炒黃為末丸如彈子大每服用大棗二十枚水三升煎取二升納一彈丸再煎至一升頓服之治上氣喘急遍身浮腫用甜葶藶一升隔紙炒紫色搗細生絹袋盛以酒五升浸三日每服抄一匙用粥飲調下日三四服治痰嗽不定喘急用桔梗一兩半搗細童便半升煎四合去渣溫服治肺氣喘嗽用馬兜鈴二兩去殼用子酥半兩和勻慢火炒乾甘草炙一兩共為末每服一錢水一盞煎六分溫呷或以藥末含咽津亦得治腹脹滿喘悶用山豆根末一錢匕煎水調服治胸滿急不能睡臥用胡桃肉五個人參等分水一盞生薑五片煎七分去渣臨臥溫服治老人久患肺喘咳嗽睡臥不得用杏仁去皮尖胡桃肉等分研為膏入煉蜜少許和丸如彈子大每服一二丸食後臨臥細嚼薑湯送下治喘嗽用白殭蠶細茶為末等分臨臥調服治齁喘用鹽梅五個古銅錢七文置碗內以滾湯浸春秋三日夏一日冬七日壯大飲一口小弱飲半口飲畢男左女右手在胸前揉搓少時必吐治積年上氣咳嗽多痰喘促唾膿及血不止用蘿蔔子一合搗碎水煎去渣食後服之大妙又方用桑條銼細煮汁服之治上氣咳嗽喘急唾濃帶血久而成勞用人參為末每服三錢以雞子清調下五更初服訖便睡去枕仰臥一服可愈多年者再服忌一切發物治胸膈脹滿上氣喘急咳嗽倚息不得睡臥用桃仁去皮炒人參桑白皮蜜炙米泔浸焙杏仁去皮炒等分每服四錢水一盞薑棗煎不拘時服治肺不足喘嗽久不已者調順氣血消化痰涎用木香防己各二錢杏仁三錢為末煉蜜丸如小豆大每服二十丸桑白皮湯下如大便秘加葶藶治熱嗽喘甚者用石膏二兩甘草五錢炙為末每服三錢新汲水下或生薑汁蜜調下治勞喘嗽不已自汗者用粟殼炒為末每服二錢入烏梅同煎水一盞食後溫服有汗加小麥三十粒治遠年近日喘嗽用粟殼蜜炒人參陳皮去白甘草炙等分為末每服一錢烏梅湯臨臥服治肺氣喘急用薤白研汁飲之治肺氣不利咳嗽上喘用紫團參款冬花紫菀茸等分為末每服二錢水一盞烏梅一個同煎七分空心溫服治上氣喘急不得臥者用陳皮桔梗紫蘇五味子人參等分每服四錢水一盞煎六分食後服治七情鬱結上氣喘急用人參沉香檳榔烏藥各濃磨水取七分盞煎三五沸溫服咳逆治噦欲死用半夏生薑各一兩水二盞煎八分去渣分作二服輕者以虛誑之事誣之或以紙捻搐鼻即止治吃噫用川椒為末和生面丸如桐子大醋湯吞二十丸治噦用柿蒂七枚水一盞煎半盞服治吃噫用陳皮二兩浸去瓤枳殼一兩去瓤炒水一升煎五合頓服效治胃膈痞滿咳逆不止用柿蒂丁香各二錢水一盞姜五片煎服不拘時治咳逆噎汗用柿蒂丁香各一錢甘草炙良薑各半錢為末熱湯點服不拘時治吐利後胃虛膈熱而咳逆者用陳皮去白二錢人參甘草炙各一錢竹茹一小塊生薑五片棗二枚水一盞煎七分溫服不拘時治噦用陳皮通草乾薑桂心甘草炙各一錢人參半錢水一盞煎六分溫服治久患咳噫連咳四五十聲者用生薑汁半合蜜一匙煎熟溫服三服立效治病者咳噫用良薑為末水二盞煎六分入少醋更煎一兩沸溫服立效治卒客忤停口不能言用細辛桂心等分內口中治上氣咳逆及冷氣腰腳中濕風結氣用紫蘇子研汁煮粥食甚良治乾嘔噦手足厥冷用橘皮四兩生薑半斤銼碎水七盞煎至三盞去渣溫服一盞諸氣治氣不升降用大附子一枚炮作二服水一盞煎別用水磨沉香臨熟入藥內熱服治氣壅上用赤小豆和通草煮服之當下氣無限治腹中結伏氣用杏仁陳皮桂心訶梨勒皮等分為末丸如桐子大空心服三十丸無忌治伏梁氣結聚在心下不散用桃奴即樹上不落干桃三兩為末每服空心溫酒調二錢匕服治三焦氣不順胸膈壅塞頭目昏眩涕唾痰涎精神不爽用牽牛四兩半生半熟不蛀皂角塗酥二兩為末薑汁煮糊丸如桐子大每服三十丸荊芥湯下治氣不接繼氣短用蓬莪朮一兩金鈴子去核一分為末入硼砂一錢煉過研細和勻每服二錢鹽湯或溫酒下空心服兼治滑泄治膈下冷氣或酒食飽滿常服用青橘皮四兩湯浸一宿去穰入鹽七錢拌勻炒焦為末每服一錢半茶末半錢水一盞煎七分溫服如不用茶沸湯點亦妙治常患氣用訶梨勒三枚濕紙裹煨紙干剝去核細嚼以生乳汁一升下日三服治氣結者用郁李仁四十九粒酒吞下得瀉尤良治上氣急滿坐臥不得用鱉甲炙黃一兩細搗燈心一握水二升煎取五合食前調一錢匕服食後蜜水調一錢匕服治心腹俱脹痛短氣欲死用烏梅二七枚水五升煮一沸入大錢二七枚煮取二升半壯人頓服羸人分再服治食氣遍身黃腫氣喘心胸滿悶不思飲食用皂角去皮子塗酥炙焦為末一錢匕巴豆七枚去油以醋磨好墨丸如麻子大每服三丸食後陳皮湯下日三服隔一日增一丸以利為度治心腹脹滿短氣用草豆蔻一兩去皮為末以木瓜生薑湯調下半錢治氣不升降胸膈痞塞喘促短氣及脾胃留飲噫酸用香附子三兩去毛甘草二兩炙縮砂一兩沉香半兩為末每服二錢入鹽少許沸湯點服治挫喉氣不通用冷水徐灌數口治挫氣腰痛用清茶滴入香油數點頓服治心腹虛氣鬱郁膨悶不食用茯神去皮為末煉蜜丸如桐子大每服七丸溫酒送下日三服亦治邪魅治心脅下虛氣脹滿用陳皮為末服或作丸服氣自消散又方用紫蘇子為末隨食服之氣亦散治上氣肩息用麻黃四兩去根節杏仁二十枚去皮尖炒同為末溫水調下二錢匕治毒氣遊易在皮膚中流轉不出用白楊枝細銼酒漬服之不拘時治膜肉氣及氣塊用延胡索為末以豬胰一具切作塊子炙熟蘸末食之治走氣疼用蒼朮杏仁各二兩草烏一兩俱用好醋浸春五夏三秋七冬十日陰乾為末虎骨五錢乳香沒藥各兩錢半別研為末和勻醋糊丸如桐子大每服十丸溫酒送下又方用粟殼一兩蜜炒虎骨酥炙陳皮各五錢乳香沒藥甘草各二錢半為末每服三錢熱酒一盞調下在上疼食後服在下疼食前服治男女多年氣積氣塊氣喘氣痛腎氣腳氣冷氣血氣走注氣及諸般氣疾傷酒傷食心腹膨脹用白芨乾薑各半斤巴豆二兩連殼用斑蝥半兩炒巴豆變色卻下乾薑白芨同炒候姜微黑色取出揀去斑蝥將三味為末滴熱水為丸如綠豆大每服十丸五更冷鹽湯吞下小兒五丸兩服除根孕婦勿服極效疝氣治小腸氣用炒鹽及茴香二包不住手更換熱熨治小腸氣臍腹攪疼陰中疼悶不省人事用茴香鹽炒枳殼各一兩沒藥半兩為末每服一錢熱酒調下並二三服治腎氣衝脅如刀刺痛喘息不得用茴香莖葉生搗汁一合熱酒一合服亦理小腸氣治腎臟風壅積腰膝沉重用威靈仙末蜜丸如桐子大初服溫酒下八十丸平明微利惡物如青膿桃膠即是風毒積滯也如未動夜再服一百丸取下吃粥補之治腎臟膀胱連小腸等氣用楝實一百個溫湯浸去皮巴豆二百個槌微破麩二升銅鍋內共炒楝實赤熟為度去核為末每服三錢熱酒或醋湯調服麩巴不用治腎腰腳無力用生慄袋盛懸干每早吃十餘個次服豬腎粥治腰痛膀胱氣腎疼用橘核炒去殼為末酒調方寸匕服治膀胱氣急宜下氣用蕪荑搗和食鹽等分以綿裹如棗大內下部或下惡水下氣佳治諸疝小腹及陰中痛汗出欲絕者用沙參搗末酒調方寸匕服立瘥治膀胱氣用葫蘆巴茴香桃仁麩炒去皮尖等分為末酒糊丸如桐子大半為散每服五十丸空心食前鹽酒下散以熱米飲調下與丸相間空心服日各一二服甚效又方用木賊末湯調二錢空心服治寒疝心腹脅痛用大烏頭五枚去芒角皮四破用白蜜一斤煎令透潤取出焙乾為末又以熟蜜丸如桐子大冷鹽湯下二十丸或就用蜜水煎服治寒疝心痛四肢逆冷全不欲食用桂心為末熱酒調一錢匕服不拘時治小腸氣痛不可忍者用烏藥搗碎酒浸一宿良薑舶上茴香青皮去白各一兩為末每服兩錢發時熱酒調下治疝氣用川芎青皮去白茴香牽牛炒桃仁各半錢無灰酒一盞煎八分溫服治七疝心腹冷痛腸鳴氣走身寒自汗腑滑用木香不見火一錢玄胡索炒去皮附子炮去皮臍各一錢半水一盞姜七片煎七分溫服不拘時治久逆小腹疝氣臍下疼痛外腎偏