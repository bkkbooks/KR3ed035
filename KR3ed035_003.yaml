食之治腳氣及風藥必用蚯蚓為使即效治腳氣用赤小豆和鯉魚煮食甚良治患腳疾豉浸酒飲渣敷腳即瘥治腳氣十二風不能行用松葉六十斤銼細水四石煮取四斗九升以釀五斗米如常法別煮松葉汁以漬米並饋飯泥釀封頭七日發澄飲之取醉不過二劑便能行遠治腳轉筋疼攣急用松節二兩銼如米粒乳香一錢銀石器內慢火炒焦留一分性出火毒研細每服一錢至二錢熱木瓜酒調下應是筋病皆治之治腳氣連腿腫滿久不瘥用黑附子一兩去皮臍生為末薑汁調敷腫上干再塗腫消為度治腳氣腫滿用杉木或節煮汁將浸甚效治腳軟用商陸根細切如小豆大煮熟入綠豆同爛煮為飯每日煮服以瘥為度其功最效治腳氣從足至膝脛腫滿連骨疼或不仁者用蓖麻子葉切蒸薄裹二三易即消又方用蒴藋根銼和酒醋共三分根一分合蒸熟封裹腫上二三日即消亦治不仁治風毒腳氣若脛已滿捻之沒指者用牽牛末蜜丸如小豆大每服五丸生薑湯下取令小便利治風軟腳用丹參浸酒服可逐奔馬治腳氣壅毒水腫浮氣用沙牛尿一盞磨檳榔一枚空心暖服治腳氣非冷非熱老弱人脹滿者用檳榔為末茶飲或豉汁調服方寸匕治腳氣浮腫心腹滿大小便不通氣急喘息用郁李仁十二分搗碎水研取汁薏苡仁杵碎如粟米三合以汁煮作粥空腹食之治腳氣及脅有塊用杉木節一升橘葉一升皮亦可檳榔七枚銼碎童便三升煮一升半分兩服若一服快利即停後服治腳氣衝心用白礬二兩水一斗五升煎三五沸浸洗治腳氣用無名異末化牛皮膠調勻貼痛處治腳氣用桃花一升日乾為末溫酒調細細呷之一宿消腫若腎氣膀胱宿水惡下安藥輕快治腳氣毒攻手足用吳茱萸六升木瓜三枚水一斗煎三升分三服或吐或汗即愈治腳氣攻心用半夏生薑水煮汁溫服又方用檳榔末三匕蔥白一握童便二升浸蔥熟去蔥下藥末攪勻溫服立瘥治腳弱無力用生慄為末食或風乾食之又方用好硫黃三兩黃牛乳五升先煮沸下硫黃煮取三升每服三合無時或煎稠丸如桐子大每服五七丸溫酒下汗出效治腳脛風搐用烏頭一兩炮裂附子二兩炮麻黃四兩去節為末煉蜜丸如桐子大每服五丸空心酒下日三服忌熱物治腳氣入腹喘急欲死用吳茱萸湯洗木瓜去瓤切片日乾等分為末酒糊丸如桐子大每服五十丸至百丸酒飲任下或以木瓜蒸爛研膏為丸尤妙治一切寒濕腳氣腿膝疼痛行步無力用葫蘆巴酒浸一宿焙乾破故紙炒香各四兩為末以大木瓜一枚切頂去瓤置藥在內以滿為度復以頂蓋之用竹籤簽定蒸熟爛研用余末和丸如桐子大每服五十丸空心溫酒下治風濕腳氣用麻黃去節炒姜蠶炒斷絲各二兩乳香沒藥別研各五錢丁香一錢為末每服一兩用酒一碗調服取醉蓋覆得汗即愈曾經蒸漬者難愈治一切腳氣用木鱉子每個作兩邊麩炒畢切碎再炒以皮紙漻盡油每一兩用厚桂一兩同為末熱酒調服以醉為度蓋覆得汗即愈治腳氣止痛用蓖麻子七粒去殼研爛同蘇合香丸打糊貼腳心痛即止又方用草烏以麴酒糟搗爛貼痛處即止如無糟薑汁調末貼亦可治腳氣頭面浮腫心腹脹滿小便澀少用馬齒莧和少粳米醬汁煮食之治風濕腳氣用川烏石亭脂各一兩俱生用無各異二兩為末以蔥白搗爛絞汁丸如桐子大每服一錢重空心生蔥淡茶吞下一日止一服又方用草烏白芷防風獨活羌活等分為末好米醋調敷患處治腳氣赤腫行步作疼用貓兒眼睛草鷺鷥藤蜂窩等分每服一兩水五碗煎三碗熱熏洗治腳氣及筋骨疼痛用鷺鷥藤即金銀花為末每服二錢熱酒調服或銼碎同木瓜白芍藥官桂當歸甘草酒水各半盞煎八分去渣空心食前熱服治腳膝筋急痛用酒煮木瓜爛研膏裹痛處冷即易一宿三五度熱裹便瘥腰腎腳膝無力木瓜不可缺五痹治皮膚麻痹瘙癢用莽草煎湯浴洗治腰腳痹緩急行履不穩用萆薢三兩杜仲一兩為末每日溫酒服三錢匕增至五匕忌牛肉治頑麻風癬用多年豬脂入百草霜搗成膏令患者浴淨將醋敷身上以刀微刮皮破用藥敷之治痹癖用大黃芒硝末以大蒜共搗成膏貼硬處又方用姜蠶為末以白馬尿調服即消治十指疼痛麻木不仁用附子木香等分三錢姜三片水一盞煎七分服足弱去附子用烏頭治手足麻痹用川烏木鱉各八兩黑豆三合乾地龍五兩松墨二兩醋炒為末五靈脂醋研煮麵糊丸如龍眼大每服一二丸細嚼熱酒或薄荷湯下不拘時治遍身麻痹用黃耆一兩人參白芍藥各五錢附子一個當歸三錢為末煉蜜丸如桐子大每服三五十丸又方用生川烏白朮白芷各三錢甘草二錢為末每服一二錢溫酒調吞上丸藥五疸治黃疸用柳枝一束水一斗煮濃汁半升頓服盡又方用麻黃一握去節以好酒五升煮半升頓服又方用藜蘆炮變色為末水服半錢小吐不過數服又方用小麥苗杵絞汁飲六七合晝夜三四次飲之三四日可愈一方用小麥搗水絞汁服一合頓服甚驗又方用糯稻穰煮汁浸之又用稻芒炒黃為末酒調服又方用東引桃根細切如箸一握水一升煎八分溫空腹頓服勿令婦人雞犬見三五日後黃漸退百日方平復仍要時時飲酒一盞則黃易散不飲則散遲忌食熱面豬魚等肉治黃疸遍身如金色用青甜瓜蒂四十九個須六月六日採者丁香四十九個以甘鍋子燒煙盡為度研末用一字吹鼻中及揩齒仍令深吸取鼻出黃水立瘥小兒吹半字又方治陰黃黃疸暴急黃用瓜蒂丁香赤小豆各七枚為末吹鼻中一黑豆許少時黃水出瘥治男婦黃疸病耳目悉黃食欲不消胃中脹熱生黃衣乃臟中有干屎以豬脂煎一升頓服日三下燥屎乃愈豬膏忌烏梅治時行黃病用葵葉煮汁飲之治急黃疸及內黃腹結不通用蕪菁搗絞汁服當得嚏鼻中出黃水及下利愈又方搗蕪菁子和水服少頃當瀉一切惡物沙石草發並出治急黃病用大黃二兩銼細水三升半漬一宿旦煎絞汁一升半入芒硝二兩絞服須臾當快利又方用山茵陳二斤水一斗煎五升分服一升日三服夜一服又方用雀通二枚冷水研服即效又方用絲瓜蓮子燒灰為末因面得病麵湯下因酒得病酒調數服可愈治黃腫用百草霜一升炒面半升綠礬四兩為末糖丸如桐子大每服三四十丸薑湯米飲任下極效治黑疸黃變黑者多死用土瓜根五兩水三升煮一升去渣頓服重者晚更一服若生者一斤搗絞汁頓飲尤好水隨小便出治五般疸用秦艽六兩牛乳二升煮一升去渣溫頓服兼治痞腹硬如石又方用豬脂八兩亂髮如雞子大二塊同煎臨服攪去發分二服病從小便出又方用血餘灰三錢冷水調下日三服無時又方用大黃葶藶等分為末煉蜜丸如桐子大每服十丸食前冷水下日三服又方用雞子一枚連殼少擊破燒灰為末以醋一合調服無時不過三枚蟲從鼻中出治谷疸用苦參三兩龍膽草一兩為末牛膽一個入少煉蜜丸如桐子大每服五十丸空心熱水或生薑甘草湯下治酒疸用枳實去白麩炒梔子葛根各二兩豆豉一兩甘草炙半兩銼細每服四錢水一盞煎八分溫服不拘時治女勞疸用滑石錢半枯白礬一錢以大麥粥飲調下以小便利出黃水為度治時行熱病鬱蒸發黃用茵陳大黃各錢半梔子一錢水一盞煎八分溫服不拘時治病後發黃如金色心滿堅硬腳手心熱用苦丁香末一錢膩粉半錢攪勻作二服以新汲水調下吐出黃水愈治黃疸用苦葫蘆瓤如棗子大童便二合浸半日取兩酸棗許內兩鼻中令深吸氣黃水自出治面目黃強力止困用苦蕒服之治五般急黃用山豆根末兩錢空心水調服治黃腫用明亮綠礬一斤下鍋熔成汁次下多年黃陳糙米四斤慢火煮炒約一時許煙盡為度莫炒枯了取攤地上出火毒為末另用蒼朮一斤二兩米浸一晝夜刮淨銼曬乾為末一斤入前末和勻陳醋打糊丸如桐子大每服七八十丸酒送下陳米湯亦可早晚空腹各一服忌糯米麵食生冷立效
