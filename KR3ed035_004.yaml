用仙人杖燒為末每服方寸匕又方用桑耳作羹空心下飯飽食之日三次食待孔卒痛如鳥啄取大小豆各一升合搗作兩囊盛蒸熱更互坐之即瘥治腸痔大便常下血用槐上木耳為末米飲調方寸匕服日三度又方用羊蹄根葉爛蒸一碗食之立瘥又方用蒲黃方寸匕日三服又方用木賊枳殼各二兩乾薑一兩大黃一分四味並銼一處炒黑為末溫米飲調二錢匕食前服甚效治痔有頭如雞冠者用黃連末敷之或加赤小豆末尤良治外痔用萹蓄搗汁餿面作餺飥空心吃日三度常吃效治痔瘻瘡用馬兜鈴於瓶中燒熏病處治痔穀道中蟲癢不止用水銀棗膏各二錢同研捻如棗形薄綿裹內下部明日蟲出又方用槐白皮濃煮汁安盆坐湯之虛其穀道冷更暖良久欲大便當蟲出不過三度愈或用末綿裹內下部治野雞痔下血腸風明目用槐葉一斤蒸如茶法研作末如茶煎呷之治痔頭出或痛不可忍用枳殼於煻灰中煨熱微尉盡七枚立定發即尉之治五痔不以年月久新用枳殼末煉蜜丸如桐子大空心米飲下二十丸治痔漏用萆薢貫衆等分為末每服二錢空心食前溫酒調服治野雞痔用槐柳湯洗便以艾灸七壯以知為度治痔瘡用簷邊蜂窩煅過為末以無根水調塗患處又方用河邊水漂出柳樹赤須煎湯洗極妙又方用大甘草八寸以長流水一碗蘸炙務要炙一碗水乾銼細酒水各一盞煎至一盞空心服又方用田螺一個挑開掩入片腦一分過一宿取螺內水搽瘡先用冬瓜瓤煎湯洗淨搽又方用油麻花入在豬白腸內縛定兩頭鍋內炙熟放冷切片蘸平胃散服效又方用茅花舊棕櫚燒煙燻之又方用蒼耳子焙乾為末每服一二錢空心溫酒或蜜湯調下治痔漏用蒼朮二兩地榆兩半皂角一兩去皮子為末水糊丸如桐子大每服五六十丸空心細嚼糟薑溫酒送下又方用五倍子為末每十分鐘入龍骨末一分先煎蔥椒飛鹽湯洗淨用芭蕉葉剪如小錢大蒸熟以藥末少許鋪勻錢上以肛門封坐良久黏住明日如前再貼五七日可效仍多用冬瓜瓤煎湯熏洗永不發桑藥薄油紙亦可為錢又方用苦葫蘆霜打過乾菜葉共煎湯洗又方用明礬一小塊於鏽鐵上蘸陳米醋濃磨下卻將槐柳桑條朴硝煎湯溫洗挹干敷前磨汁一夜敷五七次數夜可愈忌酒炙爆辛辣熱物又方用蠶故紙每用張半碗內燒灰存性為末酒調服又方用胡荽子研爛每服三錢熱酒調下瘡以河水洗又方用獨蒜一個搗如泥以軟帛包裹捺入穀道中坐定覺疼良久愈須在僻靜處治治痔漏脫肛用川椒目二錢空心水送下治痔漏用艾灸對臍背脊男三壯女四壯又方用枳殼為末每服二錢水二碗沙瓶內煎百沸先以熏蒸而後洗之又方用蝸牛一枚麝香少許以小砂盒子盛蝸牛麝香摻之次早取汁塗患處又方用蒲黃一兩血竭半兩為末每用少許貼患處治肺熱肛門腫塞生瘡用白蜜一斤豬膽一枚相和微火熬令可丸作三寸梃塗油內下部臥令後重須臾通泄治五痔用山豆根水磨服治年久痔不瘥用熊膽塗神效治痔有蟲用莨菪根寸餘濕紙裹煻灰煨熟臥時蜜塗內下部痔蟲皆出治痔瘡作疼用漆草三兩葉揉軟擦在痔疼處少坐片時即愈治痔疾腫痛用虎耳草曬乾入馬子內燒薰五七次瘥治外痔用白頭翁草一名野丈人以根搗細貼之逐血止痛主瘟瘧癥瘕癭氣金瘡鼻衄治痔痿有頭用芫花入土根洗淨木臼搗以少水絞汁於銀銅器內慢火煎成膏將絲線於膏內渡過系痔系時微痛候心燥痔落時以紙捻入膏藥於竅內永除根又方有痔人宜常食棐子治五痔用米泔待酸飲之治腸風痔漏用千年石灰二兩川烏一兩炮為末酒糊丸如桐子大每服十五二十丸空心溫酒下日二服忌熱物又方用白芷米泔浸一宿切片焙乾為末每服三錢食前酒調下又方用皂角去皮子蜜炙為末米糊丸如桐子大每服二三十丸食前米飲吞下又方用朴硝井花水調洗或用蜜和硝調擦又方用銅青密陀僧各一錢麝香少許為末津液調搽之治痔突出坐立不便用韭菜煎湯熏洗又方用西瓜煮湯熏洗又方用生薑片置瘡上以艾炷灸二壯黃水即出自消治痔漏下血不止用紫皮獨蒜十個大椒六十粒豆豉四兩共搗爛丸如彈子大空心嚼一丸鹽湯下日三服治痔漏下血癢痛用槐花炒枳殼去瓤各一兩為末醋糊丸如桐子大每服二十丸空心食前米飲湯下十服見效治痔漏用白牽牛頭末四兩沒藥一錢為末如欲服藥先一日休吃晚飯明日空心將獖豬精肉四兩燒令香熟薄批摻藥在內裹之細嚼吃盡以麵餅壓之取下膿血為效量病大小虛實加減服之忌油膩濕面酒色三日一服必效又方用黑白牽牛共一合炒黃為末豬肉四兩切碎炒熟與末拌勻只作一服以新白米飯二三匙壓之取下白蟲為效又方用鯉魚鱗二三甲以薄綿繭裹如棗核樣內之痛即止又方用荊芥槐花等分為末水煎一大碗服或作丸服亦好又方用豆豉炒槐子炒等分為末每服一兩水煎空心服又方用鳳眼草赤皮蔥花椒搗碎漿水滾過置盆內令熱氣熏痔但通手即洗之不過數次可愈治痔瘡用信甘草白礬生用為末以碗一隻先將信末鋪一層甘草末一層礬末一層用火煅之依前鋪藥煅三次掃下為末冷水調敷瘡上微疼飲酒以醉為度經宿其瘡自脫亦治惡癬又方用白礬緑礬朴硝各一兩信乳香沒藥各半錢麝香少許為末用銅鐵鍋先以信置鍋底以白礬覆之次下緑礬卻下硝覆候成水投乳沒末攪勻曬乾如石取置地上出火毒一宿為末方入麝加片腦少許以唾調塗瘡上四邊一日三次痔自焦落又方用枳殼水浸去瓤每二片用巴豆一粒在內線縛於銀石器內米醋高一指煮乾去豆焙為末醋糊丸如桐子大每服十五丸空心茶清送下又方用木通黃芩黃柏黑豆煎湯熱洗又方用荊芥煎湯頻洗又方用枯痔藥後恐大便難下用大黃濕紙裹煨枳殼去瓤當歸蜜煉等分為末蜜丸如桐子大每服二三十丸白湯下又方用藥後小便赤澀者用生地黃一錢黃芩二錢加滑石甘草燈心水一盞煎七分溫服又方用枯痔藥後大小便間疼如針刺及痛上腎根將衣物火上烘之熱尉痛處三五次立止又方用甘草煎湯時常沃洗或癢或痛者尤宜洗之脫肛治脫肛用梁上倒挂塵鼠糞桶內燒煙燻之又方用石灰炒熱以故帛裹坐其上冷即易之又方用死鱉頭一個燒灰為末敷肛上手按之又方用緑桑螺燒灰豬脂和敷立縮亦可生作末敷已上俱先用白礬蔥椒煎湯浴洗拭乾敷又方用女萎切作片燒熏之又方用枳實石上磨光著柄蜜塗炙暖更易尉肛縮即止又方用蝟皮一個燒存性磁石煅等分桂心各半兩為末每服二錢空心米飲調下治婦人陰脫加鱉頭一枚燒灰研入又方用香附子荊芥穗等分為末每服三匙水一碗半煎熱淋洗又方用五倍子為末每用三錢入白礬一塊水二碗煎洗立效又方用木賊燒存性為末糝肛門上按入即愈又方用浮萍為末干貼患處又方用槐花槐角等分炒黃為末以羊血蘸藥炙熱食之以酒送下或以豬膘去皮蘸藥炙服亦可又方用紫背蕺一握又名魚腥草研如泥先用朴硝水洗淨肛門用芭蕉葉托入卻用藥於臀下貼坐自然收入治穀道赤腫用杏仁熬作膏敷之治脫肛用卷柏為末干敷之自上又方用甑帶燒灰為末敷之亦妙又方用蔓陀羅花子連殼一對橡碗十六個搗碎水煎三五沸入朴硝熱洗其肛自上治脫肛痔漏用胡荽子一升粟粳半升乳香少許和勻先泥成爐子上留一小眼可抵肛門大小將藥於爐內燒之以肛門對爐眼熏炙則愈諸淋治五淋用苧根兩莖打碎水一碗半煎取半碗頓服即通大妙又方用虎杖為末每服一錢米飲調下不拘時又方用石決明去粗皮甲研細如有軟硬物淋即添朽木細末熟水調二錢匕服又方用石燕子七個搗如黍米大新桑根白皮三兩銼如豆粒勻作七帖用水一盞煎半盞去渣溫服空心午前至夜各一服又方用赤芍藥一兩檳榔一個麵裹煨為末每服一錢水一盞煎七分空心服治熱淋用白茅香根四個銼細水一斗五升煮取五升令冷仍暖飲之日二服又方用赤小豆三合慢火炒熟為末煨蔥一莖細切暖酒調二錢匕服又方用乾地黃木通甘草等分銼細每服三錢水一盞竹葉少許煎六分溫服不拘時治血淋用麻根十枚水五升煮二升一服血止神效又方用鱘魚煮汁飲之良其鮓多食令人少氣發瘡動風與筍乾同食患癱緩風心痛腰痛小兒食結癥瘕及嗽治石淋用石首魚頭中石枕磨服亦燒灰米飲調下又方用螻蛄七枚鹽二兩同於新瓦上鋪蓋焙乾研末溫酒調一錢匕服之即愈又方用桃膠如棗大夏以冷水三合冬以湯三合和為一服日三常下石石盡即止又方用胡桃肉一升細米煮漿粥一升相和頓服即瘥又方用獼猴桃並藤汁服又方用車前子二升以絹囊盛水八升煮三升服之須臾石下治淋用黃芩四兩袋貯之水五升煎三升分三服治小便赤少莖中澀痛用冬麻子一升水一升研濾取汁和米三合煮粥著蔥椒薑豉空心服又方用紫草一兩為末食前井水調一錢匕下治小便淋澀或有血用赤根樓蔥近根截一寸許安臍中上以艾灸七壯治卒患諸淋小便赤澀遺瀝疼痛用三葉酸漿草淨洗研絞自然汁一合酒一合攪勻暖空心服之立通又方治血淋熱淋用酸漿草搗汁入蜜同服治下焦結熱小便淋閉作痛有時尿血用甘草炙三錢瞿麥穗一錢梔子去皮炒半錢水一盞薑三片蔥三根燈心三十莖煎服治淋病熱痛並小便小利用竹園荽曬乾為末每服一二錢空心食前用蜜水調服立效治五淋用船底青苔如雞子大水一盞煎五分溫服治沙石淋澀者用琥珀二錢研為細末空心濃煎蔥白湯調服無問諸般淋證一二服立效又方用九肋鱉甲一個酥炙脆為末每服一匙酒調下以效為度又方用牛膝一握水五盞煮一盞去渣以麝香乳香少許研細調服又方用黑豆一百二十粒粉草二寸銼水煎乘熱入滑石末一錢空心服治小便淋瀝用黃牛尾燒灰為末每服半錢水調下治血淋用平胃散每服五錢加龍骨一錢水煎空心服數服見效又方白梅燒灰存性為末入麝香少許酒糊為丸如桐子大熟水吞五十丸下治五淋用榆白皮陰乾為末每日旦晚以水五合末三錢調如膏服亦治齁喘虛煩又方用葵子杵碎煎湯飲即通快又方用黃蜀葵花作末每服一二錢通草煎湯調下又方用滑石琥珀各一兩木通當歸木香鬱金扁竹各半兩為末每服三五錢以蘆葦葉同煎日三服又方用地膚子或莖葉五兩水四升煮取二升半分溫三服
