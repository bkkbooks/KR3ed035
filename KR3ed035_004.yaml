body:
  text: 卷之四虛勞治五勞七傷明目補虛益筋力長精神理一切風氣用仙茅根八九月採竹刀刮去黑皮切如豆粒米泔浸兩宿陰乾為末煉蜜丸如桐子大每服二十丸空心酒飲任下忌食牛乳及黑牛肉大減藥力又方用枸杞葉半斤細切粳米二合石器中煮作粥五味蔥白豉調和食之治虛勞用兔絲子二兩酒浸十日水淘焙乾為末入杜仲一兩蜜炙搗用薯蕷末酒煮為糊丸如桐子大空心酒下五十丸治勞瘦用青蒿細銼水三升童便五升煎取一升半去渣熬成膏丸如桐子大空心臨臥以溫酒吞二十丸又方用青蒿細銼每服三錢水一盞童便半盞煎八分服治虛勞尿血用鹿角膠三兩炙搗為末酒二升和溫服治補虛勞益髓長肌悅顏色令人肥健用鹿角膠炙搗為末酒調方寸匕日三服治病後虛勞用五七歲黃牛乳一升水四升煎一升飢則稍稍飲服至十日有效治五勞七傷明目用白瓜子七升絹袋盛納沸湯中三遍訖以醋五升浸一宿曝乾為末酒服方寸匕日三次服瘥治虛勞目暗用三月三採蕪菁花陰乾為末空心井花水調下二錢匕久服長生治虛勞下焦虛熱骨節煩疼肌肉急小便不利大便數少口燥少氣淋石用大麻仁五合研水二升煮去一半分服四五劑瘥治形體黑瘦枯稿用杏仁五升去皮尖雙仁生搗碎水絞汁研細再絞濾過用慢火於石器內煎和羊脂如膏每日溫酒服一匕自愈又方用臘月豬脂和大豆黃末和杵丸如桐子大每服三五十丸空心溫酒或米飲下五升為一劑服二劑見效治男婦五勞七傷下元虛冷一切風病四肢疼痛用補骨脂一斤酒浸一宿放干卻用烏油麻一升和炒麻子聲絶播去只用補骨脂為末醋糊丸如桐子大早晨溫酒鹽湯下二十丸兼烏髭駐顏悅心明目益氣延年又方用破故紙十兩為末胡桃肉二十兩去皮研如泥入前末更以蜜和勻如飴盛瓷器中每旦暖酒二合調一匙服之便以食壓湯調亦可忌食羊肉治虛弱昏昏常睡用馬頭骨枕之即漸清爽無昏睡治膽風毒氣虛實不調昏沉多睡用酸棗一兩臘茶二兩以生薑汁塗炙微焦為末每服二錢水七分煎六分無時溫服治上盛下虛痰涎壅塞升降陰陽安和五臟扶助元氣用水銀一斤硫黃四兩以新鐵銚炒成砂有煙即以醋灑研細入水火鼎醋調赤石脂封口鐵線扎縛曬乾鹽泥固濟用炭二十斤煅如鼎裂筆蘸赤石脂頻抹火盡為度經宿取出為末糯米丸如麻子大每服二十粒空心棗湯米飲人參湯任下此藥最能鎮墜治精血耗竭面色黎黑耳聾目暗口乾多渴腰痛腳弱小便白濁上燥下寒用鹿茸酒蒸當歸酒浸等分為末煮烏梅肉丸如桐子大每服五十丸空心米飲下治骨虛面腫脊痛不能久立血氣衰憊發落齒枯喜唾用鹿茸二兩牛膝一兩半酒浸焙乾為末煉蜜丸如桐子大每服五十丸空心鹽湯下治老人骨髓虛竭用鹿茸五兩塗酥炙黃為末酒二升於銀器中慢火熬成膏貯瓷器中每服半匙溫酒調空心食前服治虛勞用胡黃連蛇床子前胡各三錢犍豬膽一個脊髓一條童便一盅水一盅煎至一盅渣再煎二次服四劑可愈治多年傷損不瘥白瓜仁炒為末酒調方寸匕日三服治精血虛耗不燥不熱用熟地黃菟絲子等分為末酒糊丸如桐子大每服七十丸人參湯下氣不順沉香湯下心氣虛茯苓湯下心煩不得睡酸棗仁湯下腎氣茴香湯下小便少車前子湯下小便多益智湯下又方用生地黃熟地黃天門冬麥門冬各去心一兩人參半兩為末煉蜜丸如桐子大空心溫酒或鹽湯下三十丸治傷力用杏仁去皮尖麩炒黃大力子炒等分研細加蜜丸如彈子大每服一丸臨臥噙化十丸即效治陰盛陽虛耳作蟬聲並一切冷氣用鹿角霜四兩菟絲子酒浸茴香炒枸杞子五味子川楝子各一兩為末酒糊丸如桐子大每服五七十丸空心溫酒下又方用鹿角霜一斤白茯苓去皮四兩為末就用鹿角膠和丸如桐子大每服三五十丸空心溫酒下甚有補益治諸虛百損用破故紙二兩隔紙炒香熟白茯苓一兩去皮為末沒藥一兩以無灰酒浸餳糖酒糊丸如桐子大每服二三十丸空心熟水下不問老少虛損服之皆效蓋破故紙補腎茯苓養心沒藥養血三者既壯自然身安治勞五內崩損湧噴血出成斗升者用花蕊石煅過存性研如粉每服三錢甚者五錢以童便一盞酒半盞若女人醋半盞食後調服立止其瘀血化為黃水服此藥後必疏解其體卻服後藥補之治勞止血後補藥用大人參二兩水二盞棗五枚煎一盞不拘時細細服之令其熟睡一覺治勞嘔血吐血嗽血用大薊小薊柏葉荷葉茅根茜根大黃山梔子牡丹皮棕櫚皮各一兩燒灰存性研細碗蓋出火毒又以大山藥五條蓮肉半斤晉棗一百個霜柿十個四味用水四碗於砂鍋內煮熟擂細卻下前藥末和勻慢火再熬復下阿膠四兩黃蠟二兩平胃散末四君子湯末並知母黃柏末各一兩搜和成劑如硬入白蜜置青石上木槌打勻丸如桐子大每服一百丸棗湯下不拘時此藥不寒不燥一切虛勞百損服之立便除根骨蒸治骨蒸勞及五痔腸風下蟲血用鰻鱺魚酒醋五味煮食亦治心痛治骨蒸勞不得眠心煩用酸棗仁一兩水一盞半研絞汁下米二合煮粥候熟下地黃汁一合更煮服之治骨蒸用生地黃一升搗取汁分服若利減之以身涼為度治骨節熱積漸黃瘦用大黃半兩細銼以童便五合浸一宿煎三四沸去渣食上分兩服如人行四五里再服治骨蒸用桃仁一百二十個去皮雙仁研為丸平旦井花水頓服盡仍飲酒醉又須吃水多為上隔日又一服百日不可食肉治骨蒸飲食不作肌肉發熱自汗若日夜間熱易治日夜俱熱難愈用羚羊角為末每服二錢匕溫水調下又方用石膏為末每服方寸匕溫水調服以身涼為度又方用生地黃汁三合酒一合同溫空心分二服治五蒸旦涼至晚煩躁飲食無味細喘少氣兩足逆冷手心常熱變疳則蝕人五臟大便或澀用芒硝五兩為末每服三錢匕米飲調下日二服無時又方用芒硝二兩苦參末二兩煉蜜丸如桐子大每服七丸米湯下以身輕涼為度又方治五心煩熱用胡黃連為末米飲調下治骨蒸虛熱諸勞煩躁用地骨皮防風各一錢甘草半錢水一盞薑三片竹葉七片煎七分服一方加人參雞蘇勞瘵治疰病傳染一門悉患者但覺如此便宜急治用獺肝一具陰乾或焙乾為末水服方寸匕日三未瘥再作神效治鬼疰癲癇及惡毒熱氣小兒諸疳用野豬膽水研少許日二服效治尸疰鬼疰傳染如覺宜急治用桃仁五十個研水煮取三四盞一服盡當吐若病未盡除三兩日再服治鬼疰心腹痛不可忍用東引桃枝白皮一握水二升煮半升服如未定再服治勞取蟲法用桑柳梅桃石榴枝各七莖長四寸青蒿一握以童便一升半蔥白七莖煎及一半去渣別入安息香阿魏各一分再煎至一盞濾渣去調辰砂末半錢檳榔末一分麝香一字分作二服調下五更初一服五更三點一服至巳牌時必取下蟲如色紅者可救色青者不治下後即進粥飲溫暖將息不可用性及食生冷毒物合時須擇良日不可令貓犬孝服穢惡婦人見之治諸傳尸勞氣殺蟲去毒用川椒二斤擇去子合口者炒出汗為末每服二錢空心米湯調下必麻痹暈悶少頃如不能禁以酒糊丸如桐子大空心服五十丸鹽湯下服至一斤瘵疾自瘥兼治腎冷諸痹肉桂湯下腰痛香酒下治勞瘵用三月四月取香草葉二三斤熟搗解衣坐之令氣入下部透腹中則尸蟲盡去仍以香草煮湯頻浴其蟲必死又方常用庚申日去手甲甲丑日去足甲每年七月十六日將所去手足甲燒灰和水服則三尸九蟲皆滅名曰斬三尸又方每年六月八日及庚申日其夜不睡振伏三尸及常日每夜叩齒三十六遍以左手捧心呼三尸名云上尸彭琚出中尸彭瓆出下尸彭䐐出輒不得為害無病之人常能行之則精神倍爽五神恬靜疾無由生矣治勞取蟲用天靈蓋二指大以檀香湯洗過塗酥炙呪七遍云雷公神電母聖逢傳勞便須定急急如律令雞心檳榔五個阿魏甘遂各二分麝香安息香各三分辰砂一分各研極細和勻每服三錢以薤白蔥白各二七莖青蒿二握甘草二莖五寸許桃柳桑酸石榴枝各二握七寸許俱用向東南嫩者以童便四升於銀石器內慢火煎至一升濾去渣分作三盞將前藥末調下五更初服男患女煎女患男煎若服後欲吐嚼白梅止之五更盡必腹鳴少頃下蟲及惡物黃水如人行五七里未下又進一服至天明更進一服並溫吃如瀉不止用龍骨黃連等分為末熟水調下五錢次吃白梅粥補之又方用煅磁石一兩半龍骨半兩硇砂一兩膩粉半兩麝香一錢各研為末和勻熔蠟丸如小櫻桃大以針穿竅用青紅線貫之梢頭系一大古錢早晨令病人向破方正坐用溫水吞下喉中合口以牙咬住古錢候噁心便吐出蟲或血絲或涎一二合病痊其治過藥丸可用溫水浴過收起再治一人又方用白兔糞中秋夜取四十丸硇砂共研為末煉蜜丸如桐子大每服七丸甘草半兩生捶碎水一盞揉取汁若患人瘦弱甘草炙用五更空心冷服過二日再服下蟲為準須上旬服又方用熟地黃三兩乾漆半兩炒桂心一兩為末煉蜜丸如桐子大每服七丸米飲送下又方用雄黃一兩為末松脂一兩溶和為丸如蓮子大平旦吞一丸七日三尸盡去治傳尸勞瘵用童便二盞無灰酒一盞貯新瓷瓶內取全豬腰子一對置其中以泥封固日晚時慢火養熟至中夜止五更初以火溫之發瓶飲酒食腰子病篤者一月見效平日瘦怯者亦可服又方用赤齆兒俗名王瓜焙乾為末溫酒調服有效泄精治失精暫睡即泄用白龍骨四分韭子五合為末空心酒調方寸匕服又方用牡蠣炙黃為末酒調方寸匕空心臨臥二服又方用蘇子一升熬杵為末酒調方寸匕日再服治腰腎冷夢與人交接泄精用柘木東行根白皮搗汁服治虛勞尿精用十月霜後採新韭子好酒八合漬一宿次早日出時好童子搗一萬杵平旦溫酒服方寸匕日再服立瘥治男女夢與鬼交心神恍惚者刮鹿角屑三指一撮酒調日二服治虛勞腎損夢中泄精用韭子二兩炒為末食前酒下二錢匕治暖精氣益元陽用白龍骨遠志等分為末煉蜜丸如桐子大臥時冷水下三十丸治泄精用未連晚蠶蛾干之為末每服三錢空心溫酒調服又方用車前子草搗絞汁二合服甚效治失精漏泄久虛用蓮子心一撮辰砂一分為末每服二錢空心白湯調下治元氣虛寒精滑不禁大便泄瀉手足冷用陽起石火煅紅鍾乳粉各一兩為末酒煮附子末糊丸如桐子大每服五十丸空心米飲湯送下治精滑下元虛冷及疝氣婦人經脈不調大人小兒皆可服用獨活穀精草續斷茵陳等分為末雞子清丸如桐子大每服五十丸空心溫酒下乾物壓之赤白濁治溺有餘瀝小便白濁夢泄用菟絲子五兩白茯苓三兩石蓮肉二兩為末酒糊丸如桐子大每服三十丸空心鹽湯下治虛寒白濁小便頻數漩面如油腳凝如糊用益智萆薢菖蒲烏藥等分每服四錢水一盞入鹽一捻煎七分食前溫服一方加茯苓治腎虛白濁淋瀝夢泄盜汗用茯苓四兩龍骨二兩五倍子十六兩為末糊丸如桐子大每服四十丸空心鹽湯下治思慮傷脾脾不攝精遂致白濁用厚朴薑製二兩羊脛炭火煅通紅窨殺研如粉一兩麵糊丸如桐子大每服百丸空心米飲下治小便頻數時有白濁用菟絲子蒸韭子炒益智子去皮茴香炒蛇床子去皮炒等分為末酒糊丸如桐子大每服七十丸米飲鹽湯任下一方加川椒治漏精白濁用白茯苓白鹽煅過山藥炒各一兩以棗肉和蜜丸如桐子大每服三十丸空心棗湯下治心經虛熱小便赤濁用蓮肉蓮心六兩甘草炙一兩為末每服二錢燈心湯調下治心經伏暑小便赤濁用人參白朮赤茯苓去皮香薷澤瀉豬苓去