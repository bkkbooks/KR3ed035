body:
  text: 卷之五消渴治消渴用水萍曝乾栝蔞等分以人乳為丸如桐子大每服三四十丸又方用揀黃連二兩銼碎水一碗煎半碗去渣頓服之立止又方用栝蔞三十斤水一石煮取一斗半去渣以牛脂五合煎取水盡以暖酒先服如雞子大日二服即效又方用田螺五升水一斗浸經宿飲之每日易又方用蘿蔔生搗汁服大效又方用韭或炒作羹勿入鹽每日吃三五兩吃至十斤即佳過清明勿食入醬無妨極效又方用霜降後葵根皮一握水一斗煮取三升服之但酒渴傷寒渴皆治又方用栝蔞根大尺圍者生取汁服之或煮水服又方用黃連栝蔞根等分為末生地黃汁丸如桐子大每服五七丸食後服牛乳送下又方用淡豆豉煮汁任性欲之又方用白藥為末每服方寸匕冷水調下亦可蜜丸如桐子大每服二十丸日二服又方用黃丹炒胡粉炒赤石脂白石脂石膏澤瀉各五分另研甘草炙栝蔞根各十分為末共再研勻水調方寸匕日三服少壯服匕半渴甚者夜間二服又方用生牛乳頓飲渴時再飲自便不渴大患不過十次又方用結子蘿蔔三枚洗淨薄切日乾為末每服二錢煎豬肉汁澄清調下食後並夜臥日三服不過三劑大妙又方用蠶沙炒乾為末每服二錢冷水調下又方用黃連為末蜜丸如桐子大每服二十丸溫酒送下治消渴煩悶用烏梅肉三兩微炒為末每服二錢水二盞煎一盞去渣入豉二百粒再煮至半盞去渣臨臥服又方用糯米二升淘取泔飲訖則定或用糯米研取白汁恣飲之以瘥為度治消渴下元虛損用牛膝五兩為末生地黃汁五升晝曝夜浸汁盡為度蜜丸如桐子大空心調下三十丸治渴若遠行無水用水花即水沫和苦栝蔞為丸早朝預服二十丸永無渴治消渴小便多用栝蔞五兩水五升煮取四升隨意飲之良治一切消渴或先渴而欲發瘡或病癰疽而後渴者並皆治之用黃耆去蘆蜜塗炙六兩甘草炙一兩銼細每服三錢水一盞棗一枚煎七分溫服不拘時治心熱或酒多消渴用硃砂一兩別研黃連三兩生地黃二兩為末煉蜜丸桐子大每服五六十丸燈心棗子煎湯送下治一切消渴不能止者用大豆五升大黃一兩半大甘草四兩打碎用水一桶煮三五時豆軟盛於盆中放冷令病人食豆渴飲湯汁食盡未止再煮如前不三次病悉去矣又方用米以冷水濃淘泔汁澄清飲之俟至酸飲尤佳又方用白芍藥甘草炙各錢半水盞半煎八分服不拘時日三服疾止則已又方用密陀僧二兩黃連一兩為末蒸餅丸如桐子大濃煎繭皮鹽湯或茄根湯吞五丸日增五丸至二十丸止又方用雄牛穿鼻木燒灰存性為末酒調服或銼碎煎湯數服見效小便利治小便多消渴用入地二尺桑根白皮炙黃黑銼以水濃煮汁隨意飲亦可入小米煮治膏癉其人飲少小便多用秦椒一分出汗瓜蒂二分為末水調方寸匕日三服治小便數用蓬莪朮一兩金鈴子去核一分為末入硼砂一分燒過研細和勻每服二錢空心鹽湯或溫酒調下治小便多及遺精餘瀝用益智二十四枚捶碎入鹽用水一盞煎六分服治消腎小便數用鹿角一具炙焦搗末酒服方寸匕漸加至一匕半治下元虛冷小便頻數用香附子酒浸曬乾為末酒糊丸如桐子大每服五七十丸空心姜酒下治小便利用雞腸草搗汁服治小便多滑數不禁用金剛骨為末每服三錢好酒調服又方用知母黃柏等分銼碎酒浸透炒黃為末水丸如桐子大頭日休吃晚飯來日空心立服一百丸米飲湯下只一服效復吃淡白粥一頓遺尿失禁治遺尿用烏藥為末每服二錢米湯調下日二服又方用薔薇根細研好酒調服又方用白紙一張鋪於所睡席下待遺於上日乾燒存性為末酒調與服又方用益智一兩半酒一碗煎七分去渣溫服枳殼亦好又方用雞肶胵一具並腸淨洗燒灰男用雌者女用雄者為末每服二錢酒調服又方用阿膠炒牡蠣煅鹿茸酒炙桑螵蛸酒炙等分為末糯米丸如桐子大每服五十丸空心鹽酒下治心腎俱虛神魂不守小便淋瀝不禁用赤茯苓白茯苓等分為末以新汲水挼洗澄去渣控干取地黃汁與好酒同於銀石器內熬成膏和丸如彈子大空心鹽酒嚼一丸治內虛里寒自汗小便不禁用白龍骨三兩訶子十個去核縮砂一兩去皮靈砂一兩為末糯米粥丸如桐子大每服五十丸空心鹽酒下治睡中遺溺不覺用燕窩中草燒黑為末水調方寸匕服治遺溺淋瀝用桑螵蛸炙焦白龍骨等分為末每服二錢匕空心鹽湯調下大驗大腸秘結治大腸風氣壅熱結澀用黑牽牛微炒搗末一兩桃仁麩炒去皮尖半兩為末煉蜜丸如桐子大溫水服二三十丸又方用牽牛子半生半熟為末每服二錢薑湯調下如未通再服以熱茶調下量虛實無時候加減服之又方用烏桕木方一寸劈破水一盞煎半盞服之立通不用多服兼能去水症其功最大治大便不通氣奔欲絕用烏梅十個置湯中須臾挼出核搗為丸如棗大內下部少時即通又方用蜜四兩銅器中微火煎凝如飴攪勿令焦乘熱捻作梃如指長投穀道中以手按住大便來時乃去之土瓜根大豬膽皆可為導又方用皂角末煉蜜丸內穀道中或以蔥白或蔥尖納肛門內又方用麻子一合水一盞研取汁飲之又方用不蛀皂角中一寸去黑皮以沸湯半盞泡良久通口服之通後即食少粥又方用紫蘇子麻子仁不拘多少研取汁煮粥食之治老人氣秘大腑不通用橘紅杏仁湯浸去皮尖等分為末煉蜜丸如桐子大每服七十丸空心米飲下治發汗過多耗散津液大腑秘結用肉蓯蓉酒浸焙二兩沉香別研一兩為末用麻子仁汁打糊丸如桐子大每服七十丸米飲下治年高冷秘虛秘及痃癖冷氣用生硫黃研細半夏湯洗七次焙乾為末等分用姜糊丸如桐子大每服五十丸空心溫酒薑湯下治大便秘澀不通用麻子仁芝麻各一盞微炒研取汁桃仁去皮尖荊芥穗各一兩為末入鹽少許煎代茶飲以利為度治大小便不通用皂角燒存性為末空心米飲或酒調下三錢立通又方用連根蔥一二莖生薑一片淡豉二十粒鹽二匙同研作餅烘熱掩臍中以帛扎定良久氣透自通不然再換一劑治大小便久不得通脹滿欲死用葵子二升水四升煮一升頓服入豬脂雞子大一塊彌佳治大便秘結上焦熱用大黃一兩牽牛頭末五錢共為細末有厥冷酒調下三錢無厥冷而手足煩者蜜湯調下治大便不通用大黃九錢荊芥一錢水煎空心服即效又方用蘿蔔子一合擂冷水調皂角灰末二三錢服立通小便不通治小便不通用朴硝為末每服二錢茴香湯下又方用蚯蚓杵以冷水濾過濃服半碗立通大解熱疾不知人事欲死服之甚效又方用扁竹一握水盅半煎一盅熱服又方用萵苣搗如泥貼臍上或用鹽填臍內艾灸三壯又方用甜酸草搗汁入砂糖水調服或用磨刀交股水一盞服治腹脹小便不通用琥珀一錢研極細人參湯調下治小腹脹滿痛不得小便用雄黃細研蜜丸如棗核納溺孔中及療天行病治小便不利莖中痛用牛膝一大握酒煮飲之立愈及治卒暴症腹中石刺並婦人血結堅痛治小便不利膀胱水氣留滯用浮萍日乾為末每服方寸匕日三服治小便不通用針頭草曬乾三錢燈心十莖水一盞煎八分去渣空心食前服治小便不出胞轉膨滿欲死者用亂髮燒灰冷水調下方寸匕又方用發灰二錢滑石末一錢桃白皮煎湯調下日進二服大效治小便不通用蔥白三斤切細慢火炒香熟以帛包作兩處更熨臍下即通又方用烏桕木皮煎湯調五苓散服立通如無藥只以桕皮煎湯服亦可又方用荊芥九錢大黃一錢煎服水腫治水腫及全身暴腫小便澀用葶藶三兩搗爛大棗三十枚水一升半煎一升去棗內葶藶於汁中熬稠丸如桐子大空心木香湯或米飲下三十丸治卒腫滿身面皆洪大用甘遂一錢為末豬腎一枚作七片塗末炙熟食至四五片當覺腹腸鳴小便利一方更入木香一錢共內腎中以薄荷葉裹定再用濕紙裹煨臨臥細嚼溫酒送下當下黃水是效又方用皂角炙黃銼三升酒一斗漬之合器煮沸澄清服一升日三服又方用菟絲子一升酒五升漬二三宿每服一升日三服又方用生豬肝一具細切頓食之勿用鹽只可用苦酒又方用苦瓜瓤實捻如大豆以麵裹煮一沸空心服七枚至午當出水一斗三日水自出不止大瘦乃瘥三年內慎口味用瓜須擇妍淨者不爾有毒勿用又方用榆皮搗屑雜米作粥食小便利治風水腫腹大臍腰重痛不可轉動用冬麻子半升水研濾取汁米二合煮粥著蔥椒薑豉空心服治水蠱腹大搖動水聲皮膚黑色用巴豆去皮心熬黃搗丸如小豆大水下一丸以利為度勿飲酒治水蠱病不問年月深者用大戟當歸陳皮各一兩細銼水二升煮七分頓服利二三斗勿怪至重不過再服治水氣遍身浮腫氣促坐臥不安用牽牛二兩微炒搗末烏牛尿浸一宿平旦入蔥白一握煎十餘沸去渣空心分為二服水從小便中出又方用東引花桑枝燒灰淋汁煮赤小豆空心食飽飢即食盡不得吃飯治水氣皮膚癢用枳殼一兩為末如茶前呷兼明目治水腫用白商陸細切一升羊肉六兩水一斗煮六升去渣將肉和蔥豉作臛如常法食又方用白商陸六兩取汁半合和酒半升看大小相度與服當利下水又方用白商陸根去皮切如小豆許一大盞水二升煮一升入粟米一盞煮成粥空心服即微利不得雜食又方用烏豆一升水五升煮三升去渣入酒五升更煎取三升分溫三服未瘥再合又方用鯉魚一頭極大者去頭尾及骨惟取肉以水二斗赤小豆一升合煮取二升以上汁生布絞去渣頓服盡如不盡分為三服利盡即瘥治十種水腫病用鯉魚一頭重一斤以上和冬瓜蔥白作羹食之治十種水病腫滿氣喘促不得臥用螻蛄五枚干為末食前湯調半錢匕至一錢小便通效治水腫從腳起入腹則難療用赤小豆一斗水煮極熟取汁四五升溫漬膝以下冷則重暖若已入腹但服小豆勿雜食亦愈凡豆不可合魚鮓食令人患消渴生口瘡治乳腫喘促小便澀用杏仁一兩去皮尖熬研和米煮空心服二合治水病初得危急用冬瓜不限多少任吃極效治水病肚脹四肢腫用黃瓜一個破作二片不去子醋煮一半水煮一半俱爛空心頓服須臾水下治水病洪腫氣脹不消食用香薷五十斤細銼內釜中水浸上數寸煮使味盡去渣澄清熬稠丸如桐子大每服五丸日三漸增以小便利為度治水腫坐臥不得頭面身體悉腫用蒴藋根刮去皮搗汁一合和酒一合空心暖服當微吐利治中水氣已服藥未平復用麝香如大豆三枚細研乳汁調分為四五服治腳腿腫用瓠子種空殼煎湯空心服治水腫用水戟木通木香各二錢為末以豬腎一個劈開入藥末在內仍合住用線纏縛濕紙裹於灰火中煨熟去紙嚼服少頃利四五行即愈必須忌口又方用烏鯉魚一個不去鱗甲只去肚腸入大蒜滿魚腹以黃泥裹固煨熟食魚蒜盡則小便通利病愈治身體手足浮腫用蚯蚓糞為末隔年醋調塗患處即愈治遍身腫滿如囊里裹漿疾行則濯濯有聲或咳喘不定用葶藶子炒澤瀉椒目桑白皮杏仁去皮麩炒豬苓去黑皮各半兩為末煉蜜丸如桐子大每服二十丸蔥白湯下無時以利為度一方用黑牽牛頭末一兩不用桑皮杏仁以蔥白漿水酒煎三錢服治通身黃腫用瓜蒂三四錢焙乾為末用半字吹鼻內日一度並吹三四日如不愈後用黃芩末五錢煎湯下治水氣四肢浮腫上氣喘急大小便不通用甘遂大戟芫花等分為末棗肉丸如桐子大空心熱湯送下四十丸以利去黃水為度否則次早再服又方用郁李仁杏仁炮去皮尖薏苡仁各一兩為末米糊丸如桐子大每服四十丸不拘時米飲下治水腫從腰以上俱腫用麻黃四兩去根節甘草一兩每服三錢水一盞先煮麻黃沸後入甘草煎七分服取汁避風老虛者勿輕用治一切濕熱腫滿用黑牽牛黃芩大黃滑石大椒各等分為末酒糊丸如桐子大每服五七丸食後生薑湯下仍量虛實加減治一切水氣通身腫滿用人參一兩半葶藶四兩鍋內鋪紙炒黃為末棗肉丸如桐子大每服十五丸桑白皮湯下空心食前日三服治水腫腹大如鼓或遍身皆腫用大戟白牽牛頭末木香等分為末每服三錢以豬腰一對批開摻藥在內燒熟空心食之如食左腰子塌左腫右腰子塌右腫如未全去於腹繞臍塗甘遂末飲甘草湯少許其腫盡去治水氣鼓脹用楮實子一斗五升熬膏白丁香一兩茯苓二兩為末以膏丸如桐子大每服三四十丸服至小便清利及腹脹消為度治一切腫用蓖麻子搗爛敷之又方用紫檀末醋調敷腫上治水腫用赤小豆五合大蒜一個生薑一分商陸根一條並切細水煮豆爛去薑蒜細嚼豆空腹食之旋啜汁令盡腫立消治水症用蓖麻子二十枚水研服之吐惡沫加至三十枚三日一服瘥則止又方用甘遂大戟等分為末每服一錢大麥面一兩和作餅子灰火燒熟臨臥細嚼茶送下如水不下隔日再服治水腫用甜葶藶川椒雄黃澤瀉芫花醋浸炒大戟甘遂赤茯苓桑白皮穿心巴戟各一兩為末桑白皮浸水一盞煎八分空心溫服小便多為效凡腫手心無紋面生痕黑點臍凸出肚上青筋現耳輪乾黑者難治其可治者從腳腫起其根在心加葶藶一兩從陰腫起其根在腎加澤瀉一兩從腸腫起其根在肚加川椒一兩從口唇腫起其根在小腸加巴戟一兩從面腫起其根在脾加桑白皮一兩從脅腫起其根在骨加甘遂二兩從頂腫起其根在膈加茯苓一兩仍審察虛實加減忌食雜物脹滿治心腹脹用蕪青子一合水一升和研取汁一盞頓服少頃得利或吐腹中自寬或得汗愈治水脹腹滿用蓖麻子細研末服壯人五粒治腹滿不能服藥用獨蒜煨熟去皮綿裹內下部中冷即易治關膈脹滿大小便不通亦用獨蒜如上法氣立通治身體腫滿氣急臥不得用郁李仁一合搗末和麵作餅吃入口即大便通利氣便安治肚腹脹滿用烏頭一個棗三枚杏仁七粒去皮尖俱生用以木石臼中搗爛丸如桐子大壯大五七丸小兒二三丸陳皮湯下治鼓脹身乾黑瘦多渴煩悶用馬鞭草細銼曝乾勿令見火以酒或水同煮至味出去渣溫服無時以六月中旬雷鳴時採有效治腹內氣脹滿者用檳榔為末每服二錢水煎服治小腹脹滿用秦艽三兩水二升煎一升分三服無時溫服即通治腹內氣脹滿喘息不得用葶藶子一升炒紫色酒浸七日研爛每服三匙溫酒調服無時大效治氣血凝滯腹內鼓脹用枳殼四兩去瓤切作片分四處並蒼朮蘿蔔子牛膝茴香各一兩各用一分炒黃只用枳殼為末卻將同炒四味用水二碗煎至一碗去渣煮糊丸如桐子大每服五十丸食後米飲下治三焦痞塞氣不升降胸膈脹滿大便秘澀小便赤少用檳榔陳皮黃芩大黃枳實黑牽牛生用等分為末煉蜜丸如桐子大每服五七十丸臨臥溫熟水下更量虛實加減治喜怒憂思胸腹滿腸鳴走氣嘔吐不食用半夏湯洗七次粳米各二錢乾薑炮甘草二錢半大附子一枚炮去皮細銼每服四錢水一盞棗二枚煎七分食前服治胸脅脹滿短氣痰逆或吐涎沫用桔梗炒半夏湯洗薑製陳皮去白各一錢枳實麩炒半錢水一盞姜五片煎七分溫服不拘時治鼓脹心腹痞滿用大黃桃仁雞屎乾者等分為末每服一錢水一盞生薑三片煎湯調下食後臨臥服治三焦不調胸滿腹脹冷氣衝注刺痛用赤茯苓人參陳皮去白桔梗炒等分為末每服三錢水一盞半生薑五片煎八分去渣不拘時服治鼓脹氣滿用苦丁香為末棗肉丸如桐子大每服三十丸空心棗湯下三服必愈治痢後肚腹滿悶用蒼朮四兩米泔浸炒陳皮去白青皮去瓤各一兩木香二錢為末醋糊丸如桐子大每服二十丸空心溫酒下小兒三五七丸米飲下治心腹痞滿膨脹用黃芩去粗皮大黃去粗皮酒浸半日紙裹煨各二兩滑石碾細飛過四兩牽牛一斤炒香取頭末四兩共為細末滴水丸如桐子大每服五七十丸臨臥溫湯下若濕熱腰痛水濕腫加甘遂若遍身走注疼痛加白芥子若發熱腫痛加朴硝若結滯關節不通腸胃秘澀加郁李子若腰腿沉重加樟柳根以上各加一兩積聚癥瘕治男婦五般積氣成聚用牽牛一斤生搗末八兩余渣於新瓦上炒香放冷再搗取末四兩共十二兩拌勻煉蜜丸如桐子大患積氣至重者三五十丸陳皮生薑湯下空心臨臥服治腹脹積聚癥瘕用葶藶一升炒黃酒五升浸七日日服三合治症腹中有物硬如石刺痛用虎杖根一斗干搗酒漬飲之日三服治症熨法用茱萸三升碎之酒和煮熟布裹熨之冷更炒更番熨治卒暴症腹中有物堅如石痛欲死用蒴藋根一小束洗瀝去水細擘酒二升浸三宿暖溫服五合至一升日三若欲速得服於熱灰中溫令味出服之此藥無毒大驗治積聚癥瘕並去三尸益氣延年用雄黃二兩為末九度水飛過入新竹筒以蒸餅塞筒口蒸七度用粉脂一兩丸如綠豆大日三服酒下七丸十丸三年後百病皆除永不飢渴治癖用大黃十兩為末醋三升白蜜兩匙同煎熬丸如桐子大一服三十丸生薑湯下以利為度小兒減服又方用郁李仁泡去皮與面和搗為餅如干著淡水作餅如病人掌大為二餅炙黃熟空腹食一枚當快利如不利更食一枚或飲熱粥以利為度若至午後利不止即以醋飯止之病未盡去一二日後更進一服以病盡為限不得食酪及牛肉無不效治痃癖癥結及諸蟲並馬毒瘡用馬齒莧和鹽醋煮一碗空心食有蟲盡出汁塗瘡治腹中痃癖諸塊用雄雀尿和乾薑桂心艾等分為丸空心米飲服十丸又方用鱉甲燒黃合訶梨勒皮乾薑等分為丸空心服三十丸治鱉瘕用新熟赤黍米淘取泔汁生服一升不過三度愈治小腹堅大如盤胸中滿能食而不消用曲末方寸匕日三服治痞用水中生長蕨菜淡煮吃三日即打下惡物仍要吃淡一月方可又方用觀音柳煎湯露一宿至五更飲數次痞自消又方用綠礬四兩為末面二兩作皮包礬蒸熟以胡桃仁十個杏仁二十四個去皮尖胡椒三十粒共搗如泥丸如桐子大每服二十丸空心溫酒下如劑硬加熟蜜丸又方用木鱉子七枚去殼搗爛好酒拌勻以精豬肉四兩薄切塗藥炙熟令患者旋嗅旋吃服月餘自愈忌煎炒物治癖灸法於後脊中離四指癖在左灸右在右灸左穴與臍平治鱉瘕用白馬尿一盞溫飲之即消又方用白馬尿一升雞子白三枚煎至二合空腹頓服不移時即當吐出小鱉又方用胡粉黍米淋汁溫服大效治蛇癖凡蛇精及液拋活菜上人誤食之腹內成蛇或食蛇肉亦作蛇瘕其人常飢食之即吐腹中如蛇用赤頭蜈蚣一枚為末分服酒調下治痃癖氣塊用桑柴灰汁三升鱉一枚同煮如泥去骨再煮如膏丸如桐子大每服十丸隨食飲下治男婦氣瘕小腹堅結如杯盤婦人月候不通往來潮熱或痢羸瘦用地黃三十斤杵絞汁乾漆一斤為末慢火熬調丸如桐子大每服五七丸溫酒下無時治一切積聚氣脹兩脅膨滿無問新久用大黃三兩黑牽牛頭末一兩硇砂三錢梔子半兩輕粉二錢共為末煉蜜捻如小銅錢大厚食後細嚼三餅溫酒送下臨臥如行粥補之虛實加減服治積聚心腹痞痛嘔吐不止用皂角一錠一尺二寸燒留性盆合於地土壅勿令出煙巴豆十二個去殼以面一兩同炒黃為末醋糊丸如綠豆大每服十丸食後鹽湯下約量加減治氣癖於膜外流於兩脅氣逆喘急用胡椒一百五十粒木香不見火二錢半全蠍去毒十個為末粟米飯丸如綠豆大每服二十丸橘皮湯下治一切積聚痃癖氣塊及大小結胸痛不能抑按用南星半夏芫花自然銅生用等分為末醋糊丸如桐子大每服五七丸食前溫湯下治腹內積滯毒氣春暄發病用檳榔郁李仁等分為末每服三錢匕蜜水調下無時治秋夏之交露坐夜久腹中痞如群石在內用大豆半升生薑八分水二升煎一升頓服瘥治蛟龍瘕用寒食飯三升每服五合日三服遂吐出蛟龍有頭尾治心下堅如盤用枳實去白麩炒一錢半白朮三錢水一盞煎七分溫服其堅即散治腹中癖塊用大黃朴硝等分為末以蔥蒜研爛和勻如膏厚攤絹帛上貼患處即消軟治食積酒積氣積諸般積塊翻胃噎塞嘔逆心膈脹滿咽酸口吐清水面黃肌瘦飲食少進五勞七傷山嵐瘴氣水腫積熱痰壅癰疽腫痛淋瀝婦人蠱腫寒熱黃瘦月水不調赤白帶下鬼胎產後諸疾小兒五疳蟲積誤食毒物並宜服之用檳榔大黃商陸貫眾各半斤三稜六兩莪朮四兩雷丸芫花各二兩以上四味俱醋煮焙乾木香二兩牽牛二斤取頭末十兩二兩入藥八兩發丸時四次為衣先用苦楝根皮一斤水一小桶熬數沸去皮入皂角去皮子一斤再熬數沸去皂角入茵陳半斤再熬數沸去茵陳入藿香四兩微熬待冷澄清用小粟米飯為母以藥水發藥末為丸如綠豆大每服三錢小兒量減夜飯莫食四更雞鳴時用冷茶清吞下少頃必行四五次有蟲下蟲有積取積有塊消塊至辰巳時方可飲食病深者過二日再用一服忌生冷酸鹹魚面油膩孕婦勿服累驗又方用貫眾二斤牽牛一斤檳榔半斤三稜蓬朮各四兩大黃二兩雷丸半兩白芷茴香各一兩為末另用皂角茵陳各半斤濃煎湯和劑搗千餘下丸如綠豆大每服半兩用紫蘇枳殼蔥白陳皮土瓜根等分為末水盅半煎一盅候冷五更時起身直立吞丸藥下天明取效又方用黃酒麴四斤炒黃色蒼朮二斤米泔浸切片焙乾皂礬一斤以好醋一碗煮乾就蓋鍋於地上一宿取出為末酒醋糊為丸如桐子大常服三十丸加至四五十丸空心好酒或米湯送下一日三次服之百無所忌諸般積塊脾胃怯弱飲食不消腹脹面黃四肢倦怠痠疼無力並皆治之治男婦遠近陳積氣塊水腫小腸偏墜腳氣蠱毒噎塞返食心氣脾疼喘急咳喘肺脹吐紅腸風痔漏左癱右瘓丹毒瘡疥紫白血瘢癰疽腫毒泄痢脾寒山嵐瘴氣小兒癲風癇並宜服之用大黃春冬二斤火炮秋夏一斤二兩生用甘草半斤炙牽牛十二兩檳榔十兩三稜四兩木香一兩為末每服五錢五更初面東冷水一盞調下巳時取大病根青紅赤白或是蛇蟲蝦蟆蜈蚣亂絲血塊不問四季老弱無妨利後用白粥補之孕婦勿服宿食治停食或因醉飽即睡胸膈痰飲積熱氣結滿悶用陳皮半兩微炒為末以水濃煎如茶呷服即寬治酒食過飽滿悶用青橘皮二兩湯浸去瓤炒黃葛根一兩縮砂仁半兩為末和勻濃煎茶調一二錢服干舐吃亦得可常服消食化氣醒酒治胃虛不消食飲食飲入胃皆變冷水反吐不停用赤石脂為末米飲調服方寸匕日三服稍稍加進終身不吐治胃寒腸熱水穀不化腹脹痞滿泄利不已用川烏去尖半兩梔子乾薑各一分為末生薑汁打麵糊丸如桐子大每服五丸食前溫酒下日二服治胃熱腸寒善食而餓便溺小腹脹痛大便或澀用青皮三稜黃連蓬朮炮各一兩巴豆霜一分為末麵糊丸如綠豆大每服三丸至五丸茶酒任下治宿食留飲積聚中脘噎臭吐酸心腹刺痛用巴豆去皮心膜別研縮砂仁胡椒烏梅去核丁香各一百個為末炊餅糊丸如綠豆大每服五七丸臨臥熟水送下一方以百草霜杏仁半夏代胡椒丁香治破滯氣消飲食開胃健脾用木香一兩枳實炒一兩白朮二兩為末荷葉燒飯為丸如桐子大每服五十丸溫水送下治宿食腹脹快氣寬中用木香黑牽牛炒蘿蔔子炒檳榔等分為末滴水丸如桐子大每服三十丸食後生薑蘿蔔湯下治過食雜果傷脾腹脹氣急用肉桂不見火一兩麝香一錢別研為末飯丸如綠豆大壯大十五丸小兒七丸熟水下又方用朴硝一兩煎湯服瀉即愈酒病治酒病用長壽仙人柳曬乾為末每服一錢酒調下治酒疸脾黃用木鱉子醋磨服一二盞必利見效治酒毒用野葛根切作片細嚼或煎湯服亦止渴解大熱治酒病用豆豉蔥白各半升水二升煮一升頓服又方用葛根一兩豆蔻數粒酒盅半煎一盅服又方用赤小豆煮汁熱飲即愈久服令人枯燥粉去油汙衣甚妙葉食明目治酒疸用陳皮芫花等分為末分服二三錢溫酒調下日二服又方用葛根四兩硃砂木香各二錢為末每服三錢溫酒調辰午申時各一服又方用丁香大黃各一錢為末口噙水搐鼻內午時搐申時黃水出為驗若腹脹不思食再搐治酒積用龍腦二錢木香甘遂各一兩為末每服一二錢溫酒或葛根湯調下治酒病及飲酒不醉用赤小豆花葛花為末服方寸匕終日不醉治好食生茶用椒末糊丸如桐子大茶下一十丸蠱毒治中蠱毒用甘草煮汁服之吐痰出若平生預服防蠱者宜熟艾煮服即內消不令吐神驗又方用預知子三錢水煎溫服立效又方用馬兜鈴根二兩煮汁服即吐出毒又方凡入有毒之鄉飲食內先以犀角攪試有毒即白沫竦起無沫即無毒也又方用敗鼓皮廣五寸長一尺薔薇根五寸水一升酒三升煮一升頓服當小蠱蟲即出又方用生玳瑁水磨濃汁服一盞自解又方用糯稻穗濃煎汁服又方用胡荽絞汁半升和酒服之立下神驗治五種蠱毒用兜鈴根三兩為末分作三貼每貼水一盞煎五分去渣服當吐蠱出未快再服又方用大戟東引桃白皮大火烘之斑蝥去足翅炒三件等分為末水服半方寸匕其毒即出不出更一服蠱並出若酒中得酒服食中得飲服奇效治卒中蠱毒下血如鵝肝晝夜不絕臟腑敗壞待死欲知蠱姓名用破鼓皮燒灰服自呼名治之乃去又方欲知蠱主姓名取敗鼓皮少許作末飲服病人須臾自當呼蠱主姓名治蠱毒下血用蝟皮燒末水服方寸匕日三服當吐蠱出治蠱或下血如爛肝用蚯蚓十四枚以苦酒三升漬之蚓死但服其汁已死蚓皆可活治卒中蠱下血如雞肝晝夜不絕臟腑敗壞用白蘘荷搗汁飲葉安臥席下勿令病人知即自呼蠱主姓名亦治諸溪沙蝨等毒人家種之闢蛇治蠱吐血或下血如爛肝用苦瓠一枚水二升煮一升服立吐即愈一方用苦酒一升煮令消服神效治蛇蠱飲食中得之咽中如有物咽不下吐不出用馬兜鈴煎湯熱飲一盞即吐出又方服麝香一錢匕即吐蠱毒治中蠱毒葷毒用頭垢一丸米飲或酒化下以得吐為度治中蠱或吐下血如爛肝用茜根蘘荷葉根各三兩切細以水四升煮二升去渣溫頓服治蛇及蝦蟆等蠱用蘘荷根汁三升頓服蠱立出又方用桔梗為末每服方寸匕溫酒調服或取生汁服五六合又方用土瓜根指許大長三寸細切以酒半升漬一宿服之又方用栝蔞根自然汁酒和服之又方用大力子水煮食之治蠱毒用雄黃硃砂各半兩別研藜蘆炒鬼臼巴豆去殼心油各一分為末蜜丸如大豆每服三丸空心乾薑湯下當轉下惡物並蠱如煩悶後以鴨為羹食之又方用升麻末三錢溪水調服治五種蠱用雄黃麝香等分為末以生羊肺如指大以刀開裹藥吞之治預防蠱自小用貓肉食之則蠱不能害又方凡入有蠱之處見人家門垠屋梁無灰塵潔淨者其家必畜蠱當用心防之如不得已吃其飲食即潛地於初下箸時收藏一塊在手盡吃不妨少頃卻將所藏一塊潛埋於人行十字路下即蠱於其家作鬧蠱主必反來求救或食時讓主家先動箸或明問主家云莫有蠱麼以箸築桌而後食如是則蠱皆不能為害此皆詢諸蠱鄉云治小兒中蠱用甘草半兩水一盞煎五分去渣作二服當吐蠱出又方用青藍汁頻頻服半合治蠱毒用青木香即馬兜鈴根為末每服三錢水一盞煎至五分去渣空心服當吐出蠱未快再服又方用山豆根為末酒調三錢下又方用石菖蒲焙乾為末每服二三錢甘草湯調下病退為度又方用白礬一塊嚼之覺甜便是蟲蠱即用梳齒垢膩不拘多少服之吐出惡物中諸毒物治剝開驢馬涎毒入肉害人甚大用赤檉條即赤荊火炙津出以津汁塗之即瘥又方用月經衣燒灰為末溫酒調服無時治食蟹中毒用紫蘇濃煮汁飲三盞子汁尤佳治中箭毒交廣俚人以焦銅作箭鏃傷皮即死及蛇毒射菵漬塗箭鏃被傷即宜便飲屎汁亦宜塗敷餘者難救治解諸毒用石菖蒲白礬等分為末新汲水調下二錢兩服見效治誤飲饌中毒未審何毒急用甘草薺苨煎湯服之入口便活又方用貝子一枚含口內即自吐出毒治食牛羊肉中毒用甘草濃煮汁服一二升當愈治誤食諸毒草並百物毒用板藍根四兩貫眾青黛甘草各一兩為末蜜丸如桐子大以青黛別為衣如稍覺精神恍惚噁心即是誤中諸毒急用此藥十五丸爛嚼新汲水下治凡中毒及蛇蟲咬傷急服此藥則毒氣不聚用好青黛雄黃等分為末新汲水調二錢服治中諸毒用晉礬建茶等分為末每服二錢新汲水調下得吐即效未吐再服治中砒毒用漢椒四十九粒黑豆四十粒烏梅二個打碎甘草節二寸碎之用水一碗煎七分溫服又方用白扁豆青黛甘草等分巴豆一邊去殼不去油同為末以砂糖一大塊水化開調一大盞飲之毒隨利去卻服五苓散之類又方用早禾稈燒灰新汲水淋汁絹濾過冷服一碗又方用寒水石綠豆粉末以藍根研水調下或單用綠豆擂水服又方用鬱金末二錢蜜少許冷水調下或用醬水調服又方用白扁豆一合為末冷水調下治中砒毒煩躁心腹絞痛頭旋欲吐不吐面青黑四肢冷用青藍一握細研井花水一碗揉汁灌之又方用麻油一碗灌之又方用地漿濃服二三碗又方用楊梅皮煎湯二三碗服治解百毒及閩廣挑生金蠶蠱毒用甘草長七寸四十九莖浸廁坑中四十九日淨洗為末蜜丸瓶收遇中毒口中嚼化即解治中諸藥毒用甘草生黑豆淡竹葉等分以水一碗濃煎連服治中諸藥毒用四物湯香蘇散各一貼和煎服或萱草根研汁飲之治中諸藥毒用蠶故紙數張燒灰為末水調服治中烏頭巴豆毒用甘草煎湯入腹即定治中砒毒及巴豆毒用藍根砂糖相和擂水服或更加少薄荷汁尤妙治中砒毒鼠莽毒用金線重樓磨水服或用烏桕根擂水亦好治鼠莽毒用枯明礬同好茶末少許新汲水調服累驗治鼠莽草毒用大黑江豆煮汁服之如欲試其驗先刈鼠莽苗葉以豆汁澆其根即敗爛不復生治砒毒鼠莽毒用旋刺下羊血及雞鴨血熱服治中砒毒用地漿調鉛粉服立解豉汁亦佳治中巴豆毒用黃連大豆菖蒲汁並解之治一切菌毒掘新地窟以冷水於內攪之令濁澄少頃取飲之治中諸毒用黃連甘草節水一碗煎服治食河肫魚毒一時困殆倉卒無藥急入清油多灌之使毒物盡吐出為愈治諸毒用玉簪花根擂水服治中烏頭天雄附子毒用大豆汁遠志防風棗肉飴糖並能解之治食楓樹菌中毒令人笑不止用地漿飲之即瘥治食馬肝牛肉中毒用人乳和豉汁服之神效治食自死鳥獸肝中毒用頭巾垢一錢匕沸湯化服之治一切草藥毒用白扁豆生嚼及煎湯服治食諸毒肉吐血不止痿黃甚者用蔥子一升洗煮使破取汁停冷服半升日夜各一服血定止治食水芹中毒蓋春秋二時龍帶精入芹菜中人遇食之手青肚腹脹滿痛不可忍用硬糖二三升服之日二度吐出蜥蜴二三便瘥又方用餳粳米杏仁乳餅煮粥食一二碗日三服吐出蛟子有兩頭治藥毒上攻用蜂房甘草等分麩炒食去麩為末水二碗煎一碗臨睡溫頓服明日取下惡物治百藥毒用甘草薺苨藍汁藍實大小豆汁服治菵毒用藍汁豆汁竹瀝大麻子汁六畜血貝齒屑蚯蚓類藕菱汁服治野葛毒用雞子清葛根汁甘草汁豬膏若已死口噤者以大竹筒盛用水注兩脅及臍上暖輒易之須臾口開藥入口便活用薺苨汁解之治斑蝥芫菁毒用豬膏大豆汁或鹽藍汁服治狼毒毒用杏仁藍汁血蘞鹽汁服治巴豆毒用黃連汁生藿汁大豆汁菖蒲汁煮寒水石汁服治藜蘆毒用雄黃溫湯煮蔥汁服治雄黃毒用防巳煎湯服治甘遂毒用大豆汁服治蜀椒毒用葵子汁桂汁豉汁人溺冷水土漿大蒜雞毛燒吸菸及水調服治半夏毒用生薑汁煮乾薑汁服治芫花毒用防己防風甘草桂汁服治莨菪毒用薺苨甘草汁犀角蟹汁服治大戟毒用菖蒲汁服治桔梗毒用白粥服治杏仁毒用藍子汁服治野芋毒用土漿人糞汁服治雞子毒用醇醋服治鐵毒用磁石末調服治食諸肉馬肝漏脯中毒用生韭汁韭根燒末頭垢燒豬骨末燒犬屎酒服豉汁亦佳治食金銀毒用鴨血雞子汁服水銀數兩即出水淋雞屎汁服治食諸魚中毒用橘皮汁大豆汁馬鞭草汁蘆葦根汁大黃汁煮朴硝汁及鮫魚皮燒灰調服治食蟹中毒用生藕汁冬瓜汁紫蘇汁煮蒜汁服治食諸菜毒用甘草貝齒胡粉三種末水和服之治飲食中毒心煩悶用苦參煮汁飲之令吐出即止治服石藥中毒用白鴨屎汁人參汁服治服藥過劑悶亂者用吞鴨子黃藍汁地漿水和胡粉蘘荷汁粳米粉汁豉汁乾薑黃連末飴糖水和葛粉飲又燒犀角末水服方寸匕治食狗肉不消心下堅脹口乾發熱妄語用杏仁一升去皮水三升煎沸去渣為三服利下肉為度治食野茵中毒用甘草不拘多少以麻油一盞煎數沸去渣冷服即解治百毒及食諸物中毒用甘草二兩銼細水三盞煎減半去渣停冷每服半盞細細飲之未效更服或吐無妨一方加大豆同煎尤驗治中諸藥毒死但心間暖不妨乃是熱物犯之用防風一二兩擂冷水與服乾者為末冷水調服又方用白扁豆花擂水服又方用綠豆粉調水服又方用米糖調水服又方用生薑擂水服但不可以熱物與食
